<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V41.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; padding-bottom: 90px; }
        
        /* Layout Struk 80mm V41.7 */
        #receipt-canvas { 
            background: white; 
            width: 80mm; 
            padding: 20px; 
            color: black; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0 auto;
        }

        #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
        
        @media print {
            body * { visibility: hidden; }
            #receipt-canvas, #receipt-canvas * { visibility: visible; }
            #receipt-canvas { position: absolute; left: 0; top: 0; width: 80mm !important; }
        }
    </style>
</head>
<body>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div id="receipt-content" style="font-size: 14px; line-height: 1.4;"></div>
        </div>
        
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mt-8">
            <button onclick="connectBluetooth()" class="bg-blue-600 text-white py-5 rounded-2xl font-black text-sm uppercase shadow-xl flex items-center justify-center gap-2">
                📲 PILIH PRINTER BLUETOOTH
            </button>
            <button onclick="window.print()" class="bg-white/20 text-white py-4 rounded-2xl font-black text-xs uppercase border border-white/40">
                📄 SIMPAN PDF / CETAK SISTEM
            </button>
            <button onclick="closePreview()" class="bg-red-500/20 text-red-400 py-3 rounded-xl font-bold text-xs uppercase">
                TUTUP
            </button>
        </div>
    </div>

    <div class="bg-blue-700 text-white p-5 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div><h1 id="shopTitle" class="font-black text-lg uppercase tracking-tight">KASIR PRO</h1><p class="text-[10px] opacity-70">HYBRID SYSTEM V41.9 • 80MM</p></div>
        <button onclick="switchTab('ambil')" class="bg-blue-800 p-3 rounded-xl text-sm border border-blue-500">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border space-y-3">
                <select id="prodSelect" class="w-full bg-slate-50 p-4 rounded-2xl font-black text-sm border-2 border-slate-100 outline-none focus:border-blue-500"></select>
                <div class="flex gap-2">
                    <input type="number" id="saleQty" value="1" class="w-20 bg-slate-50 p-4 rounded-2xl text-center font-black border-2 border-slate-100">
                    <button onclick="addItem()" class="flex-1 bg-blue-600 text-white rounded-2xl font-black uppercase shadow-lg">TAMBAH</button>
                </div>
            </div>

            <div id="cartItems" class="space-y-2"></div>

            <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold opacity-40 uppercase">Tagihan</span>
                    <span class="text-3xl font-black text-blue-400">Rp <span id="totalTxt">0</span></span>
                </div>
                <input type="number" id="payInput" oninput="calcChange()" placeholder="BAYAR" class="w-full bg-slate-800 p-5 rounded-2xl text-emerald-400 font-black text-center text-2xl outline-none border-2 border-slate-700">
                <div class="flex justify-between font-bold text-orange-400 px-2">
                    <span class="text-xs">KEMBALI</span>
                    <span>Rp <span id="changeTxt">0</span></span>
                </div>
                <button onclick="checkout()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl">SIMPAN & CETAK</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <button onclick="runAudit()" class="w-full bg-white text-blue-600 border-2 border-blue-600 py-4 rounded-2xl font-black uppercase text-xs">📊 GENERATE AUDIT 80MM</button>
            <div id="stockList" class="space-y-2"></div>
        </div>

        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-3xl border space-y-4">
                <input type="text" id="storeName" placeholder="NAMA TOKO" class="w-full p-4 bg-slate-50 rounded-xl font-bold border">
                <button onclick="saveStore()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs">Simpan Nama Toko</button>
                <hr>
                <button onclick="document.getElementById('fileIn').click()" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold text-xs uppercase">📂 IMPORT DATA CSV</button>
                <input type="file" id="fileIn" class="hidden" onchange="importData(event)">
            </div>
        </div>

        <div id="sec-laporan" class="hidden space-y-2"></div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active">KASIR</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black">STOK</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black">RIWAYAT</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black">SISTEM</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('v41_data')) || [];
        let conf = JSON.parse(localStorage.getItem('v41_conf')) || { name: "KASIR TOKO", hp: "08XX" };
        let history = JSON.parse(localStorage.getItem('v41_hist')) || [];
        let cart = [];

        function init() {
            document.getElementById('storeName').value = conf.name;
            document.getElementById('shopTitle').innerText = conf.name;
            updateDropdown();
        }

        // --- BLUETOOTH POPUP (V41.8 Logic) ---
        async function connectBluetooth() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });
                alert("Berhasil terhubung ke: " + device.name);
            } catch (err) {
                alert("Pencarian dibatalkan atau bluetooth tidak aktif.");
            }
        }

        // --- TRANSAKSI & 80MM (V41.7 Layout) ---
        function checkout() {
            const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            const pay = parseInt(document.getElementById('payInput').value) || 0;
            if (total === 0 || pay < total) return alert("Cek Keranjang & Pembayaran!");

            const trx = {
                id: "INV" + Date.now().toString().slice(-6),
                date: new Date().toLocaleString('id-ID'),
                items: [...cart],
                total: total, pay: pay, change: pay - total
            };

            trx.items.forEach(c => {
                const i = db.find(d => d.name === c.name);
                if(i) { i.qty -= c.qty; i.sold = (i.sold || 0) + c.qty; }
            });

            history.unshift(trx);
            localStorage.setItem('v41_data', JSON.stringify(db));
            localStorage.setItem('v41_hist', JSON.stringify(history));

            const html = `
                <div style="text-align:center; margin-bottom:15px;">
                    <b style="font-size:20px;">${conf.name}</b><br>KERTAS LEBAR 80MM
                </div>
                <div style="border-top:1px dashed #000; margin:8px 0;"></div>
                <table style="width:100%; font-size:13px;">
                    <tr><td>NOTA: ${trx.id}</td><td align="right">${trx.date}</td></tr>
                </table>
                <div style="border-top:1px dashed #000; margin:8px 0;"></div>
                <table style="width:100%; font-size:14px;">
                    ${trx.items.map(it => `
                        <tr><td colspan="2"><b>${it.name.toUpperCase()}</b></td></tr>
                        <tr><td>${it.qty} x ${it.price.toLocaleString()}</td><td align="right">Rp ${(it.price*it.qty).toLocaleString()}</td></tr>
                    `).join('')}
                </table>
                <div style="border-top:1px dashed #000; margin:8px 0;"></div>
                <table style="width:100%; font-size:16px; font-weight:bold;">
                    <tr><td>TOTAL</td><td align="right">Rp ${total.toLocaleString()}</td></tr>
                </table>
                <div style="font-size:13px;">
                    <div>BAYAR : ${pay.toLocaleString()}</div>
                    <div>KEMBALI : ${trx.change.toLocaleString()}</div>
                </div>
                <div style="border-top:1px dashed #000; margin:10px 0;"></div>
                <div style="text-align:center; font-size:12px;">TERIMA KASIH</div>
            `;

            document.getElementById('receipt-content').innerHTML = html;
            document.getElementById('preview-modal').style.display = 'flex';
            
            cart = []; renderCart(); updateDropdown();
            document.getElementById('payInput').value = "";
        }

        // --- SISTEM PENDUKUNG ---
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderStock();
            if(t==='laporan') renderHistory();
        }

        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">- PILIH BARANG -</option>';
            db.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} [Stok:${it.qty}]</option>`);
        }

        function addItem() {
            const i = document.getElementById('prodSelect').value;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            if(i==="") return;
            if(q > db[i].qty) return alert("Stok kurang!");
            const ex = cart.find(c => c.name === db[i].name);
            if(ex) ex.qty += q; else cart.push({name: db[i].name, price: db[i].price, qty: q});
            renderCart();
        }

        function renderCart() {
            document.getElementById('cartItems').innerHTML = cart.map((c, i) => `<div class="bg-white p-4 rounded-2xl flex justify-between shadow-sm border"><span>${c.name} (${c.qty})</span><button onclick="cart.splice(${i},1);renderCart()" class="text-red-500 font-bold">×</button></div>`).join('');
            const t = cart.reduce((a,b) => a+(b.price*b.qty), 0);
            document.getElementById('totalTxt').innerText = t.toLocaleString();
            calcChange();
        }

        function calcChange() {
            const t = cart.reduce((a,b) => a+(b.price*b.qty), 0);
            const p = parseInt(document.getElementById('payInput').value) || 0;
            document.getElementById('changeTxt').innerText = (p>=t) ? (p-t).toLocaleString() : "0";
        }

        function renderStock() {
            document.getElementById('stockList').innerHTML = db.map((it, i) => `<div class="bg-white p-4 rounded-xl border flex justify-between"><b>${it.name} (${it.qty})</b><button onclick="db.splice(${i},1);localStorage.setItem('v41_data',JSON.stringify(db));renderStock()" class="text-red-400">HAPUS</button></div>`).join('');
        }

        function runAudit() {
            let total = 0;
            const rows = db.map(it => {
                const sub = (it.sold || 0) * it.price; total += sub;
                return `<tr><td>${it.name.substring(0,15)}</td><td align="center">${it.qty}</td><td align="center">${it.sold||0}</td><td align="right">${sub.toLocaleString()}</td></tr>`;
            }).join('');
            document.getElementById('receipt-content').innerHTML = `<center><b>LAPORAN AUDIT 80MM</b></center><hr>${rows}<hr><b>TOTAL OMZET: Rp ${total.toLocaleString()}</b>`;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function renderHistory() {
            document.getElementById('sec-laporan').innerHTML = history.map((h, i) => `<div class="bg-white p-4 rounded-xl border flex justify-between mb-2"><span>${h.id} - Rp ${h.total.toLocaleString()}</span><button onclick="reprint(${i})" class="bg-slate-800 text-white px-3 py-1 rounded-lg">STRUK</button></div>`).join('');
        }

        function reprint(i) {
            const h = history[i];
            document.getElementById('receipt-content').innerHTML = `<center><b>COPY NOTA</b></center><hr>ID: ${h.id}<br>TOTAL: ${h.total.toLocaleString()}`;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function importData(e) {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = function(ev) {
                const lines = ev.target.result.split('\n');
                let newDb = [];
                for(let i=0; i<lines.length; i++) {
                    const c = lines[i].split(lines[i].includes(';') ? ';' : ',');
                    if(c.length >= 2) newDb.push({ name: c[0].trim().toUpperCase(), price: parseInt(c[1].replace(/[^\d]/g,'')), qty: parseInt(c[2]||0), sold: 0 });
                }
                db = newDb; localStorage.setItem('v41_data', JSON.stringify(db)); location.reload();
            };
            r.readAsText(f);
        }

        function saveStore() {
            conf.name = document.getElementById('storeName').value.toUpperCase();
            localStorage.setItem('v41_conf', JSON.stringify(conf));
            location.reload();
        }

        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }

        init();
    </script>
</body>
</html>
