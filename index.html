<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V38.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Optimasi Tampilan Android */
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-sizing: border-box; }
        body { background-color: #f8fafc; font-family: sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* CSS KHUSUS NOTA THERMAL */
        #receipt-canvas { 
            background: white; 
            width: 100%; /* Menyesuaikan container modal */
            max-width: 80mm; /* Standar maksimal thermal */
            margin: 0 auto;
            padding: 10px 0; /* Padding vertikal saja */
            color: black; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 12px;
            line-height: 1.2;
        }

        .receipt-inner { padding: 0 5px; } /* Margin kecil agar teks tidak terpotong printer */

        /* Garis Pemisah Full Sampai Tepi */
        .full-line { 
            border-top: 1px dashed black; 
            width: 100%; 
            margin: 8px 0;
        }

        /* Tabel Detail Barang agar Sejajar */
        .receipt-table { width: 100%; border-collapse: collapse; margin: 5px 0; }
        .receipt-table th { text-align: left; border-bottom: 1px dashed black; padding: 5px 0; font-size: 10px; }
        .receipt-table td { padding: 4px 0; vertical-align: top; font-size: 11px; }
        
        .col-nama { width: 40%; }
        .col-hrg { width: 25%; text-align: right; }
        .col-qty { width: 10%; text-align: center; }
        .col-tot { width: 25%; text-align: right; }

        /* UI Helpers */
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 900; }
        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none;
            flex-direction: column; align-items: center; padding: 20px; overflow-y: auto;
        }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div class="receipt-inner">
                <div id="receipt-content">
                    </div>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 w-full max-w-xs mt-6">
            <button onclick="confirmAction('jpg')" class="bg-orange-500 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">💾 JPG</button>
            <button onclick="printBluetooth()" class="bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">🖨️ PRINT</button>
            <button onclick="closePreview()" class="bg-red-600 text-white py-4 rounded-2xl font-black text-xs col-span-2 uppercase">KEMBALI</button>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-5 flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 id="shopNameDisplay" class="font-black text-lg tracking-tight uppercase">KASIR PRO</h1>
            <p id="shopAddrDisplay" class="text-[10px] opacity-60 uppercase">V38.4 Pro Layout</p>
        </div>
        <button onclick="toggleSettings()" class="bg-slate-800 p-3 rounded-xl font-bold">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border space-y-3">
                <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="w-full bg-slate-50 p-4 rounded-2xl text-sm font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <select id="prodSelect" class="flex-1 bg-blue-50 p-4 rounded-2xl font-black text-sm outline-none border-none"></select>
                    <input type="number" id="saleQty" value="1" class="w-20 bg-slate-50 p-4 rounded-2xl text-center font-black">
                </div>
                <button onclick="addSaleItem()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg uppercase">+ Tambah</button>
            </div>
            <div id="saleList" class="bg-white p-4 rounded-2xl border min-h-[100px] space-y-2"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[40px] shadow-2xl space-y-4">
                <div class="flex justify-between items-center"><span class="text-xs font-bold opacity-50 uppercase">Total</span><span class="text-2xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="saleDiscount" oninput="calculateSale()" placeholder="DISC" class="bg-slate-800 p-4 rounded-2xl text-red-400 font-bold outline-none">
                    <input type="number" id="salePay" oninput="calculateSale()" placeholder="BAYAR" class="bg-slate-800 p-4 rounded-2xl text-emerald-400 font-bold outline-none">
                </div>
                <button onclick="finalProcess('PENJUALAN')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest active:scale-95">Bayar & Cetak</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div id="inventoryStatus" class="space-y-3"></div>
        </div>

        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-emerald-600 p-6 rounded-[40px] space-y-3 shadow-xl">
                <input type="text" id="restockName" placeholder="NAMA BARANG" class="w-full p-4 rounded-2xl font-black uppercase">
                <div class="flex gap-2"><input type="number" id="restockPrice" placeholder="HARGA" class="flex-1 p-4 rounded-2xl font-black"><input type="number" id="restockQty" placeholder="QTY" class="w-24 p-4 rounded-2xl font-black"></div>
                <button onclick="addToRestockList()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">+ Simpan</button>
            </div>
            <div id="restockListContainer" class="bg-white p-4 rounded-3xl border"></div>
        </div>

        <div id="sec-laporan" class="hidden space-y-3">
            <div id="historyList"></div>
        </div>
    </div>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-3">
            <input type="text" id="cfgNama" oninput="saveConfig()" placeholder="NAMA TOKO" class="w-full border p-3 rounded-xl uppercase font-bold">
            <input type="text" id="cfgAlamat" oninput="saveConfig()" placeholder="ALAMAT" class="w-full border p-3 rounded-xl uppercase">
            <input type="text" id="cfgHp" oninput="saveConfig()" placeholder="NO HP" class="w-full border p-3 rounded-xl">
            <input type="text" id="cfgFooter" oninput="saveConfig()" placeholder="FOOTER" class="w-full border p-3 rounded-xl uppercase">
            <button onclick="toggleSettings()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase mt-4">Simpan</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-4 text-[10px] font-black tab-active uppercase">🛒 Kasir</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-4 text-[10px] font-black text-red-600 uppercase">📊 Stok</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-4 text-[10px] font-black text-emerald-600 uppercase">➕ Item</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-4 text-[10px] font-black text-blue-600 uppercase">📜 Riwayat</button>
    </div>

    <script>
        // Database logic
        let inventory = JSON.parse(localStorage.getItem('v38_stok')) || [];
        let soldData = JSON.parse(localStorage.getItem('v38_sold')) || {};
        let config = JSON.parse(localStorage.getItem('v38_conf')) || { nama: "NAMA TOKO", alamat: "ALAMAT", hp: "08XX", footer: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v38_hist')) || [];
        let tempCart = [], tempRestockList = [];

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgHp').value = config.hp;
            document.getElementById('cfgFooter').value = config.footer;
            updateUI(); updateDropdown();
        }

        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        function saveConfig() {
            config = { 
                nama: document.getElementById('cfgNama').value.toUpperCase(), 
                alamat: document.getElementById('cfgAlamat').value.toUpperCase(), 
                hp: document.getElementById('cfgHp').value, 
                footer: document.getElementById('cfgFooter').value.toUpperCase() 
            };
            localStorage.setItem('v38_conf', JSON.stringify(config)); updateUI();
        }
        function updateUI() {
            document.getElementById('shopNameDisplay').innerText = config.nama;
            document.getElementById('shopAddrDisplay').innerText = config.alamat;
        }

        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderInventory();
            if(t==='laporan') renderHistory();
        }

        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">-- PILIH BARANG --</option>';
            inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (${it.qty})</option>`);
        }

        function addSaleItem() {
            const i = document.getElementById('prodSelect').value; if(i==="") return;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const item = inventory[i];
            if(q > item.qty) return alert("STOK KURANG!");
            const ex = tempCart.find(c => c.name === item.name);
            if(ex) ex.qty += q; else tempCart.push({name: item.name, price: item.price, qty: q});
            renderSaleList();
        }

        function renderSaleList() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border-b">
                    <div><b class="text-xs">${c.name}</b><br><span class="text-[10px] opacity-40">${c.qty} x ${c.price.toLocaleString()}</span></div>
                    <button onclick="tempCart.splice(${i},1);renderSaleList()" class="text-red-500 font-bold px-2">✖</button>
                </div>
            `).join('') || "<p class='text-center opacity-20 py-10 italic text-xs uppercase'>KOSONG</p>";
            calculateSale();
        }

        function calculateSale() {
            const sub = tempCart.reduce((a,b)=> a+(b.price*b.qty), 0);
            const disc = parseInt(document.getElementById('saleDiscount').value) || 0;
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            const tot = sub - disc;
            document.getElementById('displayTotal').innerText = tot.toLocaleString();
            return {sub, disc, pay, tot, change: pay-tot};
        }

        function finalProcess(m) {
            if(tempCart.length === 0 && m === 'PENJUALAN') return alert("Kosong!");
            const v = calculateSale();
            const trx = { 
                type:m, date: new Date().toLocaleString('id-ID'), 
                id: 'INV'+Date.now().toString().slice(-6),
                ...v, items: [...tempCart], cust: document.getElementById('custName').value.toUpperCase() || "UMUM" 
            };
            window.activeTrx = trx;
            showReceipt(trx);
        }

        // LAYOUT NOTA TERBARU (THERMAL OPTIMIZED)
        function showReceipt(trx) {
            let itemsRows = trx.items.map(it => `
                <tr>
                    <td class="col-nama">${it.name.toUpperCase()}</td>
                    <td class="col-hrg">${it.price.toLocaleString()}</td>
                    <td class="col-qty">${it.qty}</td>
                    <td class="col-tot">${(it.qty*it.price).toLocaleString()}</td>
                </tr>
            `).join('');

            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;">
                    <b style="font-size:16px; display:block;">${config.nama}</b>
                    <span style="font-size:10px;">${config.alamat}</span><br>
                    <span style="font-size:10px;">TELP: ${config.hp}</span>
                </div>

                <div class="full-line"></div>
                
                <div style="font-size:10px; display:flex; justify-content:space-between;">
                    <span>NO: ${trx.id}</span>
                    <span>${trx.date.split(',')[0]}</span>
                </div>
                <div style="font-size:10px;">KASIR: ANDROID | PLG: ${trx.cust}</div>

                <div class="full-line"></div>

                <table class="receipt-table">
                    <thead>
                        <tr>
                            <th class="col-nama">ITEM</th>
                            <th class="col-hrg">HRG</th>
                            <th class="col-qty">QTY</th>
                            <th class="col-tot">TOT</th>
                        </tr>
                    </thead>
                    <tbody>${itemsRows}</tbody>
                </table>

                <div class="full-line"></div>

                <div style="font-size:11px;">
                    <div style="display:flex; justify-content:space-between;"><span>SUBTOTAL</span><span>${trx.sub.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between; color:red;"><span>DISKON</span><span>-${trx.disc.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px; margin-top:4px;"><span>TOTAL</span><span>Rp ${trx.tot.toLocaleString()}</span></div>
                    <div class="full-line"></div>
                    <div style="display:flex; justify-content:space-between;"><span>TUNAI</span><span>${trx.pay.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>KEMBALI</span><span>${trx.change.toLocaleString()}</span></div>
                </div>

                <div class="full-line" style="border-top-style: double; border-top-width: 3px;"></div>
                
                <div style="text-align:center; font-size:10px; margin-top:5px;">
                    ${config.footer}<br>
                    *** TERIMA KASIH ***
                </div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        async function printBluetooth() {
            const trx = window.activeTrx;
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                
                // ESC/POS Alignment & Commands
                let c = '\x1b\x40\x1b\x61\x01\x1b\x21\x30'+config.nama+'\n\x1b\x21\x00'+config.alamat+'\n'+config.hp+'\n--------------------------------\n\x1b\x61\x00';
                c += `NO : ${trx.id}\nTGL: ${trx.date}\nPLG: ${trx.cust}\n--------------------------------\n`;
                trx.items.forEach(it => {
                    let n = it.name.toUpperCase().substring(0, 15);
                    c += `${n}\n${it.price.toLocaleString()} x ${it.qty} = ${(it.qty*it.price).toLocaleString()}\n`;
                });
                c += `--------------------------------\nTOTAL: Rp ${trx.tot.toLocaleString()}\n--------------------------------\n\x1b\x61\x01${config.footer}\n\n\n\n`;
                
                await char.writeValue(new TextEncoder().encode(c));
                confirmAction('none');
            } catch (err) { alert("Aktifkan Bluetooth & GPS!"); }
        }

        async function confirmAction(type) {
            const trx = window.activeTrx;
            if(!trx.isReprint) {
                trx.items.forEach(it => {
                    const inv = inventory.find(i=>i.name===it.name);
                    inv.qty -= it.qty; soldData[it.name] = (soldData[it.name]||0)+it.qty;
                });
                historyTrx.unshift(trx);
                localStorage.setItem('v38_stok', JSON.stringify(inventory));
                localStorage.setItem('v38_sold', JSON.stringify(soldData));
                localStorage.setItem('v38_hist', JSON.stringify(historyTrx));
            }
            if(type === 'jpg') {
                const canvas = await html2canvas(document.getElementById('receipt-canvas'), {scale:3});
                const l = document.createElement('a'); l.download = trx.id+'.jpg'; l.href = canvas.toDataURL(); l.click();
            }
            location.reload();
        }

        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
