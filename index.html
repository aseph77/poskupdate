<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V49.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 100px; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
        #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; }
        #receipt-canvas { background: white; width: 80mm; padding: 5mm; color: black; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.2; }
        pre { white-space: pre-wrap; font-family: inherit; margin: 0; width: 100%; }
        input, select, textarea { border: 2px solid #e2e8f0; outline: none; border-radius: 12px; padding: 12px; font-weight: bold; width: 100%; font-size: 13px; }
        input:focus { border-color: #2563eb; background: #f8faff; }
        .btn-satuan { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 900; font-size: 10px; text-align: center; cursor: pointer; background: #fff; }
        .btn-satuan.active { background: #2563eb; color: white; border-color: #2563eb; }
    </style>
</head>
<body>

    <div class="bg-blue-600 text-white p-5 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div><h1 id="shopDisplay" class="font-black text-lg uppercase">KASIR PRO</h1><p id="addrDisplay" class="text-[9px] opacity-70"></p></div>
        <div class="flex gap-2">
            <button onclick="exportDB()" class="bg-blue-500 p-2 rounded-lg text-[10px] font-bold">EXP</button>
            <button onclick="document.getElementById('importFile').click()" class="bg-blue-500 p-2 rounded-lg text-[10px] font-bold">IMP</button>
            <input type="file" id="importFile" class="hidden" onchange="importDB(this)">
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-[2rem] shadow-xl border border-blue-100 space-y-4">
                <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="uppercase bg-slate-50 font-black">
                <select id="prodSelect" onchange="handleProductChange()" class="bg-white text-blue-600 font-black"></select>
                
                <div id="unitSelector" class="flex gap-2 hidden">
                    <div onclick="setUnit('BKS')" id="unit-BKS" class="btn-satuan">BKS<br><span id="p-BKS" class="text-[9px] opacity-60">0</span></div>
                    <div onclick="setUnit('PAK')" id="unit-PAK" class="btn-satuan">PAK<br><span id="p-PAK" class="text-[9px] opacity-60">0</span></div>
                    <div onclick="setUnit('BALL')" id="unit-BALL" class="btn-satuan">BALL<br><span id="p-BALL" class="text-[9px] opacity-60">0</span></div>
                </div>

                <div class="flex gap-2">
                    <div class="w-1/2 text-center"><label class="text-[9px] font-bold">QTY</label><input type="number" id="saleQty" value="1" class="text-center text-xl"></div>
                    <div class="w-1/2 text-center"><label class="text-[9px] font-bold text-red-500">POTONGAN (RP)</label><input type="number" id="saleDisc" value="0" class="text-center text-xl text-red-500"></div>
                </div>
                <button onclick="addSaleItem()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-md active:scale-95 transition-all">TAMBAH KE KERANJANG</button>
            </div>
            
            <div id="saleList" class="space-y-2"></div>
            
            <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl space-y-4">
                <div class="flex justify-between items-center text-blue-400">
                    <span class="text-[10px] font-bold opacity-50 uppercase">TOTAL TAGIHAN</span>
                    <span class="text-3xl font-black">Rp <span id="displayTotal">0</span></span>
                </div>
                
                <div class="flex gap-2">
                    <input type="number" id="salePay" oninput="calculateChange()" placeholder="BAYAR" class="flex-1 bg-slate-800 p-5 text-emerald-400 font-black text-center text-2xl border-none">
                    <button onclick="setUangPas()" class="bg-blue-600 px-4 rounded-xl font-black text-xs uppercase">Uang Pas</button>
                </div>

                <div class="flex justify-between text-xs font-bold px-2">
                    <span>KEMBALIAN:</span><span id="displayChange" class="text-emerald-400">Rp 0</span>
                </div>
                <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase shadow-lg active:scale-95">CETAK STRUK</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-3xl shadow-sm border-2 border-blue-50 grid grid-cols-2 gap-3">
                <button onclick="printStockAudit()" class="bg-blue-600 text-white py-4 rounded-2xl font-black text-[11px] uppercase">📊 LAPORAN AUDIT</button>
                <button onclick="resetSoldStats()" class="bg-orange-500 text-white py-4 rounded-2xl font-black text-[11px] uppercase">🔄 RESET DATA</button>
            </div>
            <div class="bg-white p-5 rounded-3xl border-2 border-blue-100 space-y-3">
                <input type="text" id="mngNama" placeholder="NAMA BARANG" class="uppercase">
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" id="mngBks" placeholder="HRG BKS">
                    <input type="number" id="mngPak" placeholder="HRG PAK">
                    <input type="number" id="mngBall" placeholder="HRG BALL">
                </div>
                <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2 rounded-xl">
                    <input type="number" id="mngPakKeBks" placeholder="Isi/Pak">
                    <input type="number" id="mngBallKeBks" placeholder="Isi/Ball">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="mngStok" placeholder="STOK (BKS)">
                    <input type="text" id="mngKet" placeholder="KET.">
                </div>
                <button onclick="updateMasterData()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-xs">Simpan / Update</button>
            </div>
            <div id="inventoryList" class="space-y-2"></div>
        </div>

        <div id="sec-laporan" class="hidden space-y-3"><div id="historyList" class="space-y-3"></div></div>
        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-3xl border-2 space-y-4 shadow-sm">
                <input type="text" id="cfgNama" placeholder="NAMA TOKO">
                <input type="text" id="cfgAlamat" placeholder="ALAMAT TOKO">
                <input type="text" id="cfgTelp" placeholder="NOMOR HP">
                <textarea id="cfgLogo" placeholder="LOGO TEXT ART" rows="3" class="font-mono text-xs"></textarea>
                <button onclick="saveSettings()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase">SIMPAN PROFIL</button>
                <button onclick="wipeAllData()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black text-xs">⚠️ RESET TOTAL</button>
            </div>
        </div>
    </div>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl"><pre id="receipt-content"></pre></div>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mt-6 px-4">
            <button onclick="connectAndPrint()" id="btnPrint" class="bg-blue-600 text-white py-5 rounded-2xl font-black text-sm uppercase">📲 KIRIM KE PRINTER</button>
            <button onclick="closePreview()" class="bg-white text-black py-3 rounded-xl font-bold text-xs uppercase border">TUTUP</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active uppercase">Kasir</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black uppercase">Stok</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black uppercase">Riwayat</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black uppercase">Profil</button>
    </div>

    <script>
        const CHAR_PER_LINE = 48;
        let inventory = JSON.parse(localStorage.getItem('v49_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v49_conf')) || { nama: "KASIR PRO", alamat: "", telp: "", logo: "" };
        let historyTrx = JSON.parse(localStorage.getItem('v49_hist')) || [];
        let tempCart = [];
        let selectedUnit = 'BKS';

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat || "";
            document.getElementById('cfgTelp').value = config.telp || "";
            document.getElementById('cfgLogo').value = config.logo || "";
            document.getElementById('shopDisplay').innerText = config.nama;
            document.getElementById('addrDisplay').innerText = config.alamat || "";
            updateDropdown(); renderHistory(); renderStock();
        }

        function pad(text, length, type = 'right') {
            text = (text || "").toString().substring(0, length);
            if (type === 'right') return text.padEnd(length, ' ');
            if (type === 'left') return text.padStart(length, ' ');
            if (type === 'center') {
                const p = length - text.length;
                return ' '.repeat(Math.floor(p/2)) + text + ' '.repeat(Math.ceil(p/2));
            }
            return text;
        }

        // --- KASIR LOGIC ---
        function setUangPas() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('salePay').value = tot;
            calculateChange();
        }

        function calculateChange() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            document.getElementById('displayChange').innerText = "Rp " + Math.max(0, pay - tot).toLocaleString();
        }

        function addSaleItem() {
            const idx = document.getElementById('prodSelect').value;
            if(idx === "") return;
            const it = inventory[idx];
            const qty = parseInt(document.getElementById('saleQty').value) || 1;
            const disc = parseInt(document.getElementById('saleDisc').value) || 0;
            
            let baseP = selectedUnit === 'BKS' ? it.p_bks : (selectedUnit === 'PAK' ? it.p_pak : it.p_ball);
            let conv = selectedUnit === 'BKS' ? 1 : (selectedUnit === 'PAK' ? it.pakKeBks : it.ballKeBks);

            // LOGIKA PENGGABUNGAN (Grouping): Jika nama & satuan sama, tambahkan QTY saja
            const existing = tempCart.find(item => item.name === it.name && item.unit === selectedUnit && item.disc === disc);
            if (existing) {
                existing.qty += qty;
            } else {
                tempCart.push({ name: it.name, unit: selectedUnit, base: baseP, price: baseP - disc, qty: qty, disc: disc, convFactor: conv });
            }
            
            renderCart(); calculateChange();
            document.getElementById('saleDisc').value = 0;
        }

        function renderCart() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                    <div><b class="text-xs uppercase">${c.name}</b><br><span class="text-[10px] text-blue-600 font-bold">${c.qty} ${c.unit} x ${c.base.toLocaleString()}</span></div>
                    <button onclick="tempCart.splice(${i},1);renderCart();calculateChange();" class="text-red-500 font-black px-3">×</button>
                </div>
            `).join('');
            document.getElementById('displayTotal').innerText = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0).toLocaleString();
        }

        // --- REPORTING (FIXED ALIGNMENT) ---
        function printStockAudit() {
            let grandTotalOmzet = 0;
            const line = "=".repeat(CHAR_PER_LINE);
            let s = `\n${pad("LAPORAN AUDIT STOK & OMZET", CHAR_PER_LINE, 'center')}\n${line}\n`;
            s += `${pad("NAMA", 15)}${pad("AWAL", 6, 'left')}${pad("SISA", 6, 'left')}${pad("LAKU", 6, 'left')}${pad("OMZET RIIL", 15, 'left')}\n`;
            s += `-`.repeat(CHAR_PER_LINE) + `\n`;
            
            inventory.forEach(it => {
                const sisa = it.qty;
                const laku = it.soldBks || 0;
                const awal = sisa + laku;
                const omzet = it.realRevenue || 0;
                grandTotalOmzet += omzet;
                s += `${pad(it.name, 15)}${pad(awal, 6, 'left')}${pad(sisa, 6, 'left')}${pad(laku, 6, 'left')}${pad(omzet.toLocaleString(), 15, 'left')}\n`;
            });
            
            s += `${line}\n`;
            // Perbaikan Jarak: Nominal disejajarkan dengan total
            s += pad("TOTAL OMZET BERSIH", 30) + pad(grandTotalOmzet.toLocaleString(), 18, 'left') + "\n\n";
            s += `${pad("DITERIMA OLEH,", 24, 'center')}${pad("PETUGAS TOKO,", 24, 'center')}\n\n\n\n(____________)          (____________)\n\n\n`;
            document.getElementById('receipt-content').innerText = s;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        // --- MASTER DATA ---
        function updateMasterData() {
            const nama = document.getElementById('mngNama').value.trim().toUpperCase();
            if(!nama) return;
            const data = {
                name: nama,
                p_bks: parseInt(document.getElementById('mngBks').value) || 0,
                p_pak: parseInt(document.getElementById('mngPak').value) || 0,
                p_ball: parseInt(document.getElementById('mngBall').value) || 0,
                pakKeBks: parseInt(document.getElementById('mngPakKeBks').value) || 1,
                ballKeBks: parseInt(document.getElementById('mngBallKeBks').value) || 1,
                qty: parseInt(document.getElementById('mngStok').value) || 0,
                ket: document.getElementById('mngKet').value,
                soldBks: 0, realRevenue: 0
            };
            const idx = inventory.findIndex(i => i.name === nama);
            if(idx > -1) { data.soldBks = inventory[idx].soldBks || 0; data.realRevenue = inventory[idx].realRevenue || 0; inventory[idx] = data; } 
            else inventory.push(data);
            localStorage.setItem('v49_stok', JSON.stringify(inventory));
            renderStock(); updateDropdown();
            ['mngNama','mngBks','mngPak','mngBall','mngPakKeBks','mngBallKeBks','mngStok','mngKet'].forEach(id => document.getElementById(id).value = '');
        }

        // --- TRANSACTION PROCESS ---
        function processTransaction() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            if(tot === 0 || pay < tot) return alert("Pembayaran kurang!");
            
            const trx = { id: "TX" + Date.now().toString().slice(-6), date: new Date().toLocaleString('id-ID'), customer: document.getElementById('custName').value.toUpperCase(), items: [...tempCart], total: tot, pay: pay, change: pay-tot };
            
            trx.items.forEach(c => {
                const it = inventory.find(i => i.name === c.name);
                if(it) {
                    const lakuBks = c.qty * c.convFactor;
                    it.qty -= lakuBks;
                    it.soldBks = (it.soldBks || 0) + lakuBks;
                    it.realRevenue = (it.realRevenue || 0) + (c.price * c.qty);
                }
            });

            historyTrx.unshift(trx);
            localStorage.setItem('v49_stok', JSON.stringify(inventory));
            localStorage.setItem('v49_hist', JSON.stringify(historyTrx));
            document.getElementById('receipt-content').innerText = generateReceipt(trx);
            document.getElementById('preview-modal').style.display = 'flex';
            tempCart = []; renderCart(); updateDropdown(); document.getElementById('salePay').value = '';
        }

        function generateReceipt(trx) {
            const line = "=".repeat(CHAR_PER_LINE);
            const dash = "-".repeat(CHAR_PER_LINE);
            let s = `\n${config.logo || pad(config.nama, CHAR_PER_LINE, 'center')}\n`;
            if(config.alamat) s += pad(config.alamat, CHAR_PER_LINE, 'center') + "\n";
            s += line + "\nID: " + trx.id + " | " + trx.date + "\nPLG: " + (trx.customer || 'UMUM') + "\n" + dash + "\n";
            
            trx.items.forEach(it => {
                // Tampilan Ringkas: Nama x Qty
                s += it.name.toUpperCase() + "\n";
                const row = `${it.qty} ${it.unit} x ${it.base.toLocaleString()}`;
                s += pad(row, 30) + pad((it.price*it.qty).toLocaleString(), 18, 'left') + "\n";
                if(it.disc > 0) s += pad("  (POTONGAN)", 30) + pad("-"+(it.disc*it.qty).toLocaleString(), 18, 'left') + "\n";
            });
            
            s += line + "\n" + pad("TOTAL", 30) + pad(trx.total.toLocaleString(), 18, 'left') + "\n" + pad("TUNAI", 30) + pad(trx.pay.toLocaleString(), 18, 'left') + "\n" + pad("KEMBALI", 30) + pad(trx.change.toLocaleString(), 18, 'left') + "\n" + dash + "\n" + pad("TERIMA KASIH", CHAR_PER_LINE, 'center') + "\n\n\n\n";
            return s;
        }

        // --- STANDAR UI ---
        function handleProductChange() {
            const idx = document.getElementById('prodSelect').value;
            if(idx === "") { document.getElementById('unitSelector').classList.add('hidden'); return; }
            const it = inventory[idx];
            document.getElementById('unitSelector').classList.remove('hidden');
            document.getElementById('p-BKS').innerText = it.p_bks.toLocaleString();
            document.getElementById('p-PAK').innerText = it.p_pak.toLocaleString();
            document.getElementById('p-BALL').innerText = it.p_ball.toLocaleString();
            setUnit('BKS');
        }
        function setUnit(u) { selectedUnit = u; ['BKS','PAK','BALL'].forEach(v => document.getElementById('unit-'+v).classList.remove('active')); document.getElementById('unit-'+u).classList.add('active'); }
        function renderStock() { document.getElementById('inventoryList').innerHTML = inventory.map(it => `<div class="bg-white p-4 rounded-2xl border shadow-sm mb-2"><div class="flex justify-between uppercase"><b class="text-[11px] text-blue-800">${it.name}</b><button onclick="editItem('${it.name}')" class="text-blue-500 text-[10px] font-bold">EDIT</button></div><div class="text-[9px] text-slate-400 font-bold mb-1">${it.ket || ''}</div><div class="grid grid-cols-3 gap-1 text-[9px] font-bold text-slate-500"><div>BKS: ${it.p_bks.toLocaleString()}</div><div>PAK: ${it.p_pak.toLocaleString()}</div><div>BALL: ${it.p_ball.toLocaleString()}</div></div><div class="mt-1 text-[11px] font-black text-blue-600 flex justify-between"><span>STOK: ${it.qty}</span><span class="text-emerald-600">RP ${it.realRevenue.toLocaleString()}</span></div></div>`).join(''); }
        function editItem(n) { const it = inventory.find(i => i.name === n); document.getElementById('mngNama').value = it.name; document.getElementById('mngBks').value = it.p_bks; document.getElementById('mngPak').value = it.p_pak; document.getElementById('mngBall').value = it.p_ball; document.getElementById('mngPakKeBks').value = it.pakKeBks; document.getElementById('mngBallKeBks').value = it.ballKeBks; document.getElementById('mngStok').value = it.qty; document.getElementById('mngKet').value = it.ket || ''; window.scrollTo(0,0); }
        function renderHistory() { document.getElementById('historyList').innerHTML = historyTrx.map(t => `<div class="bg-white p-4 rounded-2xl border flex justify-between shadow-sm"><div><div class="text-[9px] text-slate-400">${t.id}</div><div class="font-black text-sm">Rp ${t.total.toLocaleString()}</div><div class="text-[9px] text-blue-600 font-bold uppercase">${t.customer}</div></div><button onclick="reprint('${t.id}')" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-[10px] font-black">REPRINT</button></div>`).join(''); }
        function reprint(id) { const trx = historyTrx.find(t => t.id === id); if(trx) { document.getElementById('receipt-content').innerText = generateReceipt(trx); document.getElementById('preview-modal').style.display = 'flex'; } }
        function updateDropdown() { const s = document.getElementById('prodSelect'); s.innerHTML = '<option value="">- PILIH BARANG -</option>'; inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name}</option>`); }
        function switchTab(t) { ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden')); ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active')); document.getElementById('sec-'+t).classList.remove('hidden'); document.getElementById('t-'+t).classList.add('tab-active'); }
        function saveSettings() { config.nama = document.getElementById('cfgNama').value.toUpperCase(); config.alamat = document.getElementById('cfgAlamat').value.toUpperCase(); config.telp = document.getElementById('cfgTelp').value; config.logo = document.getElementById('cfgLogo').value; localStorage.setItem('v49_conf', JSON.stringify(config)); location.reload(); }
        function wipeAllData() { if(confirm("Hapus semua?")) { localStorage.clear(); location.reload(); } }
        function resetSoldStats() { if(confirm("Reset terjual?")) { inventory.forEach(it => { it.soldBks = 0; it.realRevenue = 0; }); localStorage.setItem('v49_stok', JSON.stringify(inventory)); renderStock(); } }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        function exportDB() { const b = new Blob([JSON.stringify({inventory, config, historyTrx})], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `DB_KASIR_V49.json`; a.click(); }
        function importDB(input) { const r = new FileReader(); r.onload = function() { const d = JSON.parse(r.result); inventory=d.inventory; config=d.config; historyTrx=d.historyTrx; localStorage.setItem('v49_stok', JSON.stringify(inventory)); localStorage.setItem('v49_conf', JSON.stringify(config)); localStorage.setItem('v49_hist', JSON.stringify(historyTrx)); location.reload(); }; r.readAsText(input.files[0]); }
        async function connectAndPrint() { const btn = document.getElementById('btnPrint'); const text = document.getElementById('receipt-content').innerText; try { btn.disabled = true; const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }], optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] }); const server = await device.gatt.connect(); const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb'); const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb'); const encoder = new TextEncoder(); const data = encoder.encode(text + "\n\n\n\n\n"); for (let i = 0; i < data.length; i += 20) { await char.writeValue(data.slice(i, i + 20)); await new Promise(r => setTimeout(r, 45)); } btn.disabled = false; } catch (e) { btn.disabled = false; alert("Printer tidak konek!"); } }
        init();
    </script>
</body>
</html>
