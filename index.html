<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V41.4 - BT Popup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 100px; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
        #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; }
        #receipt-canvas { background: white; width: 80mm; padding: 15px; color: black; font-family: monospace; }
        .full-line { border-top: 1px dashed black; margin: 8px 0; }
    </style>
</head>
<body>

    <div class="bg-blue-600 text-white p-5 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div><h1 id="shopDisplay" class="font-black text-lg uppercase">KASIR PRO</h1><p class="text-[9px] opacity-70 tracking-widest">BT POPUP VERSION 41.4</p></div>
        <button onclick="switchTab('ambil')" class="bg-blue-700 px-4 py-2 rounded-xl text-xs font-bold border border-blue-400 uppercase">System</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-[2rem] shadow-xl border border-blue-100 space-y-4">
                <select id="prodSelect" class="w-full bg-slate-50 p-4 rounded-2xl font-black text-sm outline-none border-2 border-slate-200 focus:border-blue-500"></select>
                <div class="flex gap-2">
                    <input type="number" id="saleQty" value="1" class="w-24 bg-slate-50 p-4 rounded-2xl text-center font-black border-2 border-slate-200">
                    <button onclick="addSaleItem()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-md active:scale-95 transition-transform">TAMBAH</button>
                </div>
            </div>
            
            <div id="saleList" class="space-y-2"></div>
            
            <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl space-y-4">
                <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-50 uppercase">Total Bayar</span><span class="text-3xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <input type="number" id="salePay" oninput="calculateChange()" placeholder="MASUKKAN PEMBAYARAN" class="w-full bg-slate-800 p-5 rounded-2xl text-emerald-400 font-black text-center text-2xl outline-none border-2 border-slate-700">
                <div class="flex justify-between px-2 font-bold text-orange-400"><span>KEMBALIAN</span><span>Rp <span id="displayChange">0</span></span></div>
                <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest shadow-lg active:bg-blue-700">BAYAR & SIMPAN</button>
            </div>
        </div>

        <div id="sec-ambil" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-[2rem] border-2 border-slate-200 space-y-4">
                <h3 class="font-black text-xs text-slate-400 uppercase">Database Tools</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportCSV()" class="bg-slate-100 p-4 rounded-xl font-bold text-[10px] uppercase border">💾 Export CSV</button>
                    <button onclick="document.getElementById('importInput').click()" class="bg-slate-100 p-4 rounded-xl font-bold text-[10px] uppercase border">📂 Import CSV</button>
                    <input type="file" id="importInput" class="hidden" accept=".csv" onchange="importCSV(event)">
                </div>
                <hr>
                <input type="text" id="cfgNama" placeholder="NAMA TOKO" class="w-full p-4 rounded-xl font-bold border-2">
                <button onclick="saveSettings()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs">Simpan Nama Toko</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-3" id="inventoryStatus"></div>
        <div id="sec-laporan" class="hidden space-y-3" id="historyList"></div>
    </div>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div id="receipt-content"></div>
        </div>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mt-6 px-4">
            <button onclick="openPrinterPopup()" class="bg-blue-600 text-white py-5 rounded-2xl font-black text-sm uppercase shadow-xl flex items-center justify-center gap-2">
                📲 HUBUNGKAN PRINTER BLUETOOTH
            </button>
            <button onclick="window.print()" class="bg-white/20 text-white py-4 rounded-2xl font-black text-xs uppercase border border-white/40">
                📄 CETAK SISTEM / PDF
            </button>
            <button onclick="closePreview()" class="bg-white text-black py-3 rounded-xl font-bold text-xs uppercase">TUTUP</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active">KASIR</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black uppercase">Stok</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black uppercase">Riwayat</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black uppercase">Sistem</button>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('v41_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v41_conf')) || { nama: "TOKO SAYA" };
        let historyTrx = JSON.parse(localStorage.getItem('v41_hist')) || [];
        let tempCart = [];

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('shopDisplay').innerText = config.nama;
            updateDropdown();
        }

        // --- FUNGSI POP-UP PRINTER (YANG ANDA MINTA) ---
        async function openPrinterPopup() {
            try {
                // Ini akan memicu Pop-up pilihan perangkat Bluetooth di Browser
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }], // UUID standar thermal printer
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });
                
                alert("Berhasil memilih perangkat: " + device.name);
                // Koneksi GATT bisa dilanjutkan di sini jika diperlukan pengiriman data RAW
            } catch (error) {
                console.log("Bluetooth Error: " + error);
                alert("Pencarian dibatalkan atau perangkat tidak didukung.");
            }
        }

        // --- LOGIC KASIR ASLI 41.4 ---
        function processTransaction() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            if(tot === 0 || pay < tot) return alert("Cek Keranjang/Pembayaran!");

            const trx = {
                id: "TRX" + Date.now().toString().slice(-6),
                date: new Date().toLocaleString('id-ID'),
                items: [...tempCart],
                total: tot, pay: pay, change: pay-tot
            };

            // Update Stok
            trx.items.forEach(c => {
                const item = inventory.find(i => i.name === c.name);
                if(item) item.qty -= c.qty;
            });

            historyTrx.unshift(trx);
            localStorage.setItem('v41_stok', JSON.stringify(inventory));
            localStorage.setItem('v41_hist', JSON.stringify(historyTrx));

            // Generate Struk 80mm
            document.getElementById('receipt-content').innerHTML = `
                <center><b style="font-size:18px;">${config.nama}</b><br>80mm Printer Mode</center>
                <div class="full-line"></div>
                <div style="font-size:11px;">ID: ${trx.id}<br>Tgl: ${trx.date}</div>
                <div class="full-line"></div>
                <table style="width:100%; font-size:12px;">
                    ${trx.items.map(it => `
                        <tr><td colspan="2">${it.name}</td></tr>
                        <tr><td>${it.qty} x ${it.price.toLocaleString()}</td><td align="right">${(it.price*it.qty).toLocaleString()}</td></tr>
                    `).join('')}
                </table>
                <div class="full-line"></div>
                <table style="width:100%; font-size:14px; font-weight:bold;">
                    <tr><td>TOTAL</td><td align="right">Rp ${tot.toLocaleString()}</td></tr>
                    <tr><td style="font-weight:normal; font-size:11px;">BAYAR</td><td align="right" style="font-weight:normal; font-size:11px;">${pay.toLocaleString()}</td></tr>
                    <tr><td style="font-weight:normal; font-size:11px;">KEMBALI</td><td align="right" style="font-weight:normal; font-size:11px;">${trx.change.toLocaleString()}</td></tr>
                </table>
                <div class="full-line"></div>
                <center style="font-size:11px;">TERIMA KASIH</center>
            `;
            
            document.getElementById('preview-modal').style.display = 'flex';
            tempCart = []; renderCart(); updateDropdown();
            document.getElementById('salePay').value = '';
        }

        // --- UTILS & TABS ---
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderStock();
            if(t==='laporan') renderHistory();
        }

        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">- PILIH PRODUK -</option>';
            inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} [Stok:${it.qty}]</option>`);
        }

        function addSaleItem() {
            const idx = document.getElementById('prodSelect').value;
            if(idx === "") return;
            const qty = parseInt(document.getElementById('saleQty').value) || 1;
            const it = inventory[idx];
            if(qty > it.qty) return alert("Stok kurang!");
            const exist = tempCart.find(c => c.name === it.name);
            if(exist) exist.qty += qty; else tempCart.push({name: it.name, price: it.price, qty: qty});
            renderCart();
        }

        function renderCart() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between shadow-sm border border-slate-100">
                    <span class="text-xs font-black">${c.name} (${c.qty})</span>
                    <button onclick="tempCart.splice(${i},1);renderCart();" class="text-red-500 font-bold px-4">×</button>
                </div>
            `).join('');
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('displayTotal').innerText = tot.toLocaleString();
            calculateChange();
        }

        function calculateChange() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            document.getElementById('displayChange').innerText = (pay >= tot) ? (pay-tot).toLocaleString() : "0";
        }

        function renderStock() {
            document.getElementById('inventoryStatus').innerHTML = inventory.map((it, i) => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                    <b class="text-xs uppercase">${it.name} (Stok: ${it.qty})</b>
                    <button onclick="inventory.splice(${i},1);localStorage.setItem('v41_stok', JSON.stringify(inventory));renderStock();" class="text-red-500 text-[10px] font-bold">HAPUS</button>
                </div>
            `).join('');
        }

        function renderHistory() {
            document.getElementById('historyList').innerHTML = historyTrx.map((t) => `
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="text-[10px] font-bold">${t.id} | ${t.date}</div>
                    <div class="text-blue-600 font-black">Rp ${t.total.toLocaleString()}</div>
                </div>
            `).join('') || "<p class='text-center py-10 opacity-30'>Tidak ada riwayat.</p>";
        }

        function importCSV(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const lines = text.split('\n');
                let newInv = [];
                for(let i=0; i<lines.length; i++) {
                    const cols = lines[i].split(lines[i].includes(';') ? ';' : ',');
                    if(cols.length >= 2) {
                        newInv.push({ name: cols[0].trim().toUpperCase(), price: parseInt(cols[1].replace(/[^\d]/g,'')), qty: parseInt(cols[2]||0) });
                    }
                }
                inventory = newInv;
                localStorage.setItem('v41_stok', JSON.stringify(inventory));
                location.reload();
            };
            reader.readAsText(file);
        }

        function exportCSV() {
            let csv = "Nama,Harga,Stok\n";
            inventory.forEach(it => csv += `${it.name},${it.price},${it.qty}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Data_Kasir.csv'; a.click();
        }

        function saveSettings() {
            config.nama = document.getElementById('cfgNama').value.toUpperCase();
            localStorage.setItem('v41_conf', JSON.stringify(config));
            location.reload();
        }

        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }

        init();
    </script>
</body>
</html>
