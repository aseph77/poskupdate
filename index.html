<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASIR PRO V52.9.3 - MAX WIDTH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: 'Courier New', monospace; padding-bottom: 100px; }
        #preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 5px; }
        /* Font diperkecil dan line-height dibuat sangat rapat untuk tepian kertas */
        .receipt-paper { 
            background: white; 
            width: 100%; 
            max-width: 440px; 
            padding: 10px 5px; 
            font-family: 'Courier New', monospace; 
            white-space: pre; 
            font-size: 11px; 
            line-height: 1.0; 
            letter-spacing: -0.2px;
            color: #000; 
        }
        .tab-active { color: #2563eb; background: #f1f5f9; border-top: 4px solid #2563eb; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; height: 75px; z-index: 1000; border-top: 1px solid #e2e8f0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body>

    <div id="preview-overlay">
        <div class="flex flex-col w-full items-center">
            <div id="receipt-content" class="receipt-paper"></div>
            <div class="flex gap-1 w-full max-w-[440px] mt-4">
                <button onclick="closePreview()" class="flex-1 bg-red-600 text-white py-4 rounded-xl font-black uppercase">Batal</button>
                <button onclick="executePrint()" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-black uppercase">Cetak Ke Tepian</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <header class="bg-white border-b p-4 flex justify-between items-center">
            <h1 id="shopDisp" class="font-black text-blue-700 uppercase">KASIR PRO</h1>
            <button onclick="connectBT()" id="btStat" class="bg-slate-100 p-2 rounded-lg text-[10px] font-black border uppercase">🔌 Scan Printer</button>
        </header>

        <main class="p-4 space-y-4 max-w-md mx-auto">
            <div class="bg-white p-6 rounded-[2rem] border shadow-sm">
                <button onclick="showPreview('audit')" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-tighter">BUAT LAPORAN AUDIT (TEPIAN PAS)</button>
            </div>
            
            <p class="text-[10px] text-center text-slate-400 font-bold uppercase italic">* Pastikan Printer Mendukung 80mm Full Width</p>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item tab-active"><span>🛒</span><span>KASIR</span></button>
            <button class="nav-item"><span>📦</span><span>STOK</span></button>
            <button class="nav-item"><span>⚙️</span><span>ADMIN</span></button>
        </nav>
    </div>

    <script>
        let btChar = null;
        let config = { n: "NAMA TOKO ANDA", a: "ALAMAT LENGKAP TOKO", l: "TERIMA KASIH" };
        let inventory = JSON.parse(localStorage.getItem('v529_s')) || [
            {name: "CONTOH BARANG PANJANG SEKALI", qty: 50, sld: 120, rev: 1200000},
            {name: "ROKOK MERAH", qty: 25, sld: 10, rev: 250000}
        ];

        // Lebar karakter maksimal untuk 80mm
        const MAX_L = 52; 

        const pad = (t, n, al='left') => { 
            t = (t||"").toString().substring(0, n); 
            return al === 'left' ? t.padEnd(n, ' ') : t.padStart(n, ' '); 
        };

        const center = (t, n) => { 
            t = (t||"").toString().substring(0, n); 
            const x = n - t.length; 
            return ' '.repeat(Math.floor(x/2)) + t + ' '.repeat(Math.ceil(x/2)); 
        };

        function showPreview(type) {
            let s = "";
            if(type === 'audit') {
                let grand = 0;
                s += `${center(config.n, MAX_L)}\n`;
                s += `${center(config.a, MAX_L)}\n`;
                s += `${center("LAPORAN AUDIT STOK", MAX_L)}\n`;
                s += `${"=".repeat(MAX_L)}\n`;
                
                // HEADER TABEL (Total 52 Karakter)
                // Nama(18) Spasi(1) Awal(7) Sisa(7) Laku(7) Omzet(11 Rata Kanan)
                s += `${pad("NAMA BARANG", 18)} ${pad("AWAL", 7)} ${pad("SISA", 7)} ${pad("LAKU", 7)} ${pad("OMZET", 10, 'right')}\n`;
                s += `${"-".repeat(MAX_L)}\n`;

                inventory.forEach(it => {
                    grand += it.rev;
                    const awal = it.qty + it.sld;
                    s += `${pad(it.name, 18)} ${pad(awal, 7)} ${pad(it.qty, 7)} ${pad(it.sld, 7)} ${pad(it.rev.toLocaleString(), 10, 'right')}\n`;
                });

                s += `${"=".repeat(MAX_L)}\n`;
                s += `${pad("TOTAL OMZET HARIAN", 30)} ${pad("Rp "+grand.toLocaleString(), 21, 'right')}\n\n`;

                // KOTAK TANDA TANGAN (TANPA JARAK TENGAH)
                // Setiap kotak lebar 25 karakter. 25 + 25 = 50 (Sisa 2 untuk margin kanan kiri)
                const bTop = `+${"-".repeat(23)}+`;
                s += `${bTop}${bTop}\n`;
                s += `| ${pad("PENGAMBIL", 21, 'center')} || ${pad("PEMILIK/STAF", 21, 'center')} |\n`;
                s += `|${" ".repeat(23)}||${" ".repeat(23)}|\n`;
                s += `|${" ".repeat(23)}||${" ".repeat(23)}|\n`;
                s += `|${" ".repeat(23)}||${" ".repeat(23)}|\n`;
                s += `${bTop}${bTop}\n`;
                
                s += `\n${center("DICETAK PADA: " + new Date().toLocaleString(), MAX_L)}`;
            }

            document.getElementById('receipt-content').innerText = s;
            document.getElementById('preview-overlay').style.display = 'flex';
        }

        async function executePrint() {
            if(!btChar) return alert("Sambungkan printer dulu!");
            try {
                const enc = new TextEncoder();
                const lines = (document.getElementById('receipt-content').innerText + "\n\n\n\n\n").split('\n');
                for (const line of lines) {
                    await btChar.writeValue(enc.encode(line + "\n"));
                }
                alert("Berhasil dicetak ke tepian!");
                closePreview();
            } catch (e) { alert("Error saat mencetak."); }
        }

        async function connectBT() {
            try {
                const dev = await navigator.bluetooth.requestDevice({ 
                    filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] 
                });
                const srv = await dev.gatt.connect();
                const sc = await srv.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                btChar = await sc.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                document.getElementById('btStat').innerText = "✅ TERHUBUNG";
            } catch (e) { console.log(e); }
        }

        function closePreview() { document.getElementById('preview-overlay').style.display = 'none'; }
    </script>
</body>
</html>
