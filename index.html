<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASIR PRO V52.3 BT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 80px; }
        .tab-active { color: #2563eb; background: #eff6ff; border-top: 4px solid #2563eb; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; height: 70px; z-index: 1000; border-top: 1px solid #e2e8f0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
        #login-screen { position: fixed; inset: 0; background: #1e40af; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        input, select { border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px; width: 100%; font-weight: bold; }
        .bt-connected { background-color: #10b981 !important; color: white; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-2xl font-black text-blue-700 mb-6 uppercase">Akses Kasir</h2>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USERNAME" autocomplete="off">
                <input type="password" id="loginPass" placeholder="PASSWORD">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg">MASUK</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="bg-blue-700 text-white p-5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
            <div>
                <h1 id="shopDisplay" class="font-black text-lg uppercase leading-none">...</h1>
                <p id="userRoleDisplay" class="text-[9px] mt-1 font-bold italic"></p>
            </div>
            <div class="flex gap-2">
                <button id="btnConnectBT" onclick="connectBluetooth()" class="bg-slate-800 p-2 rounded-lg text-[10px] font-black uppercase">🔌 Hubungkan BT</button>
                <button onclick="location.reload()" class="bg-red-500 px-3 py-1.5 rounded-lg text-[9px] font-black uppercase">Logout</button>
            </div>
        </div>

        <div class="max-w-md mx-auto px-4 mt-6">
            <div id="sec-kasir" class="space-y-4">
                <div class="bg-white p-6 rounded-[2rem] shadow-md space-y-4">
                    <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="uppercase">
                    <select id="prodSelect" onchange="handleProductChange()"></select>
                    
                    <div id="unitSelector" class="flex gap-2 hidden">
                        <button onclick="setUnit('BKS')" id="unit-BKS" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BKS</button>
                        <button onclick="setUnit('PAK')" id="unit-PAK" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">PAK</button>
                        <button onclick="setUnit('BALL')" id="unit-BALL" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BALL</button>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="saleQty" value="1" class="text-center bg-slate-50" placeholder="QTY">
                        <input type="number" id="saleDisc" value="0" class="text-center bg-red-50 text-red-600" placeholder="POT">
                    </div>
                    <button onclick="addSaleItem()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase shadow-md">Tambah</button>
                </div>

                <div id="saleList" class="space-y-2"></div>

                <div class="bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl space-y-4">
                    <div class="flex justify-between items-center font-black"><span class="text-xs text-slate-400">TOTAL</span><span class="text-2xl text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                    <div class="flex gap-2">
                        <input type="text" id="salePay" oninput="formatRupiahInput(this)" placeholder="BAYAR" class="flex-1 bg-slate-800 text-emerald-400 text-center text-2xl border-none">
                        <button onclick="setUangPas()" class="bg-blue-600 px-4 rounded-xl font-black text-[10px]">PAS</button>
                    </div>
                    <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase shadow-lg active:bg-blue-800">Cetak Struk BT</button>
                </div>
            </div>

            <div id="sec-retur" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="printStockAudit()" class="bg-blue-600 text-white p-4 rounded-2xl font-black text-[10px]">📊 AUDIT STOK</button>
                    <button onclick="resetOnlyItems()" class="bg-orange-500 text-white p-4 rounded-2xl font-black text-[10px]">🔄 RESET STOK</button>
                </div>
                <div id="inventoryList" class="space-y-2"></div>
            </div>
            
            <div id="sec-laporan" class="hidden space-y-3"><div id="historyList" class="space-y-3"></div></div>
            
            <div id="sec-ambil" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl border-2 space-y-4">
                    <input type="text" id="cfgNama" placeholder="NAMA TOKO">
                    <input type="text" id="cfgAlamat" placeholder="ALAMAT">
                    <textarea id="cfgLogo" placeholder="PESAN STRUK" rows="2"></textarea>
                    <button onclick="saveSettings()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs">Simpan Profil</button>
                </div>
                <div id="userList" class="space-y-2 bg-slate-900 p-4 rounded-2xl text-white text-[10px]"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <button onclick="switchTab('kasir')" id="t-kasir" class="nav-item tab-active"><span>🛒</span><span>KASIR</span></button>
            <button onclick="switchTab('laporan')" id="t-laporan" class="nav-item"><span>📜</span><span>RIWAYAT</span></button>
            <button onclick="switchTab('retur')" id="t-retur" class="nav-item admin-only"><span>📦</span><span>STOK</span></button>
            <button onclick="switchTab('ambil')" id="t-ambil" class="nav-item admin-only"><span>⚙️</span><span>ADMIN</span></button>
        </div>
    </div>

    <script>
        let btDevice = null;
        let btCharacteristic = null;
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('v523_users')) || [{u:'admin', p:'admin', r:'admin'}];
        let inventory = JSON.parse(localStorage.getItem('v523_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v523_conf')) || { nama: "NAMA TOKO", alamat: "ALAMAT TOKO", logo: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v523_hist')) || [];
        let tempCart = [];
        let selectedUnit = 'BKS';

        // --- BLUETOOTH LOGIC ---
        async function connectBluetooth() {
            try {
                btDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });
                const server = await btDevice.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                btCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                
                document.getElementById('btnConnectBT').classList.add('bt-connected');
                document.getElementById('btnConnectBT').innerText = "✅ TERHUBUNG";
                alert("Printer Bluetooth Terkoneksi!");
            } catch (e) {
                alert("Koneksi Bluetooth Dibatalkan/Gagal.");
                console.error(e);
            }
        }

        async function printToBT(text) {
            if (!btCharacteristic) {
                alert("Printer belum terhubung! Klik 'Hubungkan BT' di pojok kanan atas.");
                return;
            }
            const encoder = new TextEncoder();
            const data = encoder.encode(text + "\n\n\n\n");
            await btCharacteristic.writeValue(data);
        }

        // --- APP LOGIC ---
        function handleLogin() {
            const u = document.getElementById('loginUser').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value.trim();
            const found = users.find(x => x.u.toLowerCase() === u && x.p === p);
            if(found) {
                currentUser = found;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('userRoleDisplay').innerText = `USER: ${found.u.toUpperCase()}`;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = found.r === 'admin' ? 'flex' : 'none');
                initApp();
            } else { alert("User/Pass Salah!"); }
        }

        function initApp() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgLogo').value = config.logo;
            document.getElementById('shopDisplay').innerText = config.nama;
            renderAll();
        }

        function formatRupiahInput(el) {
            let v = el.value.replace(/[^,\d]/g, '');
            el.value = v === "" ? "" : parseInt(v).toLocaleString('id-ID');
        }

        function setUangPas() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('salePay').value = tot.toLocaleString('id-ID');
        }

        function addSaleItem() {
            const idx = document.getElementById('prodSelect').value;
            if(idx === "") return;
            const it = inventory[idx];
            const qty = parseInt(document.getElementById('saleQty').value) || 1;
            const disc = parseInt(document.getElementById('saleDisc').value) || 0;
            let baseP = selectedUnit === 'BKS' ? it.p_bks : (selectedUnit === 'PAK' ? it.p_pak : it.p_ball);
            let conv = selectedUnit === 'BKS' ? 1 : (selectedUnit === 'PAK' ? 10 : 200);
            tempCart.push({ name: it.name, unit: selectedUnit, base: baseP, price: baseP - disc, qty: qty, disc: disc, convFactor: conv });
            renderCart(); setUangPas();
        }

        function renderCart() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('displayTotal').innerText = tot.toLocaleString('id-ID');
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `<div class="bg-white p-4 rounded-xl flex justify-between shadow-sm border-l-4 border-blue-600 font-black uppercase text-[10px]"><div>${c.name} (${c.qty} ${c.unit})<br><span class="text-blue-600">@ ${c.base.toLocaleString()}</span></div><button onclick="tempCart.splice(${i},1);renderCart();" class="text-red-500 text-lg px-2">×</button></div>`).join('');
        }

        function processTransaction() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const payInput = document.getElementById('salePay').value.replace(/\./g, '');
            const pay = parseInt(payInput) || 0;

            if(tot === 0 || pay < tot) return alert("Periksa keranjang/pembayaran!");

            const trx = { 
                id: "T" + Math.floor(Math.random()*900000), 
                date: new Date().toLocaleString('id-ID'), 
                customer: document.getElementById('custName').value.toUpperCase() || 'UMUM', 
                items: [...tempCart], total: tot, pay: pay, change: pay-tot, user: currentUser.u 
            };
            
            // Simpan riwayat
            historyTrx.unshift(trx);
            localStorage.setItem('v523_stok', JSON.stringify(inventory));
            localStorage.setItem('v523_hist', JSON.stringify(historyTrx));
            
            // Format Struk untuk Printer
            const L = 32; // Lebar standar 58mm thermal
            const pad = (t, n, al='left') => { t = (t||"").toString().substring(0, n); return al === 'left' ? t.padEnd(n, ' ') : t.padStart(n, ' '); };
            const center = (t, n) => { t = (t||"").toString().substring(0, n); const p = n - t.length; return ' '.repeat(Math.floor(p/2)) + t + ' '.repeat(Math.ceil(p/2)); };

            let s = `${center(config.nama, L)}\n${center(config.alamat, L)}\n${"=".repeat(L)}\n`;
            s += `ID: ${trx.id}\nKSR: ${trx.user.toUpperCase()} | PLG: ${trx.customer}\n${"-".repeat(L)}\n`;
            trx.items.forEach(it => {
                s += `${it.name.toUpperCase()}\n${pad(it.qty+it.unit+"x"+it.base.toLocaleString(), 18)}${pad((it.price*it.qty).toLocaleString(), 14, 'right')}\n`;
            });
            s += `${"-".repeat(L)}\n${pad("TOTAL", 18)}${pad(trx.total.toLocaleString(), 14, 'right')}\n${pad("BAYAR", 18)}${pad(trx.pay.toLocaleString(), 14, 'right')}\n${pad("KEMBALI", 18)}${pad(trx.change.toLocaleString(), 14, 'right')}\n${"=".repeat(L)}\n${center(config.logo, L)}`;

            printToBT(s);
            
            tempCart = []; renderCart(); 
            document.getElementById('salePay').value = ''; 
            document.getElementById('custName').value = '';
        }

        // --- COMMON ---
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            renderAll();
        }
        function updateDropdown() { const s = document.getElementById('prodSelect'); s.innerHTML = '<option value="">- PILIH BARANG -</option>'; inventory.forEach((x, i) => s.innerHTML += `<option value="${i}">${x.name}</option>`); }
        function setUnit(u) { selectedUnit = u; ['BKS','PAK','BALL'].forEach(v => document.getElementById('unit-'+v).className = v === u ? 'flex-1 p-3 border-2 border-blue-600 bg-blue-50 rounded-xl font-black text-[10px]' : 'flex-1 p-3 border-2 rounded-xl font-black text-[10px]'); }
        function handleProductChange() { const idx = document.getElementById('prodSelect').value; document.getElementById('unitSelector').classList.toggle('hidden', idx === ""); setUnit('BKS'); }
        function renderAll() { updateDropdown(); renderUsers(); renderHistory(); }
        function renderUsers() { document.getElementById('userList').innerHTML = users.map((u,i) => `<div class="flex justify-between border-b border-slate-700 py-1"><span>${u.u} (${u.r})</span><button onclick="users.splice(${i},1);localStorage.setItem('v523_users',JSON.stringify(users));renderUsers();">Hapus</button></div>`).join(''); }
        function renderHistory() { document.getElementById('historyList').innerHTML = historyTrx.map(t => `<div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center text-xs"><b>${t.id} - ${t.total.toLocaleString()}</b></div>`).join(''); }
        function saveSettings() { config.nama = document.getElementById('cfgNama').value; config.alamat = document.getElementById('cfgAlamat').value; config.logo = document.getElementById('cfgLogo').value; localStorage.setItem('v523_conf', JSON.stringify(config)); location.reload(); }
        function resetOnlyItems() { if(confirm("Hapus Stok?")) { inventory = []; localStorage.setItem('v523_stok', JSON.stringify(inventory)); renderAll(); } }
    </script>
</body>
</html>
