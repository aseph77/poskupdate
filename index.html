<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V51.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f8fafc; font-family: sans-serif; padding-bottom: 100px; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; height: 70px; }
        #login-screen { position: fixed; inset: 0; background: #2563eb; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #preview-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; }
        #receipt-canvas { background: white; width: 80mm; padding: 6mm; color: black; font-family: 'Courier New', Courier, monospace; font-size: 12px; line-height: 1.3; }
        pre { white-space: pre-wrap; font-family: inherit; margin: 0; width: 100%; }
        input, select, textarea { border: 2px solid #e2e8f0; border-radius: 14px; padding: 12px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-black text-blue-600">KASIR PRO V51</h2>
                <p class="text-xs font-bold text-slate-400">SILAHKAN MASUK</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USERNAME" class="bg-slate-50 border-none">
                <input type="password" id="loginPass" placeholder="PASSWORD" class="bg-slate-50 border-none">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">LOGIN</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-6 sticky top-0 z-40 flex justify-between items-center shadow-xl">
            <div>
                <h1 id="shopDisplay" class="font-black text-lg uppercase tracking-tight">KASIR PRO</h1>
                <p id="userRoleDisplay" class="text-[9px] bg-white/20 px-2 py-0.5 rounded-full inline-block mt-1 font-bold"></p>
            </div>
            <button onclick="handleLogout()" class="bg-red-500 p-2 rounded-lg text-[10px] font-black">LOGOUT</button>
        </div>

        <div class="max-w-md mx-auto px-4 mt-6">
            <div id="sec-kasir" class="space-y-4">
                <div class="bg-white p-6 rounded-[2.5rem] shadow-xl space-y-5">
                    <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="uppercase bg-slate-50 border-none italic">
                    <select id="prodSelect" onchange="handleProductChange()" class="text-blue-700 font-bold"></select>
                    
                    <div id="unitSelector" class="flex gap-2 hidden">
                        <div onclick="setUnit('BKS')" id="unit-BKS" class="flex-1 p-3 border-2 rounded-xl text-center font-black text-[10px]">BKS</div>
                        <div onclick="setUnit('PAK')" id="unit-PAK" class="flex-1 p-3 border-2 rounded-xl text-center font-black text-[10px]">PAK</div>
                        <div onclick="setUnit('BALL')" id="unit-BALL" class="flex-1 p-3 border-2 rounded-xl text-center font-black text-[10px]">BALL</div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="saleQty" value="1" class="text-center text-xl bg-slate-50 border-none" placeholder="QTY">
                        <input type="number" id="saleDisc" value="0" class="text-center text-xl bg-red-50 text-red-600 border-none" placeholder="DISC">
                    </div>
                    <button onclick="addSaleItem()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">TAMBAH KE KERANJANG</button>
                </div>
                <div id="saleList" class="space-y-3"></div>
                <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl space-y-5">
                    <div class="flex justify-between items-center"><span class="text-xs text-slate-400">TOTAL</span><span class="text-3xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                    <div class="flex gap-2">
                        <input type="text" id="salePay" oninput="formatRupiahInput(this)" placeholder="BAYAR" class="flex-1 bg-slate-800 p-4 text-emerald-400 font-black text-center text-2xl border-none">
                        <button onclick="setUangPas()" class="bg-blue-600 px-4 rounded-xl font-black text-[9px] uppercase">PAS</button>
                    </div>
                    <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase">CETAK STRUK</button>
                </div>
            </div>

            <div id="sec-retur" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="printStockAudit()" class="bg-blue-600 text-white p-4 rounded-2xl font-black text-[11px]">📊 LAPORAN AUDIT</button>
                    <button onclick="resetSoldStats()" class="bg-orange-500 text-white p-4 rounded-2xl font-black text-[11px]">🔄 RESET DATA</button>
                </div>
                <div class="bg-white p-5 rounded-3xl space-y-3 shadow-sm border">
                    <input type="text" id="mngNama" placeholder="NAMA BARANG" class="uppercase">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="mngBks" placeholder="BKS">
                        <input type="number" id="mngPak" placeholder="PAK">
                        <input type="number" id="mngBall" placeholder="BALL">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="mngStok" placeholder="STOK (BKS)">
                        <input type="text" id="mngKet" placeholder="KET">
                    </div>
                    <button onclick="updateMasterData()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase">SIMPAN BARANG</button>
                </div>
                <div id="inventoryList" class="space-y-2"></div>
            </div>

            <div id="sec-laporan" class="hidden space-y-3"><div id="historyList" class="space-y-3"></div></div>

            <div id="sec-ambil" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-[2rem] border-2 space-y-4">
                    <h3 class="font-black text-blue-600 text-center">PENGATURAN TOKO</h3>
                    <input type="text" id="cfgNama" placeholder="NAMA TOKO">
                    <input type="text" id="cfgAlamat" placeholder="ALAMAT">
                    <input type="text" id="cfgTelp" placeholder="TELP">
                    <textarea id="cfgLogo" placeholder="PESAN PENUTUP" rows="2"></textarea>
                    <button onclick="saveSettings()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase">SIMPAN PROFIL</button>
                </div>

                <div class="bg-slate-900 p-6 rounded-[2rem] text-white space-y-4">
                    <h3 class="font-black text-center text-blue-400">MANAJEMEN AKUN</h3>
                    <div id="userList" class="space-y-2 text-xs"></div>
                    <div class="space-y-2 pt-4 border-t border-slate-700">
                        <input type="text" id="newUser" placeholder="USERNAME BARU" class="bg-slate-800 border-none text-white">
                        <input type="text" id="newPass" placeholder="PASSWORD BARU" class="bg-slate-800 border-none text-white">
                        <select id="newRole" class="bg-slate-800 border-none text-white">
                            <option value="kasir">KASIR (AKSES TERBATAS)</option>
                            <option value="admin">ADMIN (AKSES TOTAL)</option>
                        </select>
                        <button onclick="addUser()" class="w-full bg-emerald-600 py-3 rounded-xl font-black uppercase text-xs">TAMBAH AKUN</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 flex flex-col items-center justify-center text-[9px] font-black tab-active uppercase">🛒 KASIR</button>
            <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 flex flex-col items-center justify-center text-[9px] font-black uppercase">📜 RIWAYAT</button>
            <button onclick="switchTab('retur')" id="t-retur" class="flex-1 flex flex-col items-center justify-center text-[9px] font-black uppercase admin-only">📦 STOK</button>
            <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 flex flex-col items-center justify-center text-[9px] font-black uppercase admin-only">⚙️ ADMIN</button>
        </div>
    </div>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl rounded-sm"><pre id="receipt-content"></pre></div>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mt-6 px-4">
            <button onclick="connectAndPrint()" class="bg-blue-600 text-white py-5 rounded-2xl font-black uppercase">📲 PRINT</button>
            <button onclick="closePreview()" class="bg-white/10 text-white py-3 rounded-xl font-bold text-xs uppercase">TUTUP</button>
        </div>
    </div>

    <script>
        const CHAR_PER_LINE = 48;
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('v51_users')) || [{u:'admin', p:'admin', r:'admin'}];
        let inventory = JSON.parse(localStorage.getItem('v51_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v51_conf')) || { nama: "KASIR PRO", alamat: "ALAMAT TOKO", telp: "0812", logo: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v51_hist')) || [];
        let tempCart = [];
        let selectedUnit = 'BKS';

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgTelp').value = config.telp;
            document.getElementById('cfgLogo').value = config.logo;
            document.getElementById('shopDisplay').innerText = config.nama;
            updateDropdown(); renderStock(); renderUsers();
        }

        // --- AUTH SYSTEM ---
        function handleLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            const user = users.find(x => x.u === u && x.p === p);
            if(user) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('userRoleDisplay').innerText = user.r.toUpperCase() + ": " + user.u;
                applyRoleAccess();
                init();
            } else alert("User/Pass Salah!");
        }

        function applyRoleAccess() {
            const adminMenus = document.querySelectorAll('.admin-only');
            adminMenus.forEach(el => el.style.display = currentUser.r === 'admin' ? 'flex' : 'none');
            if(currentUser.r !== 'admin') switchTab('kasir');
        }

        function handleLogout() { location.reload(); }

        function addUser() {
            const u = document.getElementById('newUser').value;
            const p = document.getElementById('newPass').value;
            const r = document.getElementById('newRole').value;
            if(!u || !p) return;
            users.push({u, p, r});
            localStorage.setItem('v51_users', JSON.stringify(users));
            renderUsers();
            document.getElementById('newUser').value = ''; document.getElementById('newPass').value = '';
        }

        function renderUsers() {
            document.getElementById('userList').innerHTML = users.map((x, i) => `
                <div class="flex justify-between bg-slate-800 p-2 rounded-lg">
                    <span>${x.u} (${x.r})</span>
                    ${x.u !== 'admin' ? `<button onclick="deleteUser(${i})" class="text-red-400">Hapus</button>` : ''}
                </div>
            `).join('');
        }

        function deleteUser(i) { users.splice(i,1); localStorage.setItem('v51_users', JSON.stringify(users)); renderUsers(); }

        // --- FORMATTING ---
        function formatRupiahInput(el) {
            let v = el.value.replace(/[^,\d]/g, '');
            el.value = v === "" ? "" : parseInt(v).toLocaleString('id-ID');
            calculateChange();
        }

        function pad(text, length, type = 'right') {
            text = (text || "").toString().substring(0, length);
            if (type === 'right') return text.padEnd(length, ' ');
            if (type === 'left') return text.padStart(length, ' ');
            if (type === 'center') {
                const p = length - text.length;
                return ' '.repeat(Math.floor(p/2)) + text + ' '.repeat(Math.ceil(p/2));
            }
            return text;
        }

        // --- KASIR ---
        function setUangPas() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('salePay').value = tot.toLocaleString('id-ID');
            calculateChange();
        }

        function calculateChange() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value.replace(/\./g, '')) || 0;
            document.getElementById('displayChange').innerText = "Rp " + Math.max(0, pay - tot).toLocaleString('id-ID');
        }

        function addSaleItem() {
            const idx = document.getElementById('prodSelect').value;
            if(idx === "") return;
            const it = inventory[idx];
            const qty = parseInt(document.getElementById('saleQty').value) || 1;
            const disc = parseInt(document.getElementById('saleDisc').value) || 0;
            let baseP = selectedUnit === 'BKS' ? it.p_bks : (selectedUnit === 'PAK' ? it.p_pak : it.p_ball);
            let conv = selectedUnit === 'BKS' ? 1 : (selectedUnit === 'PAK' ? it.pakKeBks : it.ballKeBks);

            const exist = tempCart.find(x => x.name === it.name && x.unit === selectedUnit && x.disc === disc);
            if(exist) exist.qty += qty;
            else tempCart.push({ name: it.name, unit: selectedUnit, base: baseP, price: baseP - disc, qty: qty, disc: disc, convFactor: conv });
            renderCart(); calculateChange();
        }

        function renderCart() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between shadow-sm border-l-4 border-blue-600 uppercase font-bold text-[10px]">
                    <div>${c.name} (${c.qty} ${c.unit})<br><span class="text-blue-600">@ ${c.base.toLocaleString()}</span></div>
                    <button onclick="tempCart.splice(${i},1);renderCart();calculateChange();" class="text-red-500 text-lg">×</button>
                </div>
            `).join('');
            document.getElementById('displayTotal').innerText = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0).toLocaleString('id-ID');
        }

        // --- AUDIT REPORT (BOX STYLE SIGNATURE) ---
        function printStockAudit() {
            let grandTotal = 0;
            const line = "=".repeat(CHAR_PER_LINE);
            let s = `\n${pad("LAPORAN AUDIT STOK & OMZET", CHAR_PER_LINE, 'center')}\n${line}\n`;
            s += `${pad("NAMA", 15)}${pad("AWAL", 6, 'left')}${pad("SISA", 6, 'left')}${pad("LAKU", 6, 'left')}${pad("OMZET", 15, 'left')}\n`;
            s += "-".repeat(CHAR_PER_LINE) + "\n";
            inventory.forEach(it => {
                const laku = it.soldBks || 0;
                grandTotal += it.realRevenue || 0;
                s += `${pad(it.name, 15)}${pad(it.qty+laku, 6, 'left')}${pad(it.qty, 6, 'left')}${pad(laku, 6, 'left')}${pad((it.realRevenue||0).toLocaleString(), 15, 'left')}\n`;
            });
            s += line + "\n" + pad("TOTAL OMZET BERSIH", 30) + pad(grandTotal.toLocaleString(), 18, 'left') + "\n\n";
            
            // KOTAK TANDA TANGAN
            s += "+--------------------------+-------------------------+\n";
            s += "|      PETUGAS KASIR       |     PEMILIK / ADMIN     |\n";
            s += "+--------------------------+-------------------------+\n";
            s += "|                          |                         |\n";
            s += "|                          |                         |\n";
            s += "|                          |                         |\n";
            s += "+--------------------------+-------------------------+\n";
            s += `| ${pad(currentUser.u.toUpperCase(), 24, 'center')} | ${pad("", 23, 'center')} |\n`;
            s += "+--------------------------+-------------------------+\n\n\n\n";
            
            document.getElementById('receipt-content').innerText = s;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function generateReceipt(trx) {
            const dash = "-".repeat(CHAR_PER_LINE);
            let s = `\n${pad(config.nama, CHAR_PER_LINE, 'center')}\n${pad(config.alamat, CHAR_PER_LINE, 'center')}\n${dash}\n`;
            s += `ID: ${trx.id} | KASIR: ${currentUser.u.toUpperCase()}\nPLG: ${trx.customer || 'UMUM'}\n${dash}\n`;
            trx.items.forEach(it => {
                s += `${it.name.toUpperCase()}\n${pad(it.qty + " " + it.unit + " x " + it.base.toLocaleString(), 30)}${pad((it.price*it.qty).toLocaleString(), 18, 'left')}\n`;
                if(it.disc>0) s += pad("  (POTONGAN)", 30) + pad("-"+(it.disc*it.qty).toLocaleString(), 18, 'left') + "\n";
            });
            s += `${dash}\n${pad("TOTAL", 30)}${pad(trx.total.toLocaleString(), 18, 'left')}\n${pad("TUNAI", 30)}${pad(trx.pay.toLocaleString(), 18, 'left')}\n${pad("KEMBALI", 30)}${pad(trx.change.toLocaleString(), 18, 'left')}\n${dash}\n`;
            s += pad(config.logo, CHAR_PER_LINE, 'center') + "\n\n\n\n";
            return s;
        }

        // --- DATA MGMT ---
        function processTransaction() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value.replace(/\./g, '')) || 0;
            if(pay < tot || tot === 0) return alert("Cek kembali nominal!");
            const trx = { id: "TX"+Date.now().toString().slice(-6), date: new Date().toLocaleString(), customer: document.getElementById('custName').value.toUpperCase(), items: [...tempCart], total: tot, pay: pay, change: pay-tot };
            trx.items.forEach(c => {
                const it = inventory.find(i => i.name === c.name);
                if(it) { it.qty -= (c.qty * c.convFactor); it.soldBks = (it.soldBks || 0) + (c.qty * c.convFactor); it.realRevenue = (it.realRevenue || 0) + (c.price * c.qty); }
            });
            historyTrx.unshift(trx);
            localStorage.setItem('v51_stok', JSON.stringify(inventory));
            localStorage.setItem('v51_hist', JSON.stringify(historyTrx));
            document.getElementById('receipt-content').innerText = generateReceipt(trx);
            document.getElementById('preview-modal').style.display = 'flex';
            tempCart = []; renderCart(); document.getElementById('salePay').value = '';
        }

        function updateMasterData() {
            const nama = document.getElementById('mngNama').value.trim().toUpperCase();
            if(!nama) return;
            const data = { name: nama, p_bks: parseInt(document.getElementById('mngBks').value)||0, p_pak: parseInt(document.getElementById('mngPak').value)||0, p_ball: parseInt(document.getElementById('mngBall').value)||0, pakKeBks: parseInt(document.getElementById('mngPakKeBks').value)||1, ballKeBks: parseInt(document.getElementById('mngBallKeBks').value)||1, qty: parseInt(document.getElementById('mngStok').value)||0, ket: document.getElementById('mngKet').value, soldBks: 0, realRevenue: 0 };
            const idx = inventory.findIndex(x => x.name === nama);
            if(idx > -1) { data.soldBks = inventory[idx].soldBks; data.realRevenue = inventory[idx].realRevenue; inventory[idx] = data; } else inventory.push(data);
            localStorage.setItem('v51_stok', JSON.stringify(inventory));
            renderStock(); updateDropdown();
        }
        function renderStock() { document.getElementById('inventoryList').innerHTML = inventory.map(it => `<div class="bg-white p-4 rounded-2xl border mb-2"><div class="flex justify-between font-bold text-xs"><span>${it.name}</span><button onclick="editItem('${it.name}')" class="text-blue-500">EDIT</button></div><div class="flex justify-between text-[10px] mt-2 text-slate-500 font-bold"><span>STOK: ${it.qty}</span><span>OMZET: ${it.realRevenue.toLocaleString()}</span></div></div>`).join(''); }
        function editItem(n) { const it = inventory.find(x => x.name === n); document.getElementById('mngNama').value = it.name; document.getElementById('mngBks').value = it.p_bks; document.getElementById('mngPak').value = it.p_pak; document.getElementById('mngBall').value = it.p_ball; document.getElementById('mngPakKeBks').value = it.pakKeBks; document.getElementById('mngBallKeBks').value = it.ballKeBks; document.getElementById('mngStok').value = it.qty; document.getElementById('mngKet').value = it.ket; window.scrollTo(0,0); }
        function renderHistory() { document.getElementById('historyList').innerHTML = historyTrx.map(t => `<div class="bg-white p-4 rounded-2xl border flex justify-between"><div><div class="text-[9px] text-slate-400 font-bold">${t.id}</div><div class="font-black">Rp ${t.total.toLocaleString()}</div></div><button onclick="reprint('${t.id}')" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-[10px] font-black">STRUK</button></div>`).join(''); }
        function reprint(id) { const trx = historyTrx.find(t => t.id === id); if(trx) { document.getElementById('receipt-content').innerText = generateReceipt(trx); document.getElementById('preview-modal').style.display = 'flex'; } }
        function handleProductChange() { const idx = document.getElementById('prodSelect').value; document.getElementById('unitSelector').classList.toggle('hidden', idx === ""); setUnit('BKS'); }
        function setUnit(u) { selectedUnit = u; ['BKS','PAK','BALL'].forEach(v => document.getElementById('unit-'+v).className = v === u ? 'flex-1 p-3 border-2 border-blue-600 bg-blue-50 rounded-xl text-center font-black text-[10px]' : 'flex-1 p-3 border-2 rounded-xl text-center font-black text-[10px]'); }
        function updateDropdown() { const s = document.getElementById('prodSelect'); s.innerHTML = '<option value="">- PILIH PRODUK -</option>'; inventory.forEach((x, i) => s.innerHTML += `<option value="${i}">${x.name}</option>`); }
        function switchTab(t) { ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden')); ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active')); document.getElementById('sec-'+t).classList.remove('hidden'); document.getElementById('t-'+t).classList.add('tab-active'); if(t==='laporan') renderHistory(); if(t==='retur') renderStock(); }
        function saveSettings() { config.nama = document.getElementById('cfgNama').value.toUpperCase(); config.alamat = document.getElementById('cfgAlamat').value.toUpperCase(); config.telp = document.getElementById('cfgTelp').value; config.logo = document.getElementById('cfgLogo').value; localStorage.setItem('v51_conf', JSON.stringify(config)); location.reload(); }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        function resetSoldStats() { if(confirm("Reset omzet?")) { inventory.forEach(x => { x.soldBks = 0; x.realRevenue = 0; }); localStorage.setItem('v51_stok', JSON.stringify(inventory)); renderStock(); } }
        async function connectAndPrint() { alert("Simulasi cetak berhasil!"); }
        init();
    </script>
</body>
</html>
