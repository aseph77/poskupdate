<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASIR PRO V52.6 - Excel Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 90px; }
        .tab-active { color: #2563eb; background: #eff6ff; border-top: 4px solid #2563eb; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; height: 75px; z-index: 1000; border-top: 1px solid #e2e8f0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; gap: 4px; }
        #login-screen { position: fixed; inset: 0; background: #1e40af; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        input, select, textarea { border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px; width: 100%; font-weight: bold; outline: none; }
        .bt-connected { background-color: #10b981 !important; color: white; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-2xl font-black text-blue-700 mb-6 uppercase">LOGIN KASIR</h2>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USERNAME" autocomplete="off">
                <input type="password" id="loginPass" placeholder="PASSWORD">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg">MASUK</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="bg-blue-700 text-white p-5 sticky top-0 z-50 flex justify-between items-center shadow-md">
            <div>
                <h1 id="shopDisplay" class="font-black text-lg uppercase leading-none">...</h1>
                <p id="userRoleDisplay" class="text-[9px] mt-1 font-bold italic"></p>
            </div>
            <div class="flex gap-2">
                <button id="btnConnectBT" onclick="connectBluetooth()" class="bg-slate-800 p-2 rounded-lg text-[10px] font-black uppercase">🔌 SCAN PRINTER</button>
                <button onclick="location.reload()" class="bg-red-500 p-2 rounded-lg text-[10px] font-black">EXIT</button>
            </div>
        </div>

        <div class="max-w-md mx-auto px-4 mt-6">
            <div id="sec-kasir" class="space-y-4">
                <div class="bg-white p-6 rounded-[2rem] shadow-md space-y-4">
                    <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="uppercase">
                    <select id="prodSelect" onchange="handleProductChange()"></select>
                    <div id="unitSelector" class="flex gap-2 hidden">
                        <button onclick="setUnit('BKS')" id="unit-BKS" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BKS</button>
                        <button onclick="setUnit('PAK')" id="unit-PAK" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">PAK</button>
                        <button onclick="setUnit('BALL')" id="unit-BALL" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BALL</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="saleQty" value="1" class="text-center bg-slate-50" placeholder="QTY">
                        <input type="number" id="saleDisc" value="0" class="text-center bg-red-50 text-red-600" placeholder="POT">
                    </div>
                    <button onclick="addSaleItem()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-md uppercase">Tambah Barang</button>
                </div>
                <div id="saleList" class="space-y-2"></div>
                <div class="bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl space-y-4">
                    <div class="flex justify-between items-center font-black"><span class="text-xs text-slate-400">TOTAL</span><span class="text-2xl text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                    <input type="text" id="salePay" oninput="formatRupiahInput(this)" placeholder="UANG BAYAR" class="bg-slate-800 text-emerald-400 text-center text-2xl border-none">
                    <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase shadow-lg">Cetak Struk 80mm</button>
                </div>
            </div>

            <div id="sec-retur" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="printStockAuditBT()" class="bg-blue-600 text-white p-4 rounded-2xl font-black text-[10px]">📊 AUDIT STOK</button>
                    <button onclick="exportToExcel()" class="bg-emerald-600 text-white p-4 rounded-2xl font-black text-[10px]">📤 EXPORT EXCEL</button>
                </div>
                <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                    <h3 class="font-black text-center text-xs text-slate-400 uppercase">Input Barang</h3>
                    <input type="text" id="mngNama" placeholder="NAMA BARANG" class="uppercase">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="mngBks" placeholder="BKS">
                        <input type="number" id="mngPak" placeholder="PAK">
                        <input type="number" id="mngBall" placeholder="BALL">
                    </div>
                    <input type="number" id="mngStok" placeholder="STOK (BKS)">
                    <button onclick="updateMasterData()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase text-xs">Simpan Barang</button>
                </div>
                <div id="inventoryList" class="space-y-2"></div>
            </div>

            <div id="sec-ambil" class="hidden space-y-6">
                <div class="bg-white p-5 rounded-3xl border-2 space-y-4">
                    <h3 class="font-black text-blue-600 text-xs uppercase">Excel Data Manager</h3>
                    <div class="p-4 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <label class="block text-[10px] font-bold mb-2 uppercase text-slate-500 text-center">Unggah File Excel (.xlsx)</label>
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="text-xs">
                    </div>
                    <button onclick="importFromExcel()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black">📥 IMPORT BARANG DARI EXCEL</button>
                </div>

                <div class="bg-white p-5 rounded-3xl border-2 space-y-4">
                    <h3 class="font-black text-red-600 text-xs uppercase">Sistem Reset</h3>
                    <button onclick="wipeAllData()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black shadow-lg">🔥 HAPUS SEMUA (WIPE ALL)</button>
                    <p class="text-[8px] text-center text-slate-400 font-bold">Menghapus Stok & Riwayat. Akun Admin tetap aman.</p>
                </div>
            </div>
            
            <div id="sec-laporan" class="hidden space-y-3"><div id="historyList" class="space-y-3"></div></div>
        </div>

        <div class="bottom-nav">
            <button onclick="switchTab('kasir')" id="t-kasir" class="nav-item tab-active"><span>🛒</span><span>KASIR</span></button>
            <button onclick="switchTab('laporan')" id="t-laporan" class="nav-item"><span>📜</span><span>RIWAYAT</span></button>
            <button onclick="switchTab('retur')" id="t-retur" class="nav-item admin-only"><span>📦</span><span>STOK</span></button>
            <button onclick="switchTab('ambil')" id="t-ambil" class="nav-item admin-only"><span>⚙️</span><span>ADMIN</span></button>
        </div>
    </div>

    <script>
        let btDevice = null, btCharacteristic = null, currentUser = null;
        let users = JSON.parse(localStorage.getItem('v526_users')) || [{u:'admin', p:'admin', r:'admin'}];
        let inventory = JSON.parse(localStorage.getItem('v526_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v526_conf')) || { nama: "NAMA TOKO", alamat: "ALAMAT TOKO", logo: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v526_hist')) || [];
        let tempCart = [], selectedUnit = 'BKS';

        const L = 48; // Lebar 80mm

        // --- BLUETOOTH ---
        async function connectBluetooth() {
            try {
                btDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });
                const server = await btDevice.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                btCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                document.getElementById('btnConnectBT').classList.add('bt-connected');
                document.getElementById('btnConnectBT').innerText = "✅ ONLINE";
                alert("Printer 80mm Ready!");
            } catch (e) { console.error(e); }
        }

        async function printToBT(text) {
            if (!btCharacteristic) return alert("Koneksikan Bluetooth!");
            const encoder = new TextEncoder();
            const data = encoder.encode(text + "\n\n\n\n");
            await btCharacteristic.writeValue(data);
        }

        // --- EXCEL LOGIC ---
        function exportToExcel() {
            if (inventory.length === 0) {
                // Beri template jika kosong
                inventory.push({ name: "SAMPLE BARANG", p_bks: 1000, p_pak: 10000, p_ball: 200000, qty: 100 });
            }
            const ws = XLSX.utils.json_to_sheet(inventory.map(it => ({
                name: it.name,
                p_bks: it.p_bks,
                p_pak: it.p_pak,
                p_ball: it.p_ball,
                qty: it.qty
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Stok");
            XLSX.writeFile(wb, `STOK_KASIR_${Date.now()}.xlsx`);
        }

        function importFromExcel() {
            const file = document.getElementById('excelFile').files[0];
            if (!file) return alert("Pilih file excel!");
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                
                // Konversi data ke format aplikasi
                inventory = json.map(it => ({
                    name: String(it.name).toUpperCase(),
                    p_bks: parseInt(it.p_bks) || 0,
                    p_pak: parseInt(it.p_pak) || 0,
                    p_ball: parseInt(it.p_ball) || 0,
                    qty: parseInt(it.qty) || 0,
                    soldBks: 0,
                    realRevenue: 0
                }));
                
                localStorage.setItem('v526_stok', JSON.stringify(inventory));
                renderAll();
                alert(`Berhasil Mengimpor ${inventory.length} Barang!`);
            };
            reader.readAsArrayBuffer(file);
        }

        // --- CORE ---
        function handleLogin() {
            const u = document.getElementById('loginUser').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value.trim();
            const found = users.find(x => x.u.toLowerCase() === u && x.p === p);
            if(found) {
                currentUser = found;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('userRoleDisplay').innerText = `USER: ${found.u.toUpperCase()}`;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = found.r === 'admin' ? 'flex' : 'none');
                initApp();
            } else { alert("Login Salah!"); }
        }

        function initApp() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgLogo').value = config.logo;
            document.getElementById('shopDisplay').innerText = config.nama;
            renderAll();
        }

        function renderAll() { updateDropdown(); renderStock(); renderHistory(); }

        // --- TRANSACTION ---
        function processTransaction() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value.replace(/\./g, '')) || 0;
            if(tot === 0 || pay < tot) return alert("Cek Keranjang/Pembayaran!");

            const trx = { id: "T"+Date.now().toString().slice(-6), date: new Date().toLocaleString(), customer: document.getElementById('custName').value.toUpperCase() || 'UMUM', items: [...tempCart], total: tot, pay: pay, change: pay-tot, user: currentUser.u };
            
            trx.items.forEach(c => {
                const it = inventory.find(i => i.name === c.name);
                if(it) {
                    const conv = (c.unit==='BKS'?1:c.unit==='PAK'?10:200);
                    it.qty -= (c.qty * conv);
                    it.soldBks += (c.qty * conv);
                    it.realRevenue += (c.price * c.qty);
                }
            });

            historyTrx.unshift(trx);
            localStorage.setItem('v526_stok', JSON.stringify(inventory));
            localStorage.setItem('v526_hist', JSON.stringify(historyTrx));

            // Format 80mm
            const pad = (t, n, al='left') => { t = (t||"").toString().substring(0, n); return al === 'left' ? t.padEnd(n, ' ') : t.padStart(n, ' '); };
            const center = (t, n) => { t = (t||"").toString().substring(0, n); const p = n - t.length; return ' '.repeat(Math.floor(p/2)) + t + ' '.repeat(Math.ceil(p/2)); };
            let s = `${center(config.nama, L)}\n${center(config.alamat, L)}\n${"=".repeat(L)}\n`;
            s += `ID: ${trx.id} | ${trx.date}\nPLG: ${trx.customer}\n${"-".repeat(L)}\n`;
            trx.items.forEach(it => {
                s += `${it.name.toUpperCase()}\n${pad(it.qty+" "+it.unit+" x "+it.base.toLocaleString(), 24)}${pad((it.price*it.qty).toLocaleString(), 24, 'right')}\n`;
            });
            s += `${"-".repeat(L)}\n${pad("TOTAL", 24)}${pad(trx.total.toLocaleString(), 24, 'right')}\n${pad("BAYAR", 24)}${pad(trx.pay.toLocaleString(), 24, 'right')}\n${pad("KEMBALI", 24)}${pad(trx.change.toLocaleString(), 24, 'right')}\n${"=".repeat(L)}\n${center(config.logo, L)}`;

            printToBT(s);
            tempCart = []; renderCart(); document.getElementById('salePay').value = ''; renderAll();
        }

        function printStockAuditBT() {
            const pad = (t, n, al='left') => { t = (t||"").toString().substring(0, n); return al === 'left' ? t.padEnd(n, ' ') : t.padStart(n, ' '); };
            const center = (t, n) => { t = (t||"").toString().substring(0, n); const p = n - t.length; return ' '.repeat(Math.floor(p/2)) + t + ' '.repeat(Math.ceil(p/2)); };
            let grand = 0;
            let s = `${center("LAPORAN AUDIT STOK", L)}\n${"=".repeat(L)}\n`;
            s += `${pad("NAMA", 20)}${pad("LAKU", 8, 'right')}${pad("SISA", 10, 'right')}${pad("OMZET", 10, 'right')}\n${"-".repeat(L)}\n`;
            inventory.forEach(it => {
                grand += it.realRevenue;
                s += `${pad(it.name, 20)}${pad(it.soldBks, 8, 'right')}${pad(it.qty, 10, 'right')}${pad(it.realRevenue.toLocaleString(), 10, 'right')}\n`;
            });
            s += `${"=".repeat(L)}\nTOTAL OMZET: Rp ${grand.toLocaleString()}\n\n\n`;
            s += center("Admin Signature", L) + "\n\n\n" + center("( ________________ )", L);
            printToBT(s);
        }

        // --- UI UTILS ---
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            renderAll();
        }
        function formatRupiahInput(el) { let v = el.value.replace(/[^,\d]/g, ''); el.value = v === "" ? "" : parseInt(v).toLocaleString('id-ID'); }
        function setUnit(u) { selectedUnit = u; ['BKS','PAK','BALL'].forEach(v => document.getElementById('unit-'+v).className = v === u ? 'flex-1 p-3 border-2 border-blue-600 bg-blue-50 rounded-xl font-black text-[10px]' : 'flex-1 p-3 border-2 rounded-xl font-black text-[10px]'); }
        function handleProductChange() { const idx = document.getElementById('prodSelect').value; document.getElementById('unitSelector').classList.toggle('hidden', idx === ""); setUnit('BKS'); }
        function updateDropdown() { const s = document.getElementById('prodSelect'); s.innerHTML = '<option value="">- PILIH BARANG -</option>'; inventory.forEach((x, i) => s.innerHTML += `<option value="${i}">${x.name}</option>`); }
        function renderStock() { document.getElementById('inventoryList').innerHTML = inventory.map(it => `<div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center text-xs"><div><b>${it.name}</b><br>Stok: ${it.qty} Bks</div><button onclick="editItem('${it.name}')" class="text-blue-600 font-bold">EDIT</button></div>`).join(''); }
        function editItem(n) { const it = inventory.find(x => x.name === n); document.getElementById('mngNama').value = it.name; document.getElementById('mngBks').value = it.p_bks; document.getElementById('mngPak').value = it.p_pak; document.getElementById('mngBall').value = it.p_ball; document.getElementById('mngStok').value = it.qty; switchTab('retur'); }
        function updateMasterData() {
            const nama = document.getElementById('mngNama').value.toUpperCase(); if(!nama) return;
            const data = { name: nama, p_bks: parseInt(document.getElementById('mngBks').value)||0, p_pak: parseInt(document.getElementById('mngPak').value)||0, p_ball: parseInt(document.getElementById('mngBall').value)||0, qty: parseInt(document.getElementById('mngStok').value)||0, soldBks: 0, realRevenue: 0 };
            const idx = inventory.findIndex(x => x.name === nama);
            if(idx > -1) { data.soldBks = inventory[idx].soldBks; data.realRevenue = inventory[idx].realRevenue; inventory[idx] = data; } else inventory.push(data);
            localStorage.setItem('v526_stok', JSON.stringify(inventory)); renderAll();
        }
        function addSaleItem() {
            const idx = document.getElementById('prodSelect').value; if(idx === "") return;
            const it = inventory[idx]; const qty = parseInt(document.getElementById('saleQty').value) || 1; const disc = parseInt(document.getElementById('saleDisc').value) || 0;
            tempCart.push({ name: it.name, unit: selectedUnit, base: (selectedUnit === 'BKS' ? it.p_bks : (selectedUnit === 'PAK' ? it.p_pak : it.p_ball)), price: (selectedUnit === 'BKS' ? it.p_bks : (selectedUnit === 'PAK' ? it.p_pak : it.p_ball)) - disc, qty: qty });
            renderCart();
        }
        function renderCart() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('displayTotal').innerText = tot.toLocaleString('id-ID');
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `<div class="bg-white p-4 rounded-xl flex justify-between shadow-sm border-l-4 border-blue-600 font-black text-[10px]"><div>${c.name} (${c.qty} ${c.unit})</div><button onclick="tempCart.splice(${i},1);renderCart();" class="text-red-500 px-2">×</button></div>`).join('');
        }
        function renderHistory() { document.getElementById('historyList').innerHTML = historyTrx.map(t => `<div class="bg-white p-3 rounded-lg border flex justify-between text-[10px]"><b>${t.id}</b><span>${t.customer}</span><span>Rp ${t.total.toLocaleString()}</span></div>`).join(''); }
        function saveSettings() { config.nama = document.getElementById('cfgNama').value; config.alamat = document.getElementById('cfgAlamat').value; config.logo = document.getElementById('cfgLogo').value; localStorage.setItem('v526_conf', JSON.stringify(config)); location.reload(); }
        function wipeAllData() { if(confirm("Hapus Stok & Riwayat?")) { inventory = []; historyTrx = []; localStorage.setItem('v526_stok', JSON.stringify(inventory)); localStorage.setItem('v526_hist', JSON.stringify(historyTrx)); renderAll(); } }
    </script>
</body>
</html>
