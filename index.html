<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V38.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f8fafc; font-family: sans-serif; padding-bottom: 100px; }
        
        /* LAYOUT NOTA (UNTUK GAMBAR & PREVIEW) */
        #receipt-canvas { 
            background: white; width: 100%; max-width: 80mm; margin: 0 auto;
            padding: 10px 0; color: black; font-family: 'Courier New', Courier, monospace; 
            font-size: 12px; line-height: 1.2;
        }
        .receipt-inner { padding: 0 10px; }
        .full-line { border-top: 1px dashed black; width: 100%; margin: 8px 0; }
        .receipt-table { width: 100%; border-collapse: collapse; }
        .receipt-table th { text-align: left; border-bottom: 1px dashed black; padding: 5px 0; font-size: 10px; }
        .receipt-table td { padding: 4px 0; vertical-align: top; font-size: 11px; }
        
        /* UI HELPERS */
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 900; }
        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none;
            flex-direction: column; align-items: center; padding: 20px; overflow-y: auto;
        }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div class="receipt-inner" id="receipt-content"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 w-full max-w-xs mt-6">
            <button onclick="confirmAction('jpg')" class="bg-orange-500 text-white py-4 rounded-2xl font-black text-xs uppercase">💾 Simpan JPG</button>
            <button onclick="printBluetooth()" class="bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase">🖨️ Cetak BT</button>
            <button onclick="closePreview()" class="bg-red-600 text-white py-4 rounded-2xl font-black text-xs col-span-2 uppercase">Kembali</button>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-5 flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 id="shopNameDisplay" class="font-black text-lg tracking-tight uppercase">KASIR PRO</h1>
            <p id="shopAddrDisplay" class="text-[10px] opacity-60 uppercase">V38.5 Verified</p>
        </div>
        <button onclick="toggleSettings()" class="bg-slate-800 p-3 rounded-xl">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl border space-y-3">
                <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="w-full bg-slate-50 p-4 rounded-2xl text-sm font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <select id="prodSelect" class="flex-1 bg-blue-50 p-4 rounded-2xl font-black text-sm outline-none border-none"></select>
                    <input type="number" id="saleQty" value="1" class="w-20 bg-slate-50 p-4 rounded-2xl text-center font-black">
                </div>
                <button onclick="addSaleItem()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase tracking-tighter shadow-lg">+ Tambah Barang</button>
            </div>
            <div id="saleList" class="bg-white p-4 rounded-2xl border min-h-[100px] space-y-2"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[40px] shadow-2xl space-y-4">
                <div class="flex justify-between items-center"><span class="text-xs font-bold opacity-50 uppercase">Total Akhir</span><span class="text-2xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="saleDiscount" oninput="calculateSale()" placeholder="DISC" class="bg-slate-800 p-4 rounded-2xl text-red-400 font-bold outline-none">
                    <input type="number" id="salePay" oninput="calculateSale()" placeholder="BAYAR" class="bg-slate-800 p-4 rounded-2xl text-emerald-400 font-bold outline-none">
                </div>
                <button onclick="finalProcess('PENJUALAN')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest active:scale-95">Bayar & Cetak</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4 pb-10">
            <h2 class="font-black text-slate-800 text-center uppercase">Laporan Stok Barang</h2>
            <div id="inventoryStatus" class="space-y-3"></div>
        </div>

        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-emerald-600 p-6 rounded-[40px] space-y-3 shadow-xl text-white">
                <input type="text" id="restockName" placeholder="NAMA BARANG BARU" class="w-full p-4 rounded-2xl font-black uppercase text-slate-900 outline-none">
                <div class="flex gap-2">
                    <input type="number" id="restockPrice" placeholder="HARGA" class="flex-1 p-4 rounded-2xl font-black text-slate-900 outline-none">
                    <input type="number" id="restockQty" placeholder="QTY" class="w-24 p-4 rounded-2xl font-black text-slate-900 outline-none">
                </div>
                <button onclick="addToRestockList()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">+ Simpan Ke Daftar</button>
            </div>
            <div id="restockListContainer" class="bg-white p-4 rounded-3xl border min-h-[50px] space-y-2"></div>
            <button id="btnSaveRestock" onclick="processRestock()" class="hidden w-full bg-emerald-700 text-white py-5 rounded-2xl font-black uppercase shadow-xl">Konfirmasi Simpan Stok</button>
        </div>

        <div id="sec-laporan" class="hidden space-y-3 pb-10">
            <h2 class="font-black text-slate-800 text-center uppercase">Riwayat Transaksi</h2>
            <div id="historyList" class="space-y-3"></div>
        </div>

    </div>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-3 shadow-2xl">
            <input type="text" id="cfgNama" oninput="saveConfig()" placeholder="NAMA TOKO" class="w-full border p-3 rounded-xl uppercase font-bold">
            <input type="text" id="cfgAlamat" oninput="saveConfig()" placeholder="ALAMAT" class="w-full border p-3 rounded-xl uppercase">
            <input type="text" id="cfgHp" oninput="saveConfig()" placeholder="NO HP" class="w-full border p-3 rounded-xl">
            <input type="text" id="cfgFooter" oninput="saveConfig()" placeholder="PESAN BAWAH" class="w-full border p-3 rounded-xl uppercase">
            <button onclick="toggleSettings()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase mt-4">Simpan & Tutup</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-4 text-[10px] font-black tab-active uppercase">🛒 Kasir</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-4 text-[10px] font-black text-red-600 uppercase">📊 Stok</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-4 text-[10px] font-black text-emerald-600 uppercase">➕ Item</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-4 text-[10px] font-black text-blue-600 uppercase">📜 Riwayat</button>
    </div>

    <script>
        // CORE DATA
        let inventory = JSON.parse(localStorage.getItem('v38_stok')) || [];
        let soldData = JSON.parse(localStorage.getItem('v38_sold')) || {};
        let config = JSON.parse(localStorage.getItem('v38_conf')) || { nama: "KASIR TOKO", alamat: "ALAMAT", hp: "08XX", footer: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v38_hist')) || [];
        let tempCart = [], tempRestockList = [];

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgHp').value = config.hp;
            document.getElementById('cfgFooter').value = config.footer;
            updateUI(); updateDropdown();
        }

        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        function saveConfig() {
            config = { 
                nama: document.getElementById('cfgNama').value.toUpperCase(), 
                alamat: document.getElementById('cfgAlamat').value.toUpperCase(), 
                hp: document.getElementById('cfgHp').value, 
                footer: document.getElementById('cfgFooter').value.toUpperCase() 
            };
            localStorage.setItem('v38_conf', JSON.stringify(config)); updateUI();
        }
        function updateUI() {
            document.getElementById('shopNameDisplay').innerText = config.nama;
            document.getElementById('shopAddrDisplay').innerText = config.alamat;
        }

        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderInventory();
            if(t==='laporan') renderHistory();
            window.scrollTo(0,0);
        }

        // LOGIKA KASIR
        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">-- PILIH BARANG --</option>';
            inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (SISA: ${it.qty})</option>`);
        }

        function addSaleItem() {
            const i = document.getElementById('prodSelect').value; if(i==="") return;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const item = inventory[i];
            if(q > item.qty) return alert("STOK HABIS/KURANG!");
            const ex = tempCart.find(c => c.name === item.name);
            if(ex) ex.qty += q; else tempCart.push({name: item.name, price: item.price, qty: q});
            renderSaleList();
        }

        function renderSaleList() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border-b">
                    <div><b class="text-xs uppercase">${c.name}</b><br><span class="text-[10px] opacity-40">${c.qty} x ${c.price.toLocaleString()}</span></div>
                    <button onclick="tempCart.splice(${i},1);renderSaleList()" class="text-red-500 font-bold px-2">✖</button>
                </div>
            `).join('') || "<p class='text-center opacity-20 py-10 italic text-xs uppercase'>KERANJANG KOSONG</p>";
            calculateSale();
        }

        function calculateSale() {
            const sub = tempCart.reduce((a,b)=> a+(b.price*b.qty), 0);
            const disc = parseInt(document.getElementById('saleDiscount').value) || 0;
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            const tot = sub - disc;
            document.getElementById('displayTotal').innerText = tot.toLocaleString();
            return {sub, disc, pay, tot, change: pay-tot};
        }

        // LOGIKA STOK & INPUT
        function addToRestockList() {
            const n = document.getElementById('restockName').value, p = parseInt(document.getElementById('restockPrice').value), q = parseInt(document.getElementById('restockQty').value);
            if(!n || !p || !q) return alert("ISI SEMUA DATA!");
            tempRestockList.push({name:n.toUpperCase(), price:p, qty:q});
            renderRestockList();
            document.getElementById('restockName').value=""; document.getElementById('restockPrice').value=""; document.getElementById('restockQty').value="";
        }

        function renderRestockList() {
            document.getElementById('restockListContainer').innerHTML = tempRestockList.map((it, i) => `
                <div class="flex justify-between bg-slate-50 p-3 rounded-xl border">
                    <span class="text-xs font-bold font-mono uppercase">${it.name} | ${it.qty} Unit</span>
                    <button onclick="tempRestockList.splice(${i},1);renderRestockList()" class="text-red-500 font-bold">X</button>
                </div>
            `).join('') || "<p class='text-center py-4 opacity-40 text-xs italic'>Belum ada item ditambahkan</p>";
            tempRestockList.length > 0 ? document.getElementById('btnSaveRestock').classList.remove('hidden') : document.getElementById('btnSaveRestock').classList.add('hidden');
        }

        function processRestock() {
            tempRestockList.forEach(it => {
                const ex = inventory.find(i=>i.name===it.name);
                if(ex) { ex.qty += it.qty; ex.price = it.price; } else { inventory.push({name:it.name, price:it.price, qty:it.qty}); }
            });
            localStorage.setItem('v38_stok', JSON.stringify(inventory));
            alert("Stok berhasil disimpan!");
            location.reload();
        }

        function renderInventory() {
            let omzet = 0;
            const html = inventory.map(it => {
                const laku = soldData[it.name]||0; omzet += (laku*it.price);
                return `<div class="bg-white p-4 rounded-3xl border shadow-sm">
                    <div class="flex justify-between text-xs font-black uppercase"><span>${it.name}</span><span class="text-blue-600">Rp ${it.price.toLocaleString()}</span></div>
                    <div class="flex justify-between text-[10px] mt-2 opacity-50 font-bold uppercase"><span>Stok: ${it.qty}</span><span>Terjual: ${laku}</span></div>
                </div>`;
            }).join('');
            document.getElementById('inventoryStatus').innerHTML = html + `<div class="bg-slate-900 text-white p-6 rounded-3xl text-center mt-6 uppercase"><p class="text-[10px] opacity-50">Estimasi Omzet</p><b class="text-xl text-emerald-400">Rp ${omzet.toLocaleString()}</b></div>`;
        }

        // LOGIKA RIWAYAT
        function renderHistory() {
            const h = document.getElementById('historyList');
            if(historyTrx.length===0) return h.innerHTML = "<p class='text-center py-20 opacity-20 italic'>BELUM ADA TRANSAKSI</p>";
            h.innerHTML = historyTrx.map((t, i) => `
                <div class="bg-white p-4 rounded-3xl border flex justify-between items-center shadow-sm">
                    <div><b class="text-xs uppercase text-slate-800">Rp ${t.tot.toLocaleString()}</b><br><span class="text-[9px] opacity-40 uppercase font-mono">${t.id} | ${t.date}</span></div>
                    <div class="flex gap-2">
                        <button onclick="reprint(${i})" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Nota</button>
                        <button onclick="deleteHist(${i})" class="bg-red-50 text-red-500 px-3 py-2 rounded-xl text-[10px] font-black">X</button>
                    </div>
                </div>
            `).join('');
        }
        function reprint(i) { window.activeTrx = {...historyTrx[i], isReprint:true}; showReceipt(window.activeTrx); }
        function deleteHist(i) { if(confirm("Hapus Riwayat?")) { historyTrx.splice(i,1); localStorage.setItem('v38_hist', JSON.stringify(historyTrx)); renderHistory(); } }

        // NOTA & PRINT
        function finalProcess(m) {
            const v = calculateSale();
            const trx = { type:m, date: new Date().toLocaleString('id-ID'), id: 'INV'+Date.now().toString().slice(-6), ...v, items: [...tempCart], cust: document.getElementById('custName').value.toUpperCase() || "UMUM" };
            window.activeTrx = trx;
            showReceipt(trx);
        }

        function showReceipt(trx) {
            let rows = trx.items.map(it => `
                <tr>
                    <td style="width:40%">${it.name.toUpperCase()}</td>
                    <td style="width:25%; text-align:right;">${it.price.toLocaleString()}</td>
                    <td style="width:10%; text-align:center;">${it.qty}</td>
                    <td style="width:25%; text-align:right;">${(it.qty*it.price).toLocaleString()}</td>
                </tr>
            `).join('');

            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b style="font-size:16px;">${config.nama}</b><br><span style="font-size:10px;">${config.alamat}<br>TELP: ${config.hp}</span></div>
                <div class="full-line"></div>
                <div style="font-size:10px; display:flex; justify-content:space-between;"><span>${trx.id}</span><span>${trx.date.split(',')[0]}</span></div>
                <div style="font-size:10px;">PELANGGAN: ${trx.cust}</div>
                <div class="full-line"></div>
                <table class="receipt-table">
                    <thead><tr><th style="width:40%">ITEM</th><th style="width:25%;text-align:right">HRG</th><th style="width:10%;text-align:center">QTY</th><th style="width:25%;text-align:right">TOT</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="full-line"></div>
                <div style="font-size:11px;">
                    <div style="display:flex; justify-content:space-between;"><span>SUBTOTAL</span><span>${trx.sub.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>DISKON</span><span>-${trx.disc.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px; margin-top:4px;"><span>TOTAL</span><span>Rp ${trx.tot.toLocaleString()}</span></div>
                    <div class="full-line"></div>
                    <div style="display:flex; justify-content:space-between;"><span>TUNAI</span><span>${trx.pay.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>KEMBALI</span><span>${trx.change.toLocaleString()}</span></div>
                </div>
                <div class="full-line"></div>
                <div style="text-align:center; font-size:10px; margin-top:5px;">${config.footer}</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        async function printBluetooth() {
            const trx = window.activeTrx;
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                
                // SYNC PRINT COMMAND (SAMA DENGAN LAYOUT GAMBAR)
                let c = '\x1b\x40\x1b\x61\x01\x1b\x21\x30'+config.nama+'\n\x1b\x21\x00'+config.alamat+'\n'+config.hp+'\n--------------------------------\n\x1b\x61\x00';
                c += `ID : ${trx.id}\nTGL: ${trx.date}\nPLG: ${trx.cust}\n--------------------------------\n`;
                
                // Table header emulator for print
                c += `ITEM       HRG    QTY    TOT\n--------------------------------\n`;
                trx.items.forEach(it => {
                    let name = (it.name.toUpperCase() + "          ").substring(0, 10);
                    let hrg = (it.price.toLocaleString() + "      ").substring(0, 6);
                    let qty = (it.qty + "   ").substring(0, 3);
                    let tot = (it.qty*it.price).toLocaleString();
                    c += `${name} ${hrg} ${qty} ${tot}\n`;
                });
                
                c += `--------------------------------\nTOTAL   : Rp ${trx.tot.toLocaleString()}\nTUNAI   : Rp ${trx.pay.toLocaleString()}\nKEMBALI : Rp ${trx.change.toLocaleString()}\n--------------------------------\n\x1b\x61\x01${config.footer}\n\n\n\n`;
                
                await char.writeValue(new TextEncoder().encode(c));
                confirmAction('none');
            } catch (err) { alert("ERROR: Aktifkan Bluetooth & Lokasi (GPS)!"); }
        }

        async function confirmAction(type) {
            const trx = window.activeTrx;
            if(!trx.isReprint) {
                trx.items.forEach(it => {
                    const inv = inventory.find(i=>i.name===it.name);
                    inv.qty -= it.qty; soldData[it.name] = (soldData[it.name]||0)+it.qty;
                });
                historyTrx.unshift(trx);
                localStorage.setItem('v38_stok', JSON.stringify(inventory));
                localStorage.setItem('v38_sold', JSON.stringify(soldData));
                localStorage.setItem('v38_hist', JSON.stringify(historyTrx));
            }
            if(type === 'jpg') {
                const canvas = await html2canvas(document.getElementById('receipt-canvas'), {scale:3});
                const l = document.createElement('a'); l.download = trx.id+'.jpg'; l.href = canvas.toDataURL(); l.click();
            }
            location.reload();
        }

        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
