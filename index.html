<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V41.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f8fafc; font-family: sans-serif; padding-bottom: 100px; }
        #receipt-canvas { background: white; width: 80mm; margin: 0 auto; padding: 10px 0; color: black; font-family: 'Courier New', Courier, monospace; }
        .receipt-inner { padding: 0 3mm; font-size: 13px; line-height: 1.2; }
        .full-line { border-top: 1px dashed black; width: 100%; margin: 6px 0; }
        #preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
    </style>
</head>
<body>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 space-y-4">
            <h2 class="font-black text-center text-slate-800 uppercase text-sm">Pengaturan & Toko</h2>
            <div class="space-y-3">
                <input type="text" id="cfgNama" placeholder="NAMA TOKO" class="w-full bg-slate-100 p-4 rounded-2xl font-bold uppercase outline-none">
                <input type="text" id="cfgHp" placeholder="NO HP" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportCSV()" class="bg-emerald-600 text-white p-3 rounded-xl font-bold text-[10px] uppercase">💾 Export</button>
                <button onclick="document.getElementById('importInput').click()" class="bg-amber-600 text-white p-3 rounded-xl font-bold text-[10px] uppercase">📂 Import</button>
                <input type="file" id="importInput" class="hidden" accept=".csv" onchange="importCSV(event)">
            </div>
            <button onclick="toggleSettings()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold uppercase">Simpan & Tutup</button>
        </div>
    </div>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl"><div class="receipt-inner" id="receipt-content"></div></div>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mt-6 px-4">
            <button onclick="printBluetooth()" class="bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg uppercase">🖨️ Cetak Ke Printer</button>
            <button onclick="closePreview()" class="bg-white text-slate-900 py-4 rounded-2xl font-black text-xs uppercase">Selesai / Tutup</button>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-5 flex justify-between items-center sticky top-0 z-40">
        <div><h1 id="shopNameDisplay" class="font-black text-lg uppercase">KASIR PRO</h1><p class="text-[9px] opacity-60 uppercase">V41.3 - Auto-Save Active</p></div>
        <button onclick="toggleSettings()" class="bg-slate-800 w-12 h-12 rounded-2xl flex items-center justify-center text-xl">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                <select id="prodSelect" class="w-full bg-blue-50 p-4 rounded-2xl font-black text-sm outline-none border-2 border-blue-100"></select>
                <div class="flex gap-2">
                    <input type="number" id="saleQty" value="1" class="flex-1 bg-slate-50 p-4 rounded-2xl text-center font-black border">
                    <button onclick="addSaleItem()" class="flex-[2] bg-blue-700 text-white py-4 rounded-2xl font-black uppercase">TAMBAH</button>
                </div>
            </div>
            <div id="saleList" class="space-y-2"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[35px] space-y-4 shadow-xl">
                <div class="flex justify-between items-center"><span class="text-xs opacity-50 font-bold uppercase">Total</span><span class="text-2xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <input type="number" id="salePay" oninput="calculateChange()" placeholder="BAYAR" class="w-full bg-slate-800 p-4 rounded-2xl text-emerald-400 font-bold outline-none text-center text-xl">
                <div class="flex justify-between px-2 text-orange-400 font-black"><span>KEMBALI:</span><span>Rp <span id="displayChange">0</span></span></div>
                <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest">PROSES & SIMPAN</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div class="flex justify-between items-center px-2">
                <h3 class="font-black text-slate-800 text-sm uppercase">Kelola Inventory</h3>
                <button onclick="prepareStockReport()" class="text-blue-600 font-bold text-[10px] uppercase underline">Laporan Audit</button>
            </div>
            <div id="inventoryStatus" class="space-y-3"></div>
        </div>

        <div id="sec-laporan" class="hidden space-y-3">
            <div id="historyList"></div>
            <button onclick="clearHistory()" class="w-full mt-10 text-red-400 text-[9px] font-bold py-4 uppercase opacity-30">Hapus Semua Riwayat</button>
        </div>
        
        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-emerald-600 p-6 rounded-[30px] text-white shadow-lg space-y-3">
                <input type="text" id="restockName" placeholder="NAMA BARANG BARU" class="w-full p-4 rounded-xl text-slate-900 font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <input type="number" id="restockPrice" placeholder="HARGA" class="flex-1 p-4 rounded-xl text-slate-900 font-bold outline-none">
                    <input type="number" id="restockQty" placeholder="STOK" class="w-24 p-4 rounded-xl text-slate-900 font-bold outline-none">
                </div>
                <button onclick="addToQueue()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase">DAFTARKAN</button>
            </div>
            <div id="queueList" class="space-y-2"></div>
            <button id="btnConfirmRestock" onclick="processQueue()" class="hidden w-full bg-emerald-700 text-white py-5 rounded-2xl font-black uppercase shadow-lg">SIMPAN KE DATABASE</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active">KASIR</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black">KELOLA</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black">BARU</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black">RIWAYAT</button>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('v41_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v41_conf')) || { nama: "TOKO KITA", hp: "08XX" };
        let historyTrx = JSON.parse(localStorage.getItem('v41_hist')) || [];
        let tempCart = [], restockQueue = [];

        function init() { 
            document.getElementById('cfgNama').value = config.nama; 
            document.getElementById('cfgHp').value = config.hp; 
            updateUI(); 
            updateDropdown(); 
        }

        function updateUI() { document.getElementById('shopNameDisplay').innerText = config.nama; }
        function saveInv() { localStorage.setItem('v41_stok', JSON.stringify(inventory)); updateDropdown(); }
        function toggleSettings() { 
            config.nama = document.getElementById('cfgNama').value.toUpperCase();
            config.hp = document.getElementById('cfgHp').value;
            localStorage.setItem('v41_conf', JSON.stringify(config));
            updateUI();
            document.getElementById('modal-settings').classList.toggle('hidden'); 
        }

        // --- TRANSAKSI UTAMA (AUTO-SAVE) ---
        function processTransaction() {
            const total = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            
            if(total === 0) return alert("Keranjang kosong!");
            if(pay < total) return alert("Uang pembayaran kurang!");

            // 1. Buat Objek Transaksi
            const newTrx = {
                id: "TRX-" + Date.now().toString().slice(-6),
                date: new Date().toLocaleString('id-ID'),
                total: total,
                pay: pay,
                change: pay - total,
                items: [...tempCart]
            };

            // 2. POTONG STOK SEKARANG JUGA
            newTrx.items.forEach(cartItem => {
                const itemDB = inventory.find(i => i.name === cartItem.name);
                if(itemDB) {
                    itemDB.qty -= cartItem.qty;
                    itemDB.sold = (itemDB.sold || 0) + cartItem.qty;
                }
            });

            // 3. SIMPAN KE RIWAYAT & DATABASE
            historyTrx.unshift(newTrx);
            localStorage.setItem('v41_stok', JSON.stringify(inventory));
            localStorage.setItem('v41_hist', JSON.stringify(historyTrx));

            // 4. TAMPILKAN STRUK (Stok sudah aman di database)
            window.activeTrx = newTrx;
            showReceipt(newTrx);
            
            // 5. Bersihkan Keranjang
            tempCart = [];
            renderSaleList();
            document.getElementById('salePay').value = '';
            document.getElementById('displayChange').innerText = '0';
            updateDropdown();
        }

        function showReceipt(trx) {
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b>${config.nama}</b><br>${config.hp}</div>
                <div class="full-line"></div>
                <div style="font-size:10px;">ID: ${trx.id}<br>${trx.date}</div>
                <div class="full-line"></div>
                <table style="width:100%; font-size:12px;">
                    ${trx.items.map(it => `<tr><td>${it.name}</td><td align="center">${it.qty}</td><td align="right">${(it.price*it.qty).toLocaleString()}</td></tr>`).join('')}
                </table>
                <div class="full-line"></div>
                <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>TOTAL</span><span>Rp ${trx.total.toLocaleString()}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:11px;"><span>BAYAR</span><span>${trx.pay.toLocaleString()}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:11px;"><span>KEMBALI</span><span>${trx.change.toLocaleString()}</span></div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        // --- MANAJEMEN DATA ---
        function renderInventory() {
            const container = document.getElementById('inventoryStatus');
            container.innerHTML = inventory.map((it, i) => `
                <div class="bg-white p-4 rounded-2xl border shadow-sm">
                    <input type="text" value="${it.name}" onchange="updateItem(${i}, 'name', this.value)" class="w-full font-black text-xs uppercase outline-none mb-2">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" value="${it.price}" onchange="updateItem(${i}, 'price', this.value)" class="bg-slate-50 p-2 rounded-lg text-blue-600 font-bold text-xs">
                        <input type="number" value="${it.qty}" onchange="updateItem(${i}, 'qty', this.value)" class="bg-slate-50 p-2 rounded-lg font-bold text-xs">
                    </div>
                </div>
            `).join('') || "<div class='text-center py-10 opacity-20'>Kosong</div>";
        }

        function updateItem(i, field, val) {
            if(field === 'name') inventory[i].name = val.toUpperCase();
            if(field === 'price') inventory[i].price = parseInt(val) || 0;
            if(field === 'qty') inventory[i].qty = parseInt(val) || 0;
            saveInv();
        }

        function renderHistory() {
            document.getElementById('historyList').innerHTML = historyTrx.map((t, i) => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center mb-2">
                    <div class="text-[10px] font-bold">${t.id}<br>Rp ${t.total.toLocaleString()}</div>
                    <button onclick="reprint(${i})" class="bg-slate-800 text-white px-3 py-2 rounded-lg text-[10px]">RE-PRINT</button>
                </div>
            `).join('') || "<div class='text-center py-10 opacity-20'>Tidak ada riwayat</div>";
        }

        // --- LAINNYA ---
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderInventory();
            if(t==='laporan') renderHistory();
        }

        function addSaleItem() {
            const i = document.getElementById('prodSelect').value; if(i==="") return;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const it = inventory[i];
            if(q > it.qty) return alert("Stok tidak cukup!");
            const ex = tempCart.find(c => c.name === it.name);
            if(ex) ex.qty += q; else tempCart.push({name: it.name, price: it.price, qty: q});
            renderSaleList(); calculateChange();
        }

        function renderSaleList() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `<div class="bg-white p-4 rounded-xl border flex justify-between items-center text-xs font-bold uppercase">${c.name} (${c.qty}) <button onclick="tempCart.splice(${i},1);renderSaleList();calculateChange()" class="text-red-500 px-2">×</button></div>`).join('');
            document.getElementById('displayTotal').innerText = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0).toLocaleString();
        }

        function calculateChange() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            document.getElementById('displayChange').innerText = pay >= tot ? (pay - tot).toLocaleString() : "0";
        }

        function reprint(i) { window.activeTrx = historyTrx[i]; showReceipt(historyTrx[i]); }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        function updateDropdown() { const s = document.getElementById('prodSelect'); s.innerHTML = '<option value="">-- PILIH BARANG --</option>'; inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (${it.qty})</option>`); }
        function clearHistory() { if(confirm("Hapus semua riwayat?")) { historyTrx = []; localStorage.setItem('v41_hist', JSON.stringify([])); renderHistory(); } }
        
        // Fitur Tambah Baru
        function addToQueue() {
            const n = document.getElementById('restockName').value, p = parseInt(document.getElementById('restockPrice').value), q = parseInt(document.getElementById('restockQty').value);
            if(!n || !p) return;
            restockQueue.push({name: n.toUpperCase(), price: p, qty: q || 0, sold: 0});
            document.getElementById('queueList').innerHTML = restockQueue.map(it => `<div class="p-2 bg-white rounded border text-xs">${it.name}</div>`).join('');
            document.getElementById('btnConfirmRestock').classList.remove('hidden');
        }
        function processQueue() { restockQueue.forEach(it => inventory.push(it)); saveInv(); location.reload(); }

        init();
    </script>
</body>
</html>
