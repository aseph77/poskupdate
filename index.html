<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V38.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 120px; }
        
        /* NOTA & LAPORAN STOK */
        #receipt-canvas { 
            background: white; width: 100%; max-width: 80mm; margin: 0 auto;
            padding: 15px 5px; color: black; font-family: 'Courier New', Courier, monospace; 
            font-size: 11px; line-height: 1.3;
        }
        .full-line { border-top: 1px dashed black; width: 100%; margin: 8px 0; }
        .table-stok { width: 100%; border-collapse: collapse; font-size: 10px; }
        .table-stok th { border-bottom: 1px solid black; padding: 4px 0; text-align: left; }
        .table-stok td { padding: 6px 0; border-bottom: 0.5px solid #eee; }

        /* UI */
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 900; }
        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; display: none;
            flex-direction: column; align-items: center; padding: 15px; overflow-y: auto;
        }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
    </style>
</head>
<body>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div id="receipt-content"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 w-full max-w-xs mt-6">
            <button onclick="confirmAction('jpg')" class="bg-orange-500 text-white py-4 rounded-2xl font-black text-xs uppercase">💾 Simpan Gambar</button>
            <button onclick="printBluetooth()" class="bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase">🖨️ Cetak Printer</button>
            <button onclick="closePreview()" class="bg-red-600 text-white py-4 rounded-2xl font-black text-xs col-span-2 uppercase">Kembali</button>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-5 flex justify-between items-center sticky top-0 z-40">
        <div><h1 id="shopNameDisplay" class="font-black text-lg uppercase tracking-tighter">KASIR PRO</h1><p id="shopAddrDisplay" class="text-[9px] opacity-60 uppercase">Stock & Sales Sync</p></div>
        <button onclick="toggleSettings()" class="bg-slate-800 p-3 rounded-xl">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="w-full bg-slate-50 p-4 rounded-2xl font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <select id="prodSelect" class="flex-1 bg-blue-50 p-4 rounded-2xl font-black text-sm outline-none"></select>
                    <input type="number" id="saleQty" value="1" class="w-20 bg-slate-50 p-4 rounded-2xl text-center font-black">
                </div>
                <button onclick="addSaleItem()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase">Tambah</button>
            </div>
            <div id="saleList" class="bg-white p-4 rounded-2xl border min-h-[50px] space-y-2"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[40px] shadow-2xl space-y-4">
                <div class="flex justify-between items-center"><span class="text-xs font-bold opacity-40 uppercase">Total</span><span class="text-2xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <button onclick="finalProcess('PENJUALAN')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest">Bayar & Cetak Nota</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-3xl border shadow-sm">
                <h2 class="font-black text-slate-800 uppercase text-center mb-4">Ringkasan Fisik Barang</h2>
                <div id="inventoryStatus" class="space-y-2"></div>
                <button onclick="prepareStockReport()" class="w-full mt-6 bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Cetak Laporan Stok</button>
            </div>
        </div>

        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-emerald-600 p-6 rounded-[40px] shadow-xl text-white space-y-3">
                <h3 class="font-black text-xs uppercase">Restok / Barang Masuk</h3>
                <input type="text" id="restockName" placeholder="NAMA BARANG" class="w-full p-4 rounded-2xl font-black uppercase text-slate-900">
                <div class="flex gap-2">
                    <input type="number" id="restockPrice" placeholder="HRG JUAL" class="flex-1 p-4 rounded-2xl font-black text-slate-900">
                    <input type="number" id="restockQty" placeholder="QTY" class="w-24 p-4 rounded-2xl font-black text-slate-900">
                </div>
                <button onclick="addToRestockList()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg">+ Simpan Masuk</button>
            </div>
            <div id="restockListContainer" class="bg-white p-4 rounded-3xl border min-h-[50px]"></div>
        </div>

        <div id="sec-laporan" class="hidden space-y-3">
            <div id="historyList"></div>
        </div>

    </div>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-3 shadow-2xl text-center">
            <h2 class="font-black uppercase border-b pb-2">Set Toko</h2>
            <input type="text" id="cfgNama" oninput="saveConfig()" placeholder="NAMA TOKO" class="w-full border p-3 rounded-xl uppercase font-bold">
            <input type="text" id="cfgAlamat" oninput="saveConfig()" placeholder="ALAMAT" class="w-full border p-3 rounded-xl uppercase">
            <input type="text" id="cfgHp" oninput="saveConfig()" placeholder="HP" class="w-full border p-3 rounded-xl">
            <input type="text" id="cfgFooter" oninput="saveConfig()" placeholder="FOOTER" class="w-full border p-3 rounded-xl uppercase">
            <button onclick="toggleSettings()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase mt-4">Simpan</button>
            <button onclick="if(confirm('Reset semua data?')){localStorage.clear();location.reload();}" class="w-full bg-red-100 text-red-600 py-2 rounded-xl text-xs font-bold uppercase">Hapus Data Permanen</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active uppercase">🛒 Kasir</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black text-red-600 uppercase">📊 Stok</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black text-emerald-600 uppercase">📦 Masuk</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black text-blue-600 uppercase">📜 Riwayat</button>
    </div>

    <script>
        // CORE LOGIC & SYNC
        let inventory = JSON.parse(localStorage.getItem('v38_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v38_conf')) || { nama: "KASIR PRO", alamat: "ALAMAT", hp: "08XX", footer: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v38_hist')) || [];
        let tempCart = [];

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgHp').value = config.hp;
            document.getElementById('cfgFooter').value = config.footer;
            updateUI(); updateDropdown();
        }

        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        function saveConfig() {
            config = { nama: document.getElementById('cfgNama').value.toUpperCase(), alamat: document.getElementById('cfgAlamat').value.toUpperCase(), hp: document.getElementById('cfgHp').value, footer: document.getElementById('cfgFooter').value.toUpperCase() };
            localStorage.setItem('v38_conf', JSON.stringify(config)); updateUI();
        }
        function updateUI() { document.getElementById('shopNameDisplay').innerText = config.nama; document.getElementById('shopAddrDisplay').innerText = config.alamat; }

        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderInventory();
            if(t==='laporan') renderHistory();
        }

        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">-- PILIH BARANG --</option>';
            inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (${it.qty})</option>`);
        }

        // KASIR & PENJUALAN
        function addSaleItem() {
            const i = document.getElementById('prodSelect').value; if(i==="") return;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const item = inventory[i];
            if(q > item.qty) return alert("Stok Kurang!");
            const ex = tempCart.find(c => c.name === item.name);
            if(ex) ex.qty += q; else tempCart.push({name: item.name, price: item.price, qty: q});
            renderSaleList();
        }

        function renderSaleList() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border">
                    <div><b class="text-xs uppercase">${c.name}</b><br><span class="text-[10px] opacity-40">${c.qty} x ${c.price.toLocaleString()}</span></div>
                    <button onclick="tempCart.splice(${i},1);renderSaleList()" class="text-red-500 font-bold px-2 text-xl">×</button>
                </div>
            `).join('') || "<p class='text-center opacity-20 py-4 italic text-xs uppercase tracking-widest'>Belum ada pesanan</p>";
            const tot = tempCart.reduce((a,b)=> a+(b.price*b.qty), 0);
            document.getElementById('displayTotal').innerText = tot.toLocaleString();
        }

        // INPUT STOK (PENGAMBILAN)
        function addToRestockList() {
            const n = document.getElementById('restockName').value, p = parseInt(document.getElementById('restockPrice').value), q = parseInt(document.getElementById('restockQty').value);
            if(!n || !p || !q) return alert("Lengkapi Data!");
            
            const it = inventory.find(i => i.name === n.toUpperCase());
            if(it) {
                it.lastRestock = q; // Simpan jumlah pengambilan terakhir
                it.qty += q;
                it.price = p;
            } else {
                inventory.push({name: n.toUpperCase(), price: p, qty: q, initial: 0, lastRestock: q, sold: 0});
            }
            
            localStorage.setItem('v38_stok', JSON.stringify(inventory));
            alert("Berhasil Restok!");
            location.reload();
        }

        // LAPORAN STOK (AUDIT)
        function renderInventory() {
            const html = inventory.map(it => {
                const awal = it.qty + (it.sold || 0) - (it.lastRestock || 0);
                return `<div class="bg-slate-50 p-4 rounded-2xl border flex justify-between items-center">
                    <div><b class="text-xs uppercase">${it.name}</b></div>
                    <div class="text-[10px] font-mono text-right">
                        AWAL: ${awal} | MASUK: +${it.lastRestock || 0} | KELUAR: -${it.sold || 0} | <b class="text-blue-700">AKHIR: ${it.qty}</b>
                    </div>
                </div>`;
            }).join('') || "<p class='text-center opacity-20 py-10 uppercase font-black'>Stok Kosong</p>";
            document.getElementById('inventoryStatus').innerHTML = html;
        }

        function prepareStockReport() {
            window.activeTrx = { type: "LAPORAN STOK", date: new Date().toLocaleString('id-ID'), items: [...inventory] };
            let rows = inventory.map(it => {
                const awal = it.qty + (it.sold || 0) - (it.lastRestock || 0);
                return `<tr><td>${it.name.toUpperCase()}</td><td align="center">${awal}</td><td align="center">+${it.lastRestock||0}</td><td align="center">-${it.sold||0}</td><td align="right"><b>${it.qty}</b></td></tr>`;
            }).join('');

            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b style="font-size:14px;">${config.nama}</b><br>LAPORAN MUTASI STOK</div>
                <div class="full-line"></div>
                <div style="font-size:9px;">TANGGAL: ${window.activeTrx.date}</div>
                <div class="full-line"></div>
                <table class="table-stok">
                    <thead><tr><th>ITEM</th><th align="center">AWAL</th><th align="center">IN</th><th align="center">OUT</th><th align="right">SISA</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="full-line"></div>
                <div style="text-align:center; font-size:9px;">Laporan Audit Stok Tanpa Harga</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        // NOTA PENJUALAN (DENGAN HARGA)
        function finalProcess(m) {
            if(tempCart.length === 0) return;
            const sub = tempCart.reduce((a,b)=> a+(b.price*b.qty), 0);
            const trx = { type:m, date: new Date().toLocaleString('id-ID'), id: 'INV'+Date.now().toString().slice(-6), sub, tot:sub, pay:sub, change:0, items:[...tempCart], cust: document.getElementById('custName').value.toUpperCase() || "UMUM" };
            window.activeTrx = trx;
            
            let rows = trx.items.map(it => `<tr><td width="40%">${it.name}</td><td width="25%" align="right">${it.price.toLocaleString()}</td><td width="10%" align="center">${it.qty}</td><td width="25%" align="right">${(it.price*it.qty).toLocaleString()}</td></tr>`).join('');
            
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b style="font-size:16px;">${config.nama}</b><br>${config.alamat}</div>
                <div class="full-line"></div>
                <div style="font-size:9px; display:flex; justify-content:space-between;"><span>${trx.id}</span><span>${trx.date.split(',')[0]}</span></div>
                <div class="full-line"></div>
                <table width="100%" style="font-size:10px;">
                    <thead><tr><th align="left">ITEM</th><th align="right">HRG</th><th align="center">QTY</th><th align="right">TOT</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="full-line"></div>
                <div style="font-size:12px; font-weight:bold; display:flex; justify-content:space-between;"><span>TOTAL</span><span>Rp ${trx.tot.toLocaleString()}</span></div>
                <div class="full-line"></div>
                <div style="text-align:center; font-size:10px;">${config.footer}</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        async function printBluetooth() {
            const trx = window.activeTrx;
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                
                let c = '\x1b\x40\x1b\x61\x01\x1b\x21\x10' + config.nama + '\n' + (trx.type === "LAPORAN STOK" ? "LAPORAN MUTASI STOK" : "NOTA PENJUALAN") + '\n\x1b\x21\x00' + trx.date + '\n--------------------------------\n\x1b\x61\x00';
                
                if(trx.type === "LAPORAN STOK") {
                    c += "ITEM      AWAL   +   -   SISA\n--------------------------------\n";
                    trx.items.forEach(it => {
                        const awal = it.qty + (it.sold || 0) - (it.lastRestock || 0);
                        let name = (it.name + "      ").substring(0, 8);
                        c += `${name}  ${awal}  ${it.lastRestock||0}  ${it.sold||0}  ${it.qty}\n`;
                    });
                } else {
                    c += "ITEM        HRG    QTY    TOT\n--------------------------------\n";
                    trx.items.forEach(it => {
                        let n = (it.name + "          ").substring(0,10);
                        c += `${n} ${it.price.toLocaleString()} ${it.qty} ${(it.price*it.qty).toLocaleString()}\n`;
                    });
                    c += `--------------------------------\nTOTAL: Rp ${trx.tot.toLocaleString()}\n`;
                }
                
                c += `--------------------------------\n\x1b\x61\x01${config.footer}\n\n\n\n`;
                await char.writeValue(new TextEncoder().encode(c));
                if(trx.type === "PENJUALAN") confirmAction('none'); else closePreview();
            } catch (err) { alert("GPS/BT Mati?"); }
        }

        async function confirmAction(type) {
            const trx = window.activeTrx;
            if(trx.type === "PENJUALAN" && !trx.isReprint) {
                trx.items.forEach(it => {
                    const inv = inventory.find(i=>i.name===it.name);
                    inv.qty -= it.qty;
                    inv.sold = (inv.sold || 0) + it.qty;
                });
                historyTrx.unshift(trx);
                localStorage.setItem('v38_stok', JSON.stringify(inventory));
                localStorage.setItem('v38_hist', JSON.stringify(historyTrx));
            }
            if(type === 'jpg') {
                const canvas = await html2canvas(document.getElementById('receipt-canvas'), {scale:3});
                const l = document.createElement('a'); l.download = trx.type+'.jpg'; l.href = canvas.toDataURL(); l.click();
            }
            location.reload();
        }

        function renderHistory() {
            const h = document.getElementById('historyList');
            h.innerHTML = historyTrx.map((t, i) => `
                <div class="bg-white p-4 rounded-3xl border flex justify-between items-center mb-2">
                    <div class="text-[10px] font-mono uppercase">ID: ${t.id}<br><b class="text-xs">Rp ${t.tot.toLocaleString()}</b></div>
                    <button onclick="reprint(${i})" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Nota</button>
                </div>`).join('') || "<p class='text-center py-20 opacity-20'>KOSONG</p>";
        }
        function reprint(i) { window.activeTrx = {...historyTrx[i], isReprint:true}; finalProcess('PENJUALAN'); }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
