<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASIR PRO CLOUD V52.10.18</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; padding-bottom: 90px; }
        .tab-active { color: #2563eb; background: #eff6ff; border-top: 4px solid #2563eb; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; height: 75px; z-index: 1000; border-top: 1px solid #e2e8f0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; gap: 4px; border: none; background: none; }
        #preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 10px; }
        .receipt-paper { background: white; width: 100%; max-width: 480px; padding: 40px 10px; font-family: 'Courier New', monospace; white-space: pre; font-size: 12.5px; line-height: 1.2; color: #000; }
    </style>
</head>
<body>

    <div id="preview-overlay">
        <div class="flex flex-col w-full items-center">
            <div id="receipt-content" class="receipt-paper shadow-2xl"></div>
            <div class="flex gap-2 w-full max-w-[480px] mt-4 px-2">
                <button onclick="window.closePreview()" class="flex-1 bg-slate-800 text-white py-4 rounded-2xl font-black uppercase">Batal</button>
                <button onclick="window.executePrint()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Cetak & Off BT</button>
            </div>
        </div>
    </div>

    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-[9998] flex items-center justify-center p-6 text-white">
        <div class="bg-white text-slate-900 p-8 rounded-[2.5rem] w-full max-w-sm text-center shadow-2xl border-4 border-blue-500">
            <h2 class="text-3xl font-black mb-2 text-blue-600 italic uppercase">KASIRKU</h2>
            <p class="text-[10px] mb-6 font-bold text-slate-400 italic uppercase">Cloud V52.10.18</p>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USERNAME" class="border-2 p-4 rounded-2xl w-full font-bold outline-none border-slate-100 bg-slate-50 uppercase">
                <input type="password" id="loginPass" placeholder="PASSWORD" class="border-2 p-4 rounded-2xl w-full outline-none border-slate-100 bg-slate-50">
                <button type="button" onclick="window.handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase">Masuk</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="bg-white border-b p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
            <div class="flex flex-col">
                <span id="shopDisp" class="font-black text-blue-700 uppercase leading-none text-xl">TOKO</span>
                <span id="roleDisp" class="text-[9px] font-bold text-slate-400 mt-1 uppercase"></span>
            </div>
            <div class="flex gap-2">
                <button id="btStat" onclick="window.connectBT()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-[10px] font-black border uppercase">🔌 BT READY</button>
                <button onclick="window.handleLogout()" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black border border-red-100 uppercase">EXIT</button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-4">
            <section id="sec-kasir" class="space-y-4">
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm space-y-4">
                    <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="border-2 p-4 rounded-2xl w-full font-bold text-sm bg-slate-50 uppercase outline-none focus:border-blue-500">
                    <select id="prodSelect" onchange="window.handleProductChange()" class="border-2 p-4 rounded-2xl w-full font-bold text-sm outline-none bg-white"></select>
                    <div id="unitWrap" class="flex gap-2 hidden">
                        <button onclick="window.setUnit('BKS')" id="u-BKS" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BKS</button>
                        <button onclick="window.setUnit('PAK')" id="u-PAK" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">PAK</button>
                        <button onclick="window.setUnit('BALL')" id="u-BALL" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BALL</button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="saleQty" value="1" class="border-2 p-4 rounded-2xl w-full text-center font-black bg-slate-50">
                        <input type="number" id="saleDisc" value="0" class="border-2 p-4 rounded-2xl w-full text-center text-red-500 font-black bg-slate-50">
                    </div>
                    <button onclick="window.addToCart()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase shadow-lg">Tambah Item</button>
                </div>
                <div id="cartList" class="space-y-3"></div>
                <div class="bg-slate-900 p-7 rounded-[2.5rem] text-white space-y-5">
                    <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-50 uppercase">Total Belanja</span><span class="text-3xl font-black text-blue-400">Rp <span id="totDisp">0</span></span></div>
                    <input type="text" id="payInput" oninput="window.formatRp(this)" placeholder="TUNAI" class="w-full bg-slate-800 text-emerald-400 text-3xl font-black text-center rounded-2xl py-4 outline-none border border-slate-700">
                    <button onclick="window.showPreview('trx')" class="w-full bg-blue-500 py-5 rounded-2xl font-black uppercase shadow-lg">Cetak Struk</button>
                </div>
            </section>

            <section id="sec-hist" class="hidden space-y-3">
                <div id="hList" class="space-y-3"></div>
            </section>

            <section id="sec-stok" class="hidden space-y-4">
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-black text-xs text-blue-600 uppercase">Input Barang</h3>
                        <div class="flex gap-2">
                            <button onclick="window.downloadTemplate()" class="text-[8px] font-bold text-blue-500 uppercase">Template</button>
                            <button onclick="window.exportExcel()" class="text-[8px] font-bold text-emerald-600 uppercase">Export</button>
                        </div>
                    </div>
                    <input type="hidden" id="editId" value="">
                    <input type="text" id="stkName" placeholder="NAMA BARANG" class="border-2 p-4 rounded-2xl w-full font-bold uppercase bg-slate-50 outline-none">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="stkBks" placeholder="BKS" class="border-2 p-3 rounded-xl text-center font-bold">
                        <input type="number" id="stkPak" placeholder="PAK" class="border-2 p-3 rounded-xl text-center font-bold">
                        <input type="number" id="stkBall" placeholder="BALL" class="border-2 p-3 rounded-xl text-center font-bold">
                    </div>
                    <input type="number" id="stkQty" placeholder="STOK (BKS)" class="border-2 p-4 rounded-2xl w-full font-bold text-center bg-slate-50">
                    <button id="stkBtn" onclick="window.saveStk()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase">Simpan</button>
                    
                    <div class="border-t pt-4">
                        <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="window.importExcel(event)" class="text-[10px] w-full mb-3">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.showPreview('audit')" class="bg-slate-900 text-white py-3 rounded-xl font-black text-[10px] uppercase">Audit 80mm</button>
                            <button onclick="window.resetSalesData()" class="bg-red-600 text-white py-3 rounded-xl font-black text-[10px] uppercase">Reset Omzet</button>
                        </div>
                    </div>
                </div>
                <div id="invList" class="space-y-3"></div>
            </section>

            <section id="sec-admin" class="hidden space-y-4">
                <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm space-y-4">
                    <h3 class="font-black text-blue-600 text-xs uppercase">Profil Toko</h3>
                    <input type="text" id="cfgN" placeholder="NAMA TOKO" class="border-2 p-4 rounded-2xl w-full font-black uppercase">
                    <input type="text" id="cfgA" placeholder="ALAMAT" class="border-2 p-4 rounded-2xl w-full text-sm">
                    <input type="text" id="cfgP" placeholder="NOMOR HP / WA" class="border-2 p-4 rounded-2xl w-full text-sm">
                    <button onclick="window.saveCfg()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Simpan Profil</button>
                </div>
                <div class="bg-white p-7 rounded-[2.5rem] border shadow-sm space-y-4">
                    <h3 class="font-black text-red-600 text-xs uppercase">Akun Kasir</h3>
                    <div id="userList" class="space-y-2 mb-4"></div>
                    <input type="text" id="newU" placeholder="USER" class="border-2 p-3 rounded-xl w-full font-bold uppercase text-xs">
                    <input type="password" id="newP" placeholder="PASS" class="border-2 p-3 rounded-xl w-full font-bold text-xs">
                    <button onclick="window.addUser()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black uppercase text-xs">Tambah Kasir Baru</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button onclick="window.tab('kasir')" id="t-kasir" class="nav-item tab-active"><span>🛒</span><span>KASIR</span></button>
            <button onclick="window.tab('hist')" id="t-hist" class="nav-item"><span>📜</span><span>RIWAYAT</span></button>
            <button onclick="window.tab('stok')" id="t-stok" class="nav-item admin-only"><span>📦</span><span>STOK</span></button>
            <button onclick="window.tab('admin')" id="t-admin" class="nav-item admin-only"><span>⚙️</span><span>ADMIN</span></button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFE7OgaFfZvFXyuJ6YFafBNhB_IGXPtZs",
            authDomain: "kasirku-pro.firebaseapp.com",
            databaseURL: "https://kasirku-pro-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kasirku-pro",
            storageBucket: "kasirku-pro.firebasestorage.app",
            messagingSenderId: "765663464878",
            appId: "1:765663464878:web:9b9ad4e90fb3c08b830c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.users = []; window.inventory = []; window.config = {}; window.trxHistory = []; window.cart = [];
        window.curUser = null; window.btDevice = null; window.btChar = null; window.selectedUnit = 'BKS';
        const L = 48; 
        const M = 44; 

        onValue(ref(db, 'v11/users'), (s) => { 
            window.users = s.val() ? Object.keys(s.val()).map(k => ({...s.val()[k], id: k})) : [{u:'admin', p:'admin', r:'admin'}];
            checkSession(); 
        });
        onValue(ref(db, 'v11/inventory'), (s) => { 
            const d = s.val(); window.inventory = d ? Object.keys(d).map(k => ({...d[k], id: k})) : []; renderAll(); 
        });
        onValue(ref(db, 'v11/config'), (s) => { 
            window.config = s.val() || { n: "TOKO KITA", a: "ALAMAT", p: "-", l: "TERIMA KASIH" }; 
            document.getElementById('shopDisp').innerText = window.config.n.toUpperCase();
            document.getElementById('cfgN').value = window.config.n;
            document.getElementById('cfgA').value = window.config.a;
            document.getElementById('cfgP').value = window.config.p;
        });
        onValue(ref(db, 'v11/history'), (s) => { 
            const d = s.val(); window.trxHistory = d ? Object.keys(d).map(k => ({...d[k], hid: k})).reverse() : []; renderAll(); 
        });

        // PRINT LOGIC
        window.connectBT = async () => {
            try {
                window.btDevice = await navigator.bluetooth.requestDevice({ filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }], optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const srv = await window.btDevice.gatt.connect();
                const sc = await srv.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                window.btChar = await sc.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                document.getElementById('btStat').innerText = "✅ ONLINE"; return true;
            } catch(e) { return false; }
        };

        window.executePrint = async () => {
            if(!window.btChar || !window.btDevice.gatt.connected) { if(!await window.connectBT()) return; }
            try {
                const enc = new TextEncoder();
                const lines = (window.curPrintData.content + "\n\n\n\n").split('\n');
                for (let l of lines) await window.btChar.writeValue(enc.encode(l + "\n"));
                if (window.btDevice.gatt.connected) await window.btDevice.gatt.disconnect();
                document.getElementById('btStat').innerText = "🔌 BT READY";

                if(window.curPrintData.type === 'trx' && !window.curPrintData.isReprint) {
                    const d = window.curPrintData.raw;
                    d.items.forEach(c => {
                        const it = window.inventory.find(i => i.id === c.id);
                        if(it) {
                            const conv = (c.unit==='BKS'?1:c.unit==='PAK'?10:200);
                            update(ref(db, 'v11/inventory/' + it.id), { qty: it.qty - (c.qty * conv), sld: (it.sld || 0) + (c.qty * conv), rev: (it.rev || 0) + (c.prc * c.qty) });
                        }
                    });
                    set(push(ref(db, 'v11/history')), d);
                    window.cart = []; document.getElementById('payInput').value = "";
                }
                window.closePreview(); renderAll();
            } catch (e) { alert("Error: " + e.message); }
        };

        // DESIGN FORMATTERS
        const row = (txt) => "  " + txt + "  "; 
        const pad = (t, n, al='left') => { t = (t||"").toString().substring(0, n); return al === 'left' ? t.padEnd(n, ' ') : t.padStart(n, ' '); };
        const center = (t, n) => { t = (t||"").toString().substring(0, n); const x = n - t.length; return ' '.repeat(Math.floor(x/2)) + t + ' '.repeat(Math.ceil(x/2)); };

        window.showPreview = (type, oldData = null) => {
            let s = ""; const dNow = new Date();
            const ts = `${String(dNow.getDate()).padStart(2,'0')}/${String(dNow.getMonth()+1).padStart(2,'0')}/${dNow.getFullYear()} ${String(dNow.getHours()).padStart(2,'0')}:${String(dNow.getMinutes()).padStart(2,'0')}:${String(dNow.getSeconds()).padStart(2,'0')}`;
            
            if(type === 'trx') {
                const total = window.cart.reduce((a,b)=>a+(b.prc*b.qty), 0);
                const data = oldData || { tot: total, pay: parseInt(document.getElementById('payInput').value.replace(/\D/g,''))||0, cust: document.getElementById('custName').value.toUpperCase() || 'UMUM', items: [...window.cart], ts: ts };
                
                s += row(center(window.config.n.toUpperCase(), M)) + "\n";
                s += row(center(window.config.a.toUpperCase(), M)) + "\n";
                s += row(center("HP: " + window.config.p, M)) + "\n";
                s += row("-".repeat(M)) + "\n";
                s += row(pad(`TGL: ${data.ts}`, 24) + pad(`KSR: ${window.curUser.u.toUpperCase()}`, 20, 'right')) + "\n";
                s += row(`CUST: ${data.cust}`) + "\n";
                s += row("=".repeat(M)) + "\n";
                
                data.items.forEach(it => {
                    s += row(it.name.toUpperCase()) + "\n";
                    s += row(pad(`${it.qty} ${it.unit} x ${it.base.toLocaleString()}`, 24) + pad((it.prc*it.qty).toLocaleString(), 20, 'right')) + "\n";
                });
                
                s += row("-".repeat(M)) + "\n";
                s += row(pad("TOTAL", 24) + pad(data.tot.toLocaleString(), 20, 'right')) + "\n";
                s += row(pad("TUNAI", 24) + pad(data.pay.toLocaleString(), 20, 'right')) + "\n";
                s += row(pad("KEMBALI", 24) + pad((data.pay-data.tot).toLocaleString(), 20, 'right')) + "\n";
                s += row("=".repeat(M)) + "\n";
                s += row(center(window.config.l, M));
                
                window.curPrintData = { type:'trx', content:s, raw:data, isReprint:!!oldData };
            } else {
                let grand = 0;
                s += row(center(window.config.n.toUpperCase(), M)) + "\n";
                s += row(center("LAPORAN AUDIT STOK", M)) + "\n";
                s += row(center(ts, M)) + "\n";
                s += row("=".repeat(M)) + "\n";
                s += row(pad("NAMA", 12) + pad("S.AWL", 6) + pad("SISA", 6) + pad("LAKU", 6) + pad("OMZET", 14, 'right')) + "\n";
                s += row("-".repeat(M)) + "\n";
                
                window.inventory.forEach(it => { 
                    const laku = it.sld || 0;
                    const awal = it.qty + laku;
                    grand += (it.rev || 0);
                    s += row(pad(it.name, 12) + pad(awal, 6) + pad(it.qty, 6) + pad(laku, 6) + pad((it.rev||0).toLocaleString(), 14, 'right')) + "\n"; 
                });
                
                s += row("=".repeat(M)) + "\n";
                s += row(pad("TOTAL OMZET", 20) + pad(grand.toLocaleString(), 24, 'right')) + "\n\n";
                
                // BOX TANDA TANGAN (LEBIH TINGGI)
                const line = "+" + "-".repeat(20) + "+" + "-".repeat(21) + "+";
                const empty = "|" + " ".repeat(20) + "|" + " ".repeat(21) + "|";
                s += row(line) + "\n";
                s += row("|" + center("MOTORIS", 20) + "|" + center("STOKIS", 21) + "|") + "\n";
                s += row(empty) + "\n";
                s += row(empty) + "\n";
                s += row(empty) + "\n";
                s += row(empty) + "\n";
                s += row(line);
                
                window.curPrintData = { type:'audit', content:s };
            }
            document.getElementById('receipt-content').innerText = s;
            document.getElementById('preview-overlay').style.display = 'flex';
        };

        // RESET & EXCEL
        window.resetSalesData = () => { if(confirm("Reset omzet & terjual?")) window.inventory.forEach(it => update(ref(db, 'v11/inventory/'+it.id), {sld:0, rev:0})); };
        window.downloadTemplate = () => {
            const ws = XLSX.utils.json_to_sheet([{ Nama: "SAMPLE", HargaBks: 0, HargaPak: 0, HargaBall: 0, Stok: 0 }]);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Kasirku");
            XLSX.writeFile(wb, "Template_Stok.xlsx");
        };
        window.exportExcel = () => {
            const ws = XLSX.utils.json_to_sheet(window.inventory.map(it => ({ Nama: it.name, HargaBks: it.pB, HargaPak: it.pP, HargaBall: it.pL, Stok: it.qty, Terjual: it.sld || 0, Omzet: it.rev || 0 })));
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "DataStok.xlsx");
            XLSX.writeFile(wb, "DataStok.xlsx");
        };
        window.importExcel = (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = XLSX.utils.sheet_to_json(XLSX.read(evt.target.result, {type:'binary'}).Sheets[XLSX.read(evt.target.result, {type:'binary'}).SheetNames[0]]);
                data.forEach(row => {
                    const exist = window.inventory.find(i => i.name === row.Nama);
                    const p = { name: row.Nama, pB: row.HargaBks||0, pP: row.HargaPak||0, pL: row.HargaBall||0, qty: row.Stok||0, sld: 0, rev: 0 };
                    if(exist) update(ref(db, 'v11/inventory/'+exist.id), p);
                    else set(push(ref(db, 'v11/inventory')), p);
                });
                alert("Ok!");
            };
            reader.readAsBinaryString(file);
        };

        // ADMIN FUNCTIONS
        window.saveCfg = () => { 
            set(ref(db, 'v11/config'), { 
                n: document.getElementById('cfgN').value.toUpperCase(), 
                a: document.getElementById('cfgA').value.toUpperCase(), 
                p: document.getElementById('cfgP').value, 
                l: window.config.l 
            }); 
            alert("Profil Tersimpan!"); 
        };

        // RENDER & AUTH
        const checkSession = () => {
            const saved = localStorage.getItem('kasirSession');
            if (saved) {
                window.curUser = JSON.parse(saved);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('roleDisp').innerText = `${window.curUser.r} | ${window.curUser.u}`;
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = (window.curUser.r === 'admin' ? 'flex' : 'none'));
                renderAll();
            }
        };

        window.handleLogin = () => {
            const u = document.getElementById('loginUser').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value.trim();
            const found = window.users.find(x => x.u === u && x.p === p);
            if(found) { window.curUser = found; localStorage.setItem('kasirSession', JSON.stringify(found)); location.reload(); } else alert("Error!");
        };
        window.handleLogout = () => { localStorage.removeItem('kasirSession'); location.reload(); };

        function renderAll() {
            const sel = document.getElementById('prodSelect'); if(sel) sel.innerHTML = '<option value="">- PILIH -</option>' + window.inventory.map((it,i) => `<option value="${i}">${it.name} [${it.qty}]</option>`).join('');
            const inv = document.getElementById('invList'); if(inv) inv.innerHTML = window.inventory.map((it) => `<div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm"><div class="text-xs uppercase"><b>${it.name}</b><br><span class="text-blue-600 font-bold">Stok: ${it.qty}</span></div><div class="flex gap-2"><button onclick="editStkCloud('${it.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold">EDIT</button><button onclick="delStk('${it.id}')" class="text-red-500 font-bold px-1 text-xs">X</button></div></div>`).join('');
            const cl = document.getElementById('cartList'); if(cl) cl.innerHTML = window.cart.map((c,i) => `<div class="bg-white p-4 rounded-2xl flex justify-between text-xs border shadow-sm"><div><b>${c.name}</b><br>${c.qty} ${c.unit}</div><button onclick="removeFromCart(${i})" class="text-red-500 font-black">Hapus</button></div>`).join('');
            document.getElementById('totDisp').innerText = window.cart.reduce((a,b)=>a+(b.prc*b.qty), 0).toLocaleString();
            document.getElementById('hList').innerHTML = window.trxHistory.slice(0,10).map(h => `<div class="bg-white p-4 rounded-2xl border flex justify-between items-center text-[10px] shadow-sm"><div><b>${h.cust}</b><br>${h.ts}<br>Rp ${h.tot.toLocaleString()}</div><div class="flex gap-2"><button onclick='showPreview("trx", ${JSON.stringify(h)})' class="bg-slate-800 text-white px-3 py-2 rounded-xl">STRUK</button><button onclick='delHistory("${h.hid}")' class="text-red-500">X</button></div></div>`).join('');
            document.getElementById('userList').innerHTML = window.users.map(u => `<div class="flex justify-between p-3 bg-slate-50 rounded-xl text-xs border"><span><b>${u.u.toUpperCase()}</b></span><button onclick="delUser('${u.id}')" class="text-red-500 font-bold">Hapus</button></div>`).join('');
        }

        window.tab = (t) => { ['kasir','stok','admin','hist'].forEach(k => { document.getElementById('sec-'+k)?.classList.add('hidden'); document.getElementById('t-'+k)?.classList.remove('tab-active'); }); document.getElementById('sec-'+t).classList.remove('hidden'); document.getElementById('t-'+t).classList.add('tab-active'); };
        window.formatRp = (e) => { let v = e.value.replace(/\D/g, ''); e.value = v ? parseInt(v).toLocaleString('id-ID') : ''; };
        window.setUnit = (u) => { window.selectedUnit = u; ['BKS','PAK','BALL'].forEach(v => { const el = document.getElementById('u-'+v); if(el) el.className = (v === u) ? 'flex-1 p-3 border-2 border-blue-600 bg-blue-50 rounded-xl font-black text-[10px]' : 'flex-1 p-3 border-2 rounded-xl font-black text-[10px]'; }); };
        window.handleProductChange = () => { document.getElementById('unitWrap').classList.toggle('hidden', !document.getElementById('prodSelect').value); window.setUnit('BKS'); };
        window.closePreview = () => document.getElementById('preview-overlay').style.display = 'none';
        window.addToCart = () => {
            const idx = document.getElementById('prodSelect').value; if(idx==="") return;
            const it = window.inventory[idx];
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const d = parseInt(document.getElementById('saleDisc').value) || 0;
            const bp = window.selectedUnit==='BKS'?it.pB:window.selectedUnit==='PAK'?it.pP:it.pL;
            window.cart.push({ name: it.name, unit: window.selectedUnit, base: bp, prc: bp-d, qty: q, id: it.id }); 
            renderAll();
        };
        window.saveStk = () => {
            const n = document.getElementById('stkName').value.toUpperCase();
            const eid = document.getElementById('editId').value;
            if(!n) return;
            const data = { name: n, pB: parseInt(document.getElementById('stkBks').value)||0, pP: parseInt(document.getElementById('stkPak').value)||0, pL: parseInt(document.getElementById('stkBall').value)||0, qty: parseInt(document.getElementById('stkQty').value)||0 };
            if(!eid) { const r = push(ref(db, 'v11/inventory')); data.sld = 0; data.rev = 0; set(r, data); }
            else update(ref(db, 'v11/inventory/' + eid), data);
            ['stkName','stkBks','stkPak','stkBall','stkQty','editId'].forEach(id => document.getElementById(id).value="");
            document.getElementById('stkBtn').innerText = "Simpan";
        }
        window.editStkCloud = (id) => {
            const it = window.inventory.find(x => x.id === id);
            document.getElementById('stkName').value = it.name; document.getElementById('stkBks').value = it.pB; document.getElementById('stkPak').value = it.pP; document.getElementById('stkBall').value = it.pL; document.getElementById('stkQty').value = it.qty;
            document.getElementById('editId').value = it.id; document.getElementById('stkBtn').innerText = "Update"; window.scrollTo({top:0, behavior:'smooth'});
        };
        window.delStk = (id) => { if(confirm("Hapus?")) remove(ref(db, 'v11/inventory/' + id)); };
        window.delHistory = (hid) => { if(confirm("Hapus?")) remove(ref(db, 'v11/history/' + hid)); };
        window.addUser = () => { const u = document.getElementById('newU').value.trim().toLowerCase(); const p = document.getElementById('newP').value.trim(); if(!u||!p) return; set(push(ref(db, 'v11/users')), {u, p, r:'kasir'}); document.getElementById('newU').value=""; document.getElementById('newP').value=""; };
        window.delUser = (id) => { if(confirm("Hapus?")) remove(ref(db, 'v11/users/'+id)); };
        window.removeFromCart = (i) => { window.cart.splice(i, 1); renderAll(); };
    </script>
</body>
</html>
