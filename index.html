<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V38.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 120px; }
        
        /* THERMAL CANVAS OPTIMIZATION */
        #receipt-canvas { 
            background: white; width: 100%; max-width: 80mm; margin: 0 auto;
            padding: 15px 0; color: black; font-family: 'Courier New', Courier, monospace; 
            font-size: 11px; line-height: 1.3;
        }
        .receipt-inner { padding: 0 10px; }
        .full-line { border-top: 1px dashed black; width: 100%; margin: 8px 0; }
        
        /* TABLE STYLES */
        .table-pro { width: 100%; border-collapse: collapse; font-size: 10px; }
        .table-pro th { border-bottom: 1px solid black; padding: 5px 0; text-align: left; text-transform: uppercase; }
        .table-pro td { padding: 5px 0; vertical-align: top; border-bottom: 0.5px solid #eee; }

        /* UI HELPERS */
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 900; }
        #preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none;
            flex-direction: column; align-items: center; padding: 15px; overflow-y: auto;
        }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
    </style>
</head>
<body>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div class="receipt-inner" id="receipt-content"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 w-full max-w-xs mt-6">
            <button onclick="confirmAction('jpg')" class="bg-orange-500 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">💾 Simpan JPG</button>
            <button onclick="printBluetooth()" class="bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">🖨️ Cetak BT</button>
            <button onclick="closePreview()" class="bg-red-600 text-white py-4 rounded-2xl font-black text-xs col-span-2 uppercase">Kembali</button>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-5 flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 id="shopNameDisplay" class="font-black text-lg uppercase tracking-tighter">KASIR PRO</h1>
            <p id="shopAddrDisplay" class="text-[9px] opacity-60 uppercase">V38.8 Audit Pro</p>
        </div>
        <button onclick="toggleSettings()" class="bg-slate-800 p-3 rounded-xl">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="w-full bg-slate-50 p-4 rounded-2xl font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <select id="prodSelect" class="flex-1 bg-blue-50 p-4 rounded-2xl font-black text-sm outline-none"></select>
                    <input type="number" id="saleQty" value="1" class="w-20 bg-slate-50 p-4 rounded-2xl text-center font-black">
                </div>
                <button onclick="addSaleItem()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase">Tambah</button>
            </div>
            <div id="saleList" class="bg-white p-4 rounded-2xl border min-h-[50px] space-y-2 font-mono text-xs"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[40px] shadow-2xl space-y-4">
                <div class="flex justify-between items-center"><span class="text-xs font-bold opacity-40 uppercase">Total Tagihan</span><span class="text-2xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="salePay" oninput="calculateChange()" placeholder="BAYAR" class="bg-slate-800 p-4 rounded-2xl text-emerald-400 font-bold outline-none">
                    <div class="bg-slate-800 p-4 rounded-2xl text-orange-400 font-bold text-center"><span class="text-[9px] block opacity-50 text-white uppercase">Kembali</span><span id="displayChange">0</span></div>
                </div>
                <button onclick="finalProcess('PENJUALAN')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest active:scale-95">Bayar & Cetak Nota</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div id="inventoryStatus" class="space-y-2"></div>
            <button onclick="prepareStockReport()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase shadow-lg">Cetak Laporan Audit Omzet</button>
        </div>

        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-emerald-600 p-6 rounded-[40px] shadow-xl text-white space-y-3">
                <input type="text" id="restockName" placeholder="NAMA BARANG" class="w-full p-4 rounded-2xl font-black uppercase text-slate-900 outline-none">
                <div class="flex gap-2">
                    <input type="number" id="restockPrice" placeholder="HRG JUAL" class="flex-1 p-4 rounded-2xl font-black text-slate-900 outline-none">
                    <input type="number" id="restockQty" placeholder="QTY" class="w-24 p-4 rounded-2xl font-black text-slate-900 outline-none">
                </div>
                <button onclick="addToQueue()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">+ Tambah Daftar</button>
            </div>
            <div id="queueList" class="bg-white p-4 rounded-3xl border min-h-[50px] space-y-2"></div>
            <button id="btnConfirmRestock" onclick="processQueue()" class="hidden w-full bg-emerald-700 text-white py-5 rounded-2xl font-black uppercase shadow-xl">Simpan & Cetak Faktur Masuk</button>
        </div>

        <div id="sec-laporan" class="hidden space-y-3">
            <div id="historyList" class="space-y-2"></div>
            <div class="pt-6">
                <button onclick="resetAllData()" class="w-full bg-red-100 text-red-600 py-4 rounded-2xl text-xs font-black uppercase border border-red-200">⚠️ Reset Semua Data (Database)</button>
            </div>
        </div>

    </div>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 space-y-3">
            <h3 class="font-black text-center uppercase border-b pb-2">Informasi Toko</h3>
            <input type="text" id="cfgNama" oninput="saveConfig()" placeholder="NAMA TOKO" class="w-full border p-3 rounded-xl uppercase font-bold">
            <input type="text" id="cfgAlamat" oninput="saveConfig()" placeholder="ALAMAT" class="w-full border p-3 rounded-xl uppercase">
            <input type="text" id="cfgHp" oninput="saveConfig()" placeholder="NOMOR HP / WA" class="w-full border p-3 rounded-xl">
            <input type="text" id="cfgFooter" oninput="saveConfig()" placeholder="FOOTER NOTA" class="w-full border p-3 rounded-xl uppercase">
            <button onclick="toggleSettings()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase mt-4">Simpan & Tutup</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active uppercase">🛒 Kasir</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black text-red-600 uppercase">📊 Stok</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black text-emerald-600 uppercase">📦 Masuk</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black text-blue-600 uppercase">📜 Riwayat</button>
    </div>

    <script>
        // CORE DB SYNC
        let inventory = JSON.parse(localStorage.getItem('v38_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v38_conf')) || { nama: "KASIR PRO", alamat: "ALAMAT", hp: "08XX", footer: "TERIMA KASIH" };
        let historyTrx = JSON.parse(localStorage.getItem('v38_hist')) || [];
        let tempCart = [], restockQueue = [];

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgAlamat').value = config.alamat;
            document.getElementById('cfgHp').value = config.hp;
            document.getElementById('cfgFooter').value = config.footer;
            updateUI(); updateDropdown();
        }

        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        function saveConfig() {
            config = { nama: document.getElementById('cfgNama').value.toUpperCase(), alamat: document.getElementById('cfgAlamat').value.toUpperCase(), hp: document.getElementById('cfgHp').value, footer: document.getElementById('cfgFooter').value.toUpperCase() };
            localStorage.setItem('v38_conf', JSON.stringify(config)); updateUI();
        }
        function updateUI() {
            document.getElementById('shopNameDisplay').innerText = config.nama;
            document.getElementById('shopAddrDisplay').innerText = config.alamat;
        }

        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderInventory();
            if(t==='laporan') renderHistory();
        }

        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">-- PILIH BARANG --</option>';
            inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (${it.qty})</option>`);
        }

        // KASIR & KEMBALIAN
        function calculateChange() {
            const tot = tempCart.reduce((a,b)=> a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            const change = pay - tot;
            document.getElementById('displayChange').innerText = change.toLocaleString();
            return {tot, pay, change};
        }

        function addSaleItem() {
            const i = document.getElementById('prodSelect').value; if(i==="") return;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const it = inventory[i];
            if(q > it.qty) return alert("Stok Habis!");
            const ex = tempCart.find(c => c.name === it.name);
            if(ex) ex.qty += q; else tempCart.push({name: it.name, price: it.price, qty: q});
            renderSaleList();
        }

        function renderSaleList() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border">
                    <span class="font-bold uppercase">${c.name} (${c.qty})</span>
                    <button onclick="tempCart.splice(${i},1);renderSaleList()" class="text-red-500 font-bold px-2 text-xl">×</button>
                </div>`).join('') || "<p class='text-center opacity-20 py-4 italic'>Kosong</p>";
            document.getElementById('displayTotal').innerText = tempCart.reduce((a,b)=> a+(b.price*b.qty), 0).toLocaleString();
            calculateChange();
        }

        // AUDIT OMZET (STOK AWAL - SISA = TERJUAL)
        function renderInventory() {
            const html = inventory.map(it => {
                const awal = it.qty + (it.sold || 0);
                const omzet = (it.sold || 0) * it.price;
                return `<div class="bg-white p-4 rounded-2xl border shadow-sm">
                    <div class="flex justify-between font-black uppercase text-xs"><span>${it.name}</span><span class="text-blue-600">Rp ${omzet.toLocaleString()}</span></div>
                    <div class="text-[9px] opacity-60 mt-2 font-mono uppercase">Audit: ${awal} (Awal) - ${it.qty} (Sisa) = ${it.sold||0} Terjual</div>
                </div>`;
            }).join('') || "<p class='text-center py-10 opacity-20 uppercase font-bold'>Database Kosong</p>";
            document.getElementById('inventoryStatus').innerHTML = html;
        }

        function prepareStockReport() {
            let total = 0;
            let rows = inventory.map(it => {
                const awal = it.qty + (it.sold || 0);
                const sub = (it.sold || 0) * it.price;
                total += sub;
                return `<tr><td>${it.name}</td><td align="center">${awal}</td><td align="center">${it.qty}</td><td align="center">${it.sold||0}</td><td align="right">${sub.toLocaleString()}</td></tr>`;
            }).join('');

            window.activeTrx = { type: "LAPORAN AUDIT STOK", date: new Date().toLocaleString('id-ID'), total };
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;">
                    <b style="font-size:14px;">${config.nama}</b><br>
                    <span>TELP: ${config.hp}</span><br>
                    <b style="font-size:10px;">LAPORAN AUDIT OMZET</b>
                </div>
                <div class="full-line"></div>
                <table class="table-pro">
                    <thead><tr><th>ITEM</th><th>AWAL</th><th>SISA</th><th>LAKU</th><th align="right">OMZET</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="full-line"></div>
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:12px;"><span>TOTAL OMZET</span><span>Rp ${total.toLocaleString()}</span></div>
                <div class="full-line"></div><div style="text-align:center; font-size:9px;">TGL CETAK: ${window.activeTrx.date}</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        // FAKTUR MASUK (QUEUE & CLEAN LAYOUT)
        function addToQueue() {
            const n = document.getElementById('restockName').value, p = parseInt(document.getElementById('restockPrice').value), q = parseInt(document.getElementById('restockQty').value);
            if(!n || !p || !q) return alert("Data Belum Lengkap!");
            restockQueue.push({name: n.toUpperCase(), price: p, qty: q});
            renderQueue();
            document.getElementById('restockName').value=""; document.getElementById('restockQty').value="";
        }

        function renderQueue() {
            document.getElementById('queueList').innerHTML = restockQueue.map((it, i) => `
                <div class="flex justify-between bg-white p-3 rounded-xl border shadow-sm">
                    <span class="text-xs font-bold uppercase">${it.name} [${it.qty}]</span>
                    <button onclick="restockQueue.splice(${i},1);renderQueue()" class="text-red-500 font-bold px-2">×</button>
                </div>`).join('') || "<p class='text-center py-4 opacity-40 text-xs italic'>Belum ada barang masuk</p>";
            restockQueue.length > 0 ? document.getElementById('btnConfirmRestock').classList.remove('hidden') : document.getElementById('btnConfirmRestock').classList.add('hidden');
        }

        function processQueue() {
            window.activeTrx = { type: "FAKTUR BARANG MASUK", date: new Date().toLocaleString('id-ID'), items: [...restockQueue] };
            restockQueue.forEach(it => {
                const ex = inventory.find(i=>i.name===it.name);
                if(ex) { ex.qty += it.qty; ex.price = it.price; } else { inventory.push({name:it.name, price:it.price, qty:it.qty, sold:0}); }
            });
            localStorage.setItem('v38_stok', JSON.stringify(inventory));
            
            let rows = window.activeTrx.items.map(it => `<tr><td>${it.name}</td><td align="right">${it.qty} PCS</td></tr>`).join('');
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;">
                    <b style="font-size:14px;">${config.nama}</b><br>
                    <span>TELP: ${config.hp}</span><br>
                    <b style="font-size:10px;">FAKTUR PENERIMAAN BARANG</b>
                </div>
                <div class="full-line"></div>
                <div style="font-size:9px;">TGL: ${window.activeTrx.date}</div>
                <div class="full-line"></div>
                <table class="table-pro"><thead><tr><th>NAMA BARANG</th><th align="right">QTY</th></tr></thead><tbody>${rows}</tbody></table>
                <div class="full-line"></div><div style="text-align:center; font-size:9px; font-style:italic;">Barang telah diverifikasi dan masuk stok.</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
            restockQueue = []; renderQueue();
        }

        // PENJUALAN & NOTA
        function finalProcess(m) {
            const v = calculateChange();
            if(v.tot === 0) return;
            if(v.pay < v.tot) return alert("Uang pembayaran kurang!");
            
            const trx = { type:m, date: new Date().toLocaleString('id-ID'), id: 'INV'+Date.now().toString().slice(-6), ...v, items:[...tempCart], cust: document.getElementById('custName').value.toUpperCase() || "UMUM" };
            window.activeTrx = trx;
            
            let rows = trx.items.map(it => `<tr><td>${it.name}</td><td align="right">${it.price.toLocaleString()}</td><td align="center">${it.qty}</td><td align="right">${(it.price*it.qty).toLocaleString()}</td></tr>`).join('');
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b style="font-size:16px;">${config.nama}</b><br>${config.alamat}<br>TELP: ${config.hp}</div>
                <div class="full-line"></div>
                <div style="font-size:9px; display:flex; justify-content:space-between;"><span>${trx.id}</span><span>${trx.date.split(',')[0]}</span></div>
                <div style="font-size:9px;">PELANGGAN: ${trx.cust}</div>
                <div class="full-line"></div>
                <table class="table-pro"><thead><tr><th>ITEM</th><th align="right">HRG</th><th align="center">QTY</th><th align="right">TOT</th></tr></thead><tbody>${rows}</tbody></table>
                <div class="full-line"></div>
                <div style="font-size:11px;">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px;"><span>TOTAL</span><span>Rp ${trx.tot.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>TUNAI</span><span>${trx.pay.toLocaleString()}</span></div>
                    <div style="display:flex; justify-content:space-between;"><span>KEMBALI</span><span>${trx.change.toLocaleString()}</span></div>
                </div>
                <div class="full-line"></div><div style="text-align:center; font-size:10px;">${config.footer}</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        async function printBluetooth() {
            const trx = window.activeTrx;
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                
                let c = '\x1b\x40\x1b\x61\x01\x1b\x21\x10'+config.nama+'\n'+trx.type+'\n\x1b\x21\x00'+config.hp+'\n--------------------------------\n\x1b\x61\x00';
                
                if(trx.type === "PENJUALAN") {
                    trx.items.forEach(it => { c += `${it.name.substring(0,20)}\n${it.price.toLocaleString()} x ${it.qty} = ${(it.price*it.qty).toLocaleString()}\n`; });
                    c += `--------------------------------\nTOTAL   : Rp ${trx.tot.toLocaleString()}\nTUNAI   : Rp ${trx.pay.toLocaleString()}\nKEMBALI : Rp ${trx.change.toLocaleString()}\n`;
                } else if(trx.type === "LAPORAN AUDIT STOK") {
                    c += "ITEM | AWAL | SISA | LAKU | OMZET\n--------------------------------\n";
                    inventory.forEach(it => { c += `${it.name.substring(0,10)} ${it.qty+it.sold} ${it.qty} ${it.sold} ${(it.sold*it.price).toLocaleString()}\n`; });
                    c += `--------------------------------\nTOTAL: Rp ${trx.total.toLocaleString()}\n`;
                } else {
                    trx.items.forEach(it => { c += `${it.name.substring(0,20)} x ${it.qty} UNIT\n`; });
                }
                
                c += `\n\x1b\x61\x01${trx.date}\n\n\n\n`;
                await char.writeValue(new TextEncoder().encode(c));
                if(trx.type === "PENJUALAN") confirmAction('none'); else closePreview();
            } catch (err) { alert("Aktifkan Bluetooth & GPS!"); }
        }

        async function confirmAction(type) {
            const trx = window.activeTrx;
            if(trx.type === "PENJUALAN" && !trx.isReprint) {
                trx.items.forEach(it => {
                    const inv = inventory.find(i=>i.name===it.name);
                    inv.qty -= it.qty; inv.sold = (inv.sold || 0) + it.qty;
                });
                historyTrx.unshift(trx);
                localStorage.setItem('v38_stok', JSON.stringify(inventory));
                localStorage.setItem('v38_hist', JSON.stringify(historyTrx));
            }
            if(type === 'jpg') {
                const canvas = await html2canvas(document.getElementById('receipt-canvas'), {scale:3});
                const l = document.createElement('a'); l.download = trx.type+'.jpg'; l.href = canvas.toDataURL(); l.click();
            }
            location.reload();
        }

        function resetAllData() {
            if(confirm("PERHATIAN: Ini akan menghapus seluruh Stok, Riwayat, dan Pengaturan Toko. Anda yakin?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function renderHistory() {
            document.getElementById('historyList').innerHTML = historyTrx.map((t, i) => `
                <div class="bg-white p-4 rounded-3xl border flex justify-between items-center shadow-sm">
                    <div class="text-[10px] font-mono">ID: ${t.id}<br><b class="text-xs">Rp ${t.tot.toLocaleString()}</b></div>
                    <button onclick="reprint(${i})" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-md">Nota</button>
                </div>`).join('') || "<p class='text-center py-10 opacity-20'>Belum ada transaksi</p>";
        }
        function reprint(i) { window.activeTrx = {...historyTrx[i], isReprint:true}; finalProcess('PENJUALAN'); }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
