<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASIR PRO CLOUD V52.10.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDFE7OgaFfZvFXyuJ6YFafBNhB_IGXPtZs",
            authDomain: "kasirku-pro.firebaseapp.com",
            databaseURL: "https://kasirku-pro-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kasirku-pro",
            storageBucket: "kasirku-pro.firebasestorage.app",
            messagingSenderId: "765663464878",
            appId: "1:765663464878:web:9b9ad4e90fb3c08b830c3f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Global
        let users = [];
        let inventory = [];
        let config = {};
        let history = [];
        let cart = [];
        let curUser = null;
        let btChar = null;
        let selectedUnit = 'BKS';
        const L = 48;

        // --- CORE FUNCTIONS ---
        const getNow = () => {
            const d = new Date();
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        };

        const pad = (t, n, al='left') => { t = (t||"").toString().substring(0, n); return al === 'left' ? t.padEnd(n, ' ') : t.padStart(n, ' '); };
        const center = (t, n) => { t = (t||"").toString().substring(0, n); const x = n - t.length; return ' '.repeat(Math.floor(x/2)) + t + ' '.repeat(Math.ceil(x/2)); };

        // --- REALTIME DATA SYNC ---
        onValue(ref(db, 'v11/users'), (s) => { 
            users = s.val() ? Object.values(s.val()) : [{u:'admin', p:'admin', r:'admin'}]; 
            renderAll(); 
        });
        onValue(ref(db, 'v11/inventory'), (s) => { 
            inventory = s.val() ? Object.values(s.val()) : []; 
            renderAll(); 
        });
        onValue(ref(db, 'v11/config'), (s) => { 
            config = s.val() || { n: "NAMA TOKO", a: "ALAMAT", p: "0812-xxx", l: "TERIMA KASIH" }; 
            document.getElementById('shopDisp').innerText = config.n;
            renderAll(); 
        });
        onValue(ref(db, 'v11/history'), (s) => { 
            history = s.val() ? Object.values(s.val()).reverse() : []; 
            renderAll(); 
        });

        // --- LOGIC KASIR ---
        window.handleLogin = () => {
            const u = document.getElementById('loginUser').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value.trim();
            const found = users.find(x => x.u === u && x.p === p);
            if(found) {
                curUser = found;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('roleDisp').innerText = `${found.r} | ${found.u.toUpperCase()}`;
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = found.r === 'admin' ? 'flex' : 'none');
                renderAll();
            } else alert("LOGIN GAGAL");
        };

        window.addToCart = () => {
            const idx = document.getElementById('prodSelect').value; if(!idx) return;
            const it = inventory[idx]; const q = parseInt(document.getElementById('saleQty').value); const d = parseInt(document.getElementById('saleDisc').value);
            const bp = selectedUnit==='BKS'?it.pB:selectedUnit==='PAK'?it.pP:it.pL;
            cart.push({ name: it.name, unit: selectedUnit, base: bp, prc: bp-d, qty: q, id: it.id }); 
            renderAll();
        };

        window.finalizeTrx = async (data) => {
            // Update Stok di Firebase
            data.items.forEach(c => {
                const it = inventory.find(i => i.name === c.name);
                if(it) {
                    const conv = (c.unit==='BKS'?1:c.unit==='PAK'?10:200);
                    const newQty = it.qty - (c.qty * conv);
                    const newSld = (it.sld || 0) + (c.qty * conv);
                    const newRev = (it.rev || 0) + (c.prc * c.qty);
                    update(ref(db, 'v11/inventory/' + it.id), { qty: newQty, sld: newSld, rev: newRev });
                }
            });
            // Simpan History ke Firebase
            const newHistRef = push(ref(db, 'v11/history'));
            set(newHistRef, data);
            cart = []; document.getElementById('payInput').value = ""; renderAll();
        };

        window.saveStk = () => {
            const n = document.getElementById('stkName').value.toUpperCase();
            const editId = document.getElementById('editId').value;
            if(!n) return;
            
            const data = {
                name: n,
                pB: parseInt(document.getElementById('stkBks').value)||0,
                pP: parseInt(document.getElementById('stkPak').value)||0,
                pL: parseInt(document.getElementById('stkBall').value)||0,
                qty: parseInt(document.getElementById('stkQty').value)||0,
            };

            if(editId === "") {
                const newRef = push(ref(db, 'v11/inventory'));
                data.id = newRef.key;
                data.sld = 0; data.rev = 0;
                set(newRef, data);
            } else {
                update(ref(db, 'v11/inventory/' + editId), data);
            }
            window.clearStkForm();
        };

        window.delStk = (id) => { if(confirm("Hapus?")) remove(ref(db, 'v11/inventory/' + id)); };
        window.saveCfg = () => {
            set(ref(db, 'v11/config'), {
                n: document.getElementById('cfgN').value,
                a: document.getElementById('cfgA').value,
                p: document.getElementById('cfgP').value,
                l: document.getElementById('cfgL').value
            });
            alert("SINKRON BERHASIL");
        };

        window.addAcct = () => {
            const u = document.getElementById('newU').value.toLowerCase().trim();
            const p = document.getElementById('newP').value;
            const r = document.getElementById('newRole').value;
            if(!u || !p) return;
            const newRef = push(ref(db, 'v11/users'));
            set(newRef, { u, p, r, id: newRef.key });
            document.getElementById('newU').value = ""; document.getElementById('newP').value = "";
        };

        window.resetSales = () => {
            if(confirm("Nolkan omzet semua barang?")) {
                inventory.forEach(it => {
                    update(ref(db, 'v11/inventory/' + it.id), { sld: 0, rev: 0 });
                });
            }
        };

        // --- RENDER UI ---
        function renderAll() {
            const sel = document.getElementById('prodSelect');
            if(sel) sel.innerHTML = '<option value="">- PILIH BARANG -</option>' + inventory.map((it,i) => `<option value="${i}">${it.name} (${it.qty})</option>`).join('');
            
            const inv = document.getElementById('invList');
            if(inv) inv.innerHTML = inventory.map((it) => `
                <div class="bg-white p-3 rounded-xl border flex justify-between items-center text-xs shadow-sm">
                    <div><b>${it.name}</b><br><span class="text-blue-600">SISA: ${it.qty}</span> | LAKU: ${it.sld||0}</div>
                    <div class="flex gap-1">
                        <button onclick="editStkCloud('${it.id}')" class="bg-blue-50 text-blue-600 px-3 py-2 rounded-lg font-bold">EDIT</button>
                        <button onclick="delStk('${it.id}')" class="bg-red-50 text-red-500 px-2 rounded-lg font-bold">X</button>
                    </div>
                </div>`).join('');

            const cl = document.getElementById('cartList');
            if(cl) cl.innerHTML = cart.map((c,i) => `<div class="bg-white p-3 rounded-xl flex justify-between text-xs border shadow-sm items-center"><div><b>${c.name}</b><br>${c.qty} ${c.unit}</div><button onclick="cart.splice(${i},1);renderAll()" class="text-red-500 font-bold">HAPUS</button></div>`).join('');
            
            const tot = document.getElementById('totDisp');
            if(tot) tot.innerText = cart.reduce((a,b)=>a+(b.prc*b.qty), 0).toLocaleString();

            const hist = document.getElementById('hList');
            if(hist) hist.innerHTML = history.slice(0,10).map(h => `<div class="bg-white p-4 rounded-xl border flex justify-between items-center text-[10px]"><div><b>${h.cust}</b><br>${h.ts}<br>Total: Rp ${h.tot.toLocaleString()}</div><button onclick='window.showPreview("trx", ${JSON.stringify(h)})' class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold">PRINT</button></div>`).join('');

            const ul = document.getElementById('userList');
            if(ul) ul.innerHTML = users.map((u) => `<div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg border"><span>${u.u.toUpperCase()} [${u.r}]</span> <button onclick="window.delUser('${u.id}')" class="text-red-500 font-bold">X</button></div>`).join('');
        }

        // Exposed to Window for HTML Onclick
        window.editStkCloud = (id) => {
            const it = inventory.find(x => x.id === id);
            document.getElementById('stkName').value = it.name; document.getElementById('stkBks').value = it.pB; document.getElementById('stkPak').value = it.pP; document.getElementById('stkBall').value = it.pL; document.getElementById('stkQty').value = it.qty;
            document.getElementById('editId').value = it.id; document.getElementById('formTitle').innerText = "Edit Barang"; document.getElementById('stkBtn').innerText = "UPDATE DATA";
        };
        window.delUser = (id) => { if(confirm("Hapus user?")) remove(ref(db, 'v11/users/' + id)); };
        window.clearStkForm = () => {
            ['stkName','stkBks','stkPak','stkBall','stkQty','editId'].forEach(id => document.getElementById(id).value="");
            document.getElementById('formTitle').innerText = "Input Barang"; document.getElementById('stkBtn').innerText = "SIMPAN KE DATABASE";
        };
        window.showPreview = (type, oldData = null) => {
            let s = ""; const ts = getNow();
            if(type === 'trx') {
                const data = oldData || { tot: cart.reduce((a,b)=>a+(b.prc*b.qty), 0), pay: parseInt(document.getElementById('payInput').value.replace(/\./g, '')) || 0, cust: document.getElementById('custName').value.toUpperCase() || 'UMUM', items: [...cart], ts: ts };
                if(!oldData && (data.tot === 0 || data.pay < data.tot)) return alert("NOMINAL KURANG");
                s = `${center(config.n, L)}\n${center(config.a, L)}\n${center("HP: "+config.p, L)}\n${center(data.ts, L)}\n${"=".repeat(L)}\n`;
                if(oldData) s += `${center("*** SALINAN STRUK ***", L)}\n`;
                s += `KASIR: ${curUser.u.toUpperCase()}\nPELANGGAN: ${data.cust}\n${"-".repeat(L)}\n`;
                data.items.forEach(it => { s += `${it.name.toUpperCase()}\n${pad(it.qty+" "+it.unit+" x "+it.base.toLocaleString(), 30)}${pad((it.prc*it.qty).toLocaleString(), 18, 'right')}\n`; });
                s += `${"=".repeat(L)}\n${pad("TOTAL", 30)}${pad(data.tot.toLocaleString(), 18, 'right')}\n${pad("TUNAI", 30)}${pad(data.pay.toLocaleString(), 18, 'right')}\n${pad("KEMBALI", 30)}${pad((data.pay-data.tot).toLocaleString(), 18, 'right')}\n${"=".repeat(L)}\n${center(config.l, L)}`;
                window.curPrintData = { type: 'trx', content: s, raw: data, isReprint: !!oldData };
            } else if(type === 'audit') {
                let grand = 0;
                s = `${center(config.n, L)}\n${center("LAPORAN AUDIT STOK", L)}\n${center(ts, L)}\n${"=".repeat(L)}\n`;
                s += `${pad("NAMA", 11)} ${pad("AWAL", 6)} ${pad("SISA", 6)} ${pad("LAKU", 6)} ${pad("OMZET", 15, 'right')}\n${"-".repeat(L)}\n`;
                inventory.forEach(it => { grand += (it.rev || 0); s += `${pad(it.name, 11)} ${pad(it.qty+(it.sld||0), 6)} ${pad(it.qty, 6)} ${pad(it.sld||0, 6)} ${pad((it.rev||0).toLocaleString(), 15, 'right')}\n`; });
                s += `${"=".repeat(L)}\nTOTAL OMZET: Rp ${grand.toLocaleString()}\n\n`;
                const line = `+${"-".repeat(22)}+`; s += `${line}${line}\n|${center("PENGAMBIL", 22)}||${center("PEMILIK", 22)}|\n${('|                      ||                      |\n').repeat(5)}${line}${line}`;
                window.curPrintData = { type: 'audit', content: s };
            }
            document.getElementById('receipt-content').innerText = s; document.getElementById('preview-overlay').style.display = 'flex';
        };

        window.executePrint = async () => {
            if(!btChar) return alert("HUBUNGKAN PRINTER");
            const enc = new TextEncoder();
            const lines = (window.curPrintData.content + "\n\n\n\n").split('\n');
            for (let l of lines) await btChar.writeValue(enc.encode(l + "\n"));
            if(window.curPrintData.type === 'trx' && !window.curPrintData.isReprint) window.finalizeTrx(window.curPrintData.raw);
            window.closePreview();
        };

        window.connectBT = async () => {
            const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }], optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
            const srv = await dev.gatt.connect();
            const sc = await srv.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
            btChar = await sc.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
            document.getElementById('btStat').innerText = "✅ ONLINE";
        };
        window.closePreview = () => document.getElementById('preview-overlay').style.display = 'none';
        window.setUnit = (u) => { selectedUnit = u; ['BKS','PAK','BALL'].forEach(v => document.getElementById('u-'+v).className = v === u ? 'flex-1 p-3 border-2 border-blue-600 bg-blue-50 rounded-xl font-black text-[10px]' : 'flex-1 p-3 border-2 rounded-xl font-black text-[10px]'); };
        window.handleProductChange = () => { document.getElementById('unitWrap').classList.toggle('hidden', !document.getElementById('prodSelect').value); window.setUnit('BKS'); };
        window.formatRp = (e) => { let v = e.value.replace(/[^,\d]/g,''); e.value = v ? parseInt(v).toLocaleString('id-ID') : ''; };
        window.setPas = () => { document.getElementById('payInput').value = document.getElementById('totDisp').innerText; };
        window.tab = (t) => {
            ['kasir','stok','admin','hist'].forEach(k => { document.getElementById('sec-'+k).classList.add('hidden'); document.getElementById('t-'+k).classList.remove('tab-active'); });
            document.getElementById('sec-'+t).classList.remove('hidden'); document.getElementById('t-'+t).classList.add('tab-active');
        };
        window.handleLogout = () => location.reload();

    </script>
</head>
<body>

    <div id="preview-overlay">
        <div class="flex flex-col w-full items-center">
            <div id="receipt-content" class="receipt-paper"></div>
            <div class="flex gap-2 w-full max-w-[420px] mt-4 px-2">
                <button onclick="window.closePreview()" class="flex-1 bg-slate-800 text-white py-4 rounded-xl font-black">BATAL</button>
                <button onclick="window.executePrint()" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-black">CETAK</button>
            </div>
        </div>
    </div>

    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-[9998] flex items-center justify-center p-6 text-white text-center">
        <div class="bg-white text-slate-900 p-8 rounded-[2.5rem] w-full max-w-sm">
            <h2 class="text-3xl font-black mb-6 text-blue-600 italic">CLOUD V12</h2>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USERNAME" class="border-2 p-3 rounded-xl w-full uppercase font-bold outline-none border-slate-200">
                <input type="password" id="loginPass" placeholder="PASSWORD" class="border-2 p-3 rounded-xl w-full outline-none border-slate-200">
                <button onclick="window.handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg">MASUK</button>
            </div>
            <p class="text-[10px] mt-4 text-slate-400">Default: admin / admin</p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="bg-white border-b p-4 sticky top-0 z-50 flex justify-between items-center">
            <div class="flex flex-col"><span id="shopDisp" class="font-black text-blue-700 uppercase text-lg leading-tight">TOKO</span><span id="roleDisp" class="text-[10px] font-bold text-slate-400 uppercase"></span></div>
            <div class="flex gap-2">
                <button id="btStat" onclick="window.connectBT()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-xl text-[9px] font-black border">🔌 PRINTER</button>
                <button onclick="window.handleLogout()" class="bg-red-50 text-red-600 px-3 py-2 rounded-xl text-[9px] font-black border border-red-100">LOGOUT</button>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-4">
            <section id="sec-kasir" class="space-y-4">
                <div class="bg-white p-5 rounded-[2rem] border shadow-sm space-y-3">
                    <input type="text" id="custName" placeholder="NAMA PELANGGAN" class="border-2 p-3 rounded-xl w-full uppercase font-bold text-sm outline-none border-slate-100 bg-slate-50">
                    <select id="prodSelect" onchange="window.handleProductChange()" class="border-2 p-3 rounded-xl w-full font-bold bg-white text-sm border-slate-200"></select>
                    <div id="unitWrap" class="flex gap-1 hidden">
                        <button onclick="window.setUnit('BKS')" id="u-BKS" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BKS</button>
                        <button onclick="window.setUnit('PAK')" id="u-PAK" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">PAK</button>
                        <button onclick="window.setUnit('BALL')" id="u-BALL" class="flex-1 p-3 border-2 rounded-xl font-black text-[10px]">BALL</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="saleQty" value="1" class="border-2 p-3 rounded-xl w-full text-center font-bold">
                        <input type="number" id="saleDisc" value="0" class="border-2 p-3 rounded-xl w-full text-center text-red-500 font-bold">
                    </div>
                    <button onclick="window.addToCart()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase">TAMBAH</button>
                </div>
                <div id="cartList" class="space-y-2"></div>
                <div class="bg-slate-900 p-6 rounded-[2.5rem] text-white space-y-4">
                    <div class="flex justify-between items-center"><span class="text-xs font-bold opacity-50">TOTAL</span><span class="text-3xl font-black text-blue-400">Rp <span id="totDisp">0</span></span></div>
                    <div class="flex gap-2">
                        <input type="text" id="payInput" oninput="window.formatRp(this)" placeholder="TUNAI" class="flex-1 bg-slate-800 text-emerald-400 text-2xl font-black text-center rounded-xl py-3 outline-none">
                        <button onclick="window.setPas()" class="bg-blue-600 px-4 rounded-xl font-black text-[10px]">PAS</button>
                    </div>
                    <button onclick="window.showPreview('trx')" class="w-full bg-blue-500 py-4 rounded-xl font-black uppercase">CETAK STRUK</button>
                </div>
            </section>

            <section id="sec-stok" class="hidden space-y-4">
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm space-y-4">
                    <h3 id="formTitle" class="font-black text-xs text-blue-600 uppercase">Input Barang</h3>
                    <input type="hidden" id="editId" value="">
                    <input type="text" id="stkName" placeholder="NAMA BARANG" class="border-2 p-3 rounded-xl w-full font-bold text-xs uppercase">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="stkBks" placeholder="BKS" class="border-2 p-3 rounded-xl text-xs">
                        <input type="number" id="stkPak" placeholder="PAK" class="border-2 p-3 rounded-xl text-xs">
                        <input type="number" id="stkBall" placeholder="BALL" class="border-2 p-3 rounded-xl text-xs">
                    </div>
                    <input type="number" id="stkQty" placeholder="STOK (BKS)" class="border-2 p-3 rounded-xl w-full text-xs font-bold">
                    <button id="stkBtn" onclick="window.saveStk()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black uppercase text-xs">SIMPAN</button>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.resetSales()" class="bg-red-50 text-red-600 border border-red-100 p-3 rounded-xl font-black text-[9px]">RESET TERJUAL</button>
                        <button onclick="window.showPreview('audit')" class="bg-slate-900 text-white p-3 rounded-xl font-black text-[10px]">AUDIT</button>
                    </div>
                </div>
                <div id="invList" class="space-y-2"></div>
            </section>

            <section id="sec-admin" class="hidden space-y-4">
                <div class="bg-white p-6 rounded-[2rem] border-2 space-y-4 shadow-sm">
                    <input type="text" id="cfgN" placeholder="NAMA TOKO" class="border-2 p-3 rounded-xl w-full font-bold">
                    <input type="text" id="cfgA" placeholder="ALAMAT" class="border-2 p-3 rounded-xl w-full">
                    <input type="text" id="cfgP" placeholder="NO HP" class="border-2 p-3 rounded-xl w-full">
                    <textarea id="cfgL" placeholder="FOOTER" class="border-2 p-3 rounded-xl w-full"></textarea>
                    <button onclick="window.saveCfg()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black uppercase">UPDATE TOKO</button>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border-2 space-y-4">
                    <div id="userList" class="space-y-2 mb-2"></div>
                    <input type="text" id="newU" placeholder="USER" class="border-2 p-3 rounded-xl w-full text-xs">
                    <input type="password" id="newP" placeholder="PASS" class="border-2 p-3 rounded-xl w-full text-xs">
                    <select id="newRole" class="border-2 p-3 rounded-xl w-full text-xs font-bold"><option value="kasir">KASIR</option><option value="admin">ADMIN</option></select>
                    <button onclick="window.addAcct()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black uppercase text-xs">TAMBAH USER</button>
                </div>
            </section>

            <section id="sec-hist" class="hidden space-y-2"><div id="hList" class="space-y-2"></div></section>
        </main>

        <nav class="bottom-nav">
            <button onclick="window.tab('kasir')" id="t-kasir" class="nav-item tab-active"><span>🛒</span><span>KASIR</span></button>
            <button onclick="window.tab('hist')" id="t-hist" class="nav-item"><span>📜</span><span>RIWAYAT</span></button>
            <button onclick="window.tab('stok')" id="t-stok" class="nav-item admin-only"><span>📦</span><span>STOK</span></button>
            <button onclick="window.tab('admin')" id="t-admin" class="nav-item admin-only"><span>⚙️</span><span>ADMIN</span></button>
        </nav>
    </div>
</body>
</html>
