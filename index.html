<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V41.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 100px; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
        #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; }
        #receipt-canvas { background: white; width: 80mm; padding: 10px; color: black; font-family: monospace; }
        .full-line { border-top: 1px dashed black; margin: 8px 0; }
    </style>
</head>
<body>

    <div class="bg-blue-700 text-white p-5 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div><h1 id="shopDisplay" class="font-black text-lg uppercase">KASIR PRO</h1><p class="text-[9px] opacity-70">IMPORT REPAIR V41.5</p></div>
        <button onclick="switchTab('ambil')" class="bg-blue-800 px-4 py-2 rounded-xl text-xs font-bold border border-blue-400">DATABASE</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-[2rem] shadow-xl border border-blue-100 space-y-4">
                <select id="prodSelect" class="w-full bg-slate-50 p-4 rounded-2xl font-black text-sm outline-none border-2 border-slate-200 focus:border-blue-500 transition-all"></select>
                <div class="flex gap-2">
                    <input type="number" id="saleQty" value="1" class="w-24 bg-slate-50 p-4 rounded-2xl text-center font-black border-2 border-slate-200">
                    <button onclick="addSaleItem()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-md active:scale-95 transition-transform">TAMBAH</button>
                </div>
            </div>
            <div id="saleList" class="space-y-2"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl space-y-4">
                <div class="flex justify-between items-center"><span class="text-[10px] font-bold opacity-50 uppercase tracking-widest">Total Bayar</span><span class="text-3xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <input type="number" id="salePay" oninput="calculateChange()" placeholder="MASUKKAN PEMBAYARAN" class="w-full bg-slate-800 p-5 rounded-2xl text-emerald-400 font-black text-center text-2xl outline-none border-2 border-slate-700 focus:border-emerald-500 transition-all">
                <div class="flex justify-between px-2 font-bold text-orange-400"><span>KEMBALIAN</span><span>Rp <span id="displayChange">0</span></span></div>
                <button onclick="processTransaction()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-[0.2em] shadow-lg active:bg-blue-700">BAYAR & SIMPAN</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div class="flex gap-2">
                <button onclick="prepareStockReport()" class="flex-1 bg-white p-4 rounded-2xl border-2 border-blue-100 font-black text-[10px] text-blue-600 uppercase shadow-sm">📊 LAPORAN AUDIT</button>
                <button onclick="resetSoldData()" class="flex-1 bg-white p-4 rounded-2xl border-2 border-red-100 font-black text-[10px] text-red-500 uppercase shadow-sm">🧹 RESET LAKU</button>
            </div>
            <div id="inventoryStatus" class="space-y-3"></div>
        </div>

        <div id="sec-ambil" class="hidden space-y-6">
            <div class="bg-emerald-600 p-6 rounded-[2rem] text-white shadow-lg space-y-3">
                <h3 class="text-center font-black text-xs uppercase mb-2">Input Barang Manual</h3>
                <input type="text" id="restockName" placeholder="NAMA BARANG" class="w-full p-4 rounded-xl text-slate-900 font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <input type="number" id="restockPrice" placeholder="HARGA" class="flex-1 p-4 rounded-xl text-slate-900 font-bold outline-none">
                    <input type="number" id="restockQty" placeholder="STOK" class="w-24 p-4 rounded-xl text-slate-900 font-bold outline-none">
                </div>
                <button onclick="addToQueue()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase">TAMBAH KE DAFTAR</button>
                <div id="queueList" class="space-y-1 mt-2 text-xs font-bold"></div>
                <button id="btnConfirmRestock" onclick="processQueue()" class="hidden w-full bg-white text-emerald-700 py-4 rounded-xl font-black uppercase">SIMPAN DATABASE</button>
            </div>

            <div class="bg-white p-6 rounded-[2rem] border-2 border-slate-200 space-y-4">
                <h3 class="font-black text-xs text-slate-400 uppercase">Tools Import / Export</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportCSV()" class="bg-slate-100 p-4 rounded-xl font-bold text-[10px] uppercase border">💾 Simpan Excel</button>
                    <button onclick="document.getElementById('importInput').click()" class="bg-slate-100 p-4 rounded-xl font-bold text-[10px] uppercase border">📂 Buka Excel</button>
                    <input type="file" id="importInput" class="hidden" accept=".csv" onchange="importCSV(event)">
                </div>
                <div class="p-3 bg-blue-50 rounded-xl border border-blue-100">
                    <p class="text-[9px] font-bold text-blue-800 uppercase mb-1">Panduan Excel (CSV):</p>
                    <p class="text-[9px] text-blue-600 leading-relaxed italic">Kolom A: Nama, Kolom B: Harga, Kolom C: Stok, Kolom D: Terjual. Simpan sebagai <b>CSV (Comma Delimited)</b>.</p>
                </div>
            </div>

            <div class="bg-slate-200 p-6 rounded-[2rem] space-y-3">
                <input type="text" id="cfgNama" placeholder="NAMA TOKO" class="w-full p-3 rounded-xl font-bold uppercase outline-none">
                <input type="text" id="cfgHp" placeholder="NO HP" class="w-full p-3 rounded-xl font-bold outline-none">
                <button onclick="saveSettings()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold text-xs">UPDATE PROFIL TOKO</button>
            </div>
        </div>

        <div id="sec-laporan" class="hidden space-y-3">
            <div id="historyList"></div>
        </div>
    </div>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl">
            <div class="receipt-inner" id="receipt-content"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 w-full max-w-xs mt-6 px-4">
            <button onclick="window.print()" class="bg-white text-black py-4 rounded-2xl font-black text-xs uppercase shadow-lg">📄 PDF / CETAK</button>
            <button onclick="closePreview()" class="bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">SELESAI</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active">KASIR</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black">STOK</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black">DATABASE</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black">RIWAYAT</button>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('v41_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v41_conf')) || { nama: "KASIR ANDA", hp: "08XX" };
        let historyTrx = JSON.parse(localStorage.getItem('v41_hist')) || [];
        let tempCart = [], restockQueue = [];

        function init() {
            document.getElementById('cfgNama').value = config.nama;
            document.getElementById('cfgHp').value = config.hp;
            document.getElementById('shopDisplay').innerText = config.nama;
            updateDropdown();
        }

        // --- FIXED IMPORT LOGIC ---
        function importCSV(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const lines = text.split(/\r?\n/);
                let newInv = [];
                
                for(let i = 0; i < lines.length; i++) {
                    if(!lines[i].trim()) continue;
                    // Deteksi separator (koma atau titik koma)
                    const separator = lines[i].includes(';') ? ';' : ',';
                    const cols = lines[i].split(separator);
                    
                    // Lewati header jika kolom pertama mengandung kata "Nama"
                    if(i === 0 && cols[0].toLowerCase().includes('nama')) continue;

                    if(cols.length >= 2) {
                        // Bersihkan angka dari titik, koma, Rp, atau spasi
                        const cleanPrice = cols[1].replace(/[^\d]/g, '');
                        const cleanStock = (cols[2] || "0").replace(/[^\d]/g, '');
                        const cleanSold = (cols[3] || "0").replace(/[^\d]/g, '');

                        newInv.push({
                            name: cols[0].trim().replace(/['"]/g, '').toUpperCase(),
                            price: parseInt(cleanPrice) || 0,
                            qty: parseInt(cleanStock) || 0,
                            sold: parseInt(cleanSold) || 0
                        });
                    }
                }

                if(newInv.length > 0) {
                    if(confirm("Ditemukan " + newInv.length + " barang. Ganti database sekarang?")) {
                        inventory = newInv;
                        saveDatabase();
                        alert("Database Berhasil Diperbarui!");
                        location.reload();
                    }
                } else {
                    alert("Gagal membaca file. Pastikan format CSV benar.");
                }
            };
            reader.readAsText(file);
        }

        function saveDatabase() {
            localStorage.setItem('v41_stok', JSON.stringify(inventory));
        }

        function saveSettings() {
            config.nama = document.getElementById('cfgNama').value.toUpperCase();
            config.hp = document.getElementById('cfgHp').value;
            localStorage.setItem('v41_conf', JSON.stringify(config));
            alert("Profil Toko Berhasil Diupdate!");
            location.reload();
        }

        // --- KASIR & TRANSAKSI ---
        function addSaleItem() {
            const idx = document.getElementById('prodSelect').value;
            if(idx === "") return;
            const qty = parseInt(document.getElementById('saleQty').value) || 1;
            const it = inventory[idx];

            if(qty > it.qty) return alert("Stok tidak cukup!");

            const exist = tempCart.find(c => c.name === it.name);
            if(exist) exist.qty += qty; else tempCart.push({name: it.name, price: it.price, qty: qty});
            
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('saleList');
            list.innerHTML = tempCart.map((c, i) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                    <div class="text-xs font-black uppercase">${c.name}<br><span class="text-blue-600">@${c.price.toLocaleString()} x ${c.qty}</span></div>
                    <button onclick="tempCart.splice(${i},1);renderCart();" class="text-red-500 font-black px-4">×</button>
                </div>
            `).join('');
            const total = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            document.getElementById('displayTotal').innerText = total.toLocaleString();
            calculateChange();
        }

        function calculateChange() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            document.getElementById('displayChange').innerText = (pay >= tot) ? (pay-tot).toLocaleString() : "0";
        }

        function processTransaction() {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0);
            const pay = parseInt(document.getElementById('salePay').value) || 0;
            if(tot === 0 || pay < tot) return alert("Cek Keranjang & Pembayaran!");

            const trx = {
                id: "INV-" + Date.now().toString().slice(-6),
                date: new Date().toLocaleString('id-ID'),
                items: [...tempCart],
                total: tot, pay: pay, change: pay-tot
            };

            // Update Stok Langsung
            trx.items.forEach(c => {
                const item = inventory.find(i => i.name === c.name);
                if(item) { item.qty -= c.qty; item.sold = (item.sold || 0) + c.qty; }
            });

            historyTrx.unshift(trx);
            saveDatabase();
            localStorage.setItem('v41_hist', JSON.stringify(historyTrx));

            showReceipt(trx);
            tempCart = []; renderCart(); updateDropdown();
            document.getElementById('salePay').value = '';
        }

        function showReceipt(trx) {
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b style="font-size:16px;">${config.nama}</b><br>${config.hp}</div>
                <div class="full-line"></div>
                <div style="font-size:10px;">ID: ${trx.id}<br>${trx.date}</div>
                <div class="full-line"></div>
                <table style="width:100%; font-size:11px;">
                    ${trx.items.map(it => `<tr><td>${it.name}</td><td align="center">${it.qty}</td><td align="right">${(it.price*it.qty).toLocaleString()}</td></tr>`).join('')}
                </table>
                <div class="full-line"></div>
                <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>TOTAL</span><span>Rp ${trx.total.toLocaleString()}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:10px;"><span>BAYAR</span><span>${trx.pay.toLocaleString()}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:10px;"><span>KEMBALI</span><span>${trx.change.toLocaleString()}</span></div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        // --- UTILS ---
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderStock();
            if(t==='laporan') renderHistory();
        }

        function updateDropdown() {
            const s = document.getElementById('prodSelect');
            s.innerHTML = '<option value="">-- CARI / PILIH BARANG --</option>';
            inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (Stok: ${it.qty})</option>`);
        }

        function renderStock() {
            document.getElementById('inventoryStatus').innerHTML = inventory.map((it, i) => `
                <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                    <div><b class="text-xs uppercase">${it.name}</b><br><span class="text-[10px] opacity-50">Stok: ${it.qty} | Laku: ${it.sold || 0}</span></div>
                    <div class="text-right">
                        <div class="text-blue-600 font-black text-xs">Rp ${it.price.toLocaleString()}</div>
                        <button onclick="deleteItem(${i})" class="text-[9px] text-red-400 font-bold uppercase">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteItem(i) { if(confirm("Hapus barang?")) { inventory.splice(i,1); saveDatabase(); renderStock(); updateDropdown(); } }
        function resetSoldData() { if(confirm("Nolkan laku harian?")) { inventory.forEach(it => it.sold = 0); saveDatabase(); renderStock(); } }

        function prepareStockReport() {
            let total = 0;
            let rows = inventory.map(it => {
                const sub = (it.sold || 0) * it.price; total += sub;
                return `<tr><td>${it.name.substring(0,12)}</td><td align="center">${it.qty+(it.sold||0)}|${it.qty}</td><td align="center">${it.sold||0}</td><td align="right">${sub.toLocaleString()}</td></tr>`;
            }).join('');
            document.getElementById('receipt-content').innerHTML = `<center><b>AUDIT STOK</b><br>${config.nama}</center><div class="full-line"></div><table style="font-size:9px; width:100%;"><tr><th>ITEM</th><th>AWL|SIS</th><th>LKU</th><th align="right">SUB</th></tr>${rows}</table><div class="full-line"></div><b>OMZET: Rp ${total.toLocaleString()}</b><br><br><p style="font-size:9px; text-align:center;">Dicetak: ${new Date().toLocaleString()}</p>`;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function renderHistory() {
            document.getElementById('historyList').innerHTML = historyTrx.map((t, i) => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                    <span class="text-[10px] font-bold">${t.id} - Rp ${t.total.toLocaleString()}</span>
                    <button onclick="reprint(${i})" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-[10px] font-bold">STRUK</button>
                </div>
            `).join('') || "<p class='text-center py-10 opacity-30'>Belum ada riwayat hari ini.</p>";
        }

        function reprint(i) { showReceipt(historyTrx[i]); }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        function addToQueue() {
            const n = document.getElementById('restockName').value, p = parseInt(document.getElementById('restockPrice').value), q = parseInt(document.getElementById('restockQty').value);
            if(!n || !p) return;
            restockQueue.push({name: n.toUpperCase(), price: p, qty: q || 0, sold: 0});
            document.getElementById('queueList').innerHTML = restockQueue.map(it => `<div>• ${it.name} (${it.qty})</div>`).join('');
            document.getElementById('btnConfirmRestock').classList.remove('hidden');
        }
        function processQueue() { inventory = [...inventory, ...restockQueue]; restockQueue = []; saveDatabase(); location.reload(); }
        function exportCSV() {
            let csv = "Nama,Harga,Stok,Terjual\n";
            inventory.forEach(it => csv += `${it.name},${it.price},${it.qty},${it.sold||0}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Database_Kasir.csv'; a.click();
        }

        init();
    </script>
</body>
</html>
