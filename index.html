<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Pro V40.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: sans-serif; padding-bottom: 120px; }
        
        /* Layout Struk Pas Kertas */
        #receipt-canvas { background: white; width: 80mm; margin: 0 auto; padding: 15px 0; color: black; font-family: 'Courier New', Courier, monospace; }
        .receipt-inner { padding: 0 2mm; font-size: 12px; line-height: 1.2; }
        .full-line { border-top: 1px dashed black; width: 100%; margin: 6px 0; }
        
        /* Tabel Audit Presisi */
        .table-audit { width: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; }
        .table-audit th { border-bottom: 1px solid black; padding: 4px 0; font-weight: bold; text-align: left; }
        .table-audit td { padding: 5px 0; overflow: hidden; white-space: nowrap; }
        
        #preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; }
        .sig-container { display: flex; justify-content: space-between; margin-top: 25px; text-align: center; font-size: 9px; }
        .sig-box { width: 48%; }
        .sig-space { height: 40px; border-bottom: 1px dotted #ccc; margin-bottom: 5px; width: 80%; margin-left: 10%; }
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 900; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
    </style>
</head>
<body>

    <div id="modal-settings" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 space-y-4 shadow-2xl">
            <h2 class="font-black text-center text-slate-800 uppercase text-sm">Pengaturan Toko</h2>
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Nama Toko</label>
                <input type="text" id="cfgNama" class="w-full bg-slate-100 p-4 rounded-2xl font-bold uppercase outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">No. HP</label>
                <input type="text" id="cfgHp" class="w-full bg-slate-100 p-4 rounded-2xl font-bold outline-none">
            </div>
            <div class="flex gap-2 pt-4">
                <button onclick="toggleSettings()" class="flex-1 bg-slate-200 text-slate-600 py-4 rounded-2xl font-bold uppercase">Batal</button>
                <button onclick="saveConfig()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold uppercase">Simpan</button>
            </div>
        </div>
    </div>

    <div id="preview-modal">
        <div id="receipt-canvas" class="shadow-2xl"><div class="receipt-inner" id="receipt-content"></div></div>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mt-6 px-4">
            <button onclick="printBluetooth()" class="bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg uppercase">🖨️ Cetak Ke Printer</button>
            <button onclick="closePreview()" class="bg-red-600 text-white py-4 rounded-2xl font-black text-xs uppercase">Kembali</button>
        </div>
    </div>

    <div class="bg-slate-900 text-white p-5 flex justify-between items-center sticky top-0 z-40">
        <div><h1 id="shopNameDisplay" class="font-black text-lg uppercase tracking-tight">TOKO KITA</h1><p class="text-[9px] opacity-60 uppercase">Audit Precision V40.0</p></div>
        <button onclick="toggleSettings()" class="bg-slate-800 w-12 h-12 rounded-2xl flex items-center justify-center text-xl">⚙️</button>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">
        <div id="sec-kasir" class="space-y-4">
            <div class="bg-white p-5 rounded-3xl border shadow-sm space-y-3">
                <select id="prodSelect" class="w-full bg-blue-50 p-4 rounded-2xl font-black text-sm outline-none"></select>
                <div class="flex gap-2">
                    <input type="number" id="saleQty" value="1" class="flex-1 bg-slate-50 p-4 rounded-2xl text-center font-black">
                    <button onclick="addSaleItem()" class="flex-[2] bg-blue-700 text-white py-4 rounded-2xl font-black uppercase">TAMBAH</button>
                </div>
            </div>
            <div id="saleList" class="space-y-2"></div>
            <div class="bg-slate-900 text-white p-6 rounded-[40px] space-y-4">
                <div class="flex justify-between items-center"><span class="text-xs opacity-50 uppercase font-bold">Total Tagihan</span><span class="text-2xl font-black text-blue-400">Rp <span id="displayTotal">0</span></span></div>
                <input type="number" id="salePay" placeholder="NOMINAL BAYAR" class="w-full bg-slate-800 p-4 rounded-2xl text-emerald-400 font-bold outline-none text-center">
                <button onclick="finalProcess('PENJUALAN')" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl">PROSES NOTA</button>
            </div>
        </div>

        <div id="sec-retur" class="hidden space-y-4">
            <div class="flex gap-2">
                <button onclick="renderInventory('audit')" class="flex-1 bg-slate-900 text-white py-3 rounded-xl text-[10px] font-bold uppercase shadow-md">📊 Mode Audit</button>
                <button onclick="renderInventory('manage')" class="flex-1 bg-blue-100 text-blue-700 py-3 rounded-xl text-[10px] font-bold uppercase">✏️ Edit Data</button>
            </div>
            <div id="inventoryStatus" class="space-y-2"></div>
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button onclick="prepareStockReport()" class="bg-orange-500 text-white py-5 rounded-2xl font-black text-[10px] uppercase shadow-lg">🖨️ CETAK AUDIT</button>
                <button onclick="resetAuditOnly()" class="bg-white text-red-600 border border-red-200 py-5 rounded-2xl font-black text-[10px] uppercase">🧹 RESET LAKU</button>
            </div>
        </div>

        <div id="sec-ambil" class="hidden space-y-4">
            <div class="bg-emerald-600 p-6 rounded-[30px] text-white space-y-3 shadow-lg">
                <input type="text" id="restockName" placeholder="NAMA BARANG" class="w-full p-4 rounded-xl text-slate-900 font-bold uppercase outline-none">
                <div class="flex gap-2">
                    <input type="number" id="restockPrice" placeholder="HARGA" class="flex-1 p-4 rounded-xl text-slate-900 font-bold outline-none">
                    <input type="number" id="restockQty" placeholder="STOK" class="w-24 p-4 rounded-xl text-slate-900 font-bold outline-none">
                </div>
                <button onclick="addToQueue()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase">DAFTARKAN</button>
            </div>
            <div id="queueList" class="space-y-2"></div>
            <button id="btnConfirmRestock" onclick="processQueue()" class="hidden w-full bg-emerald-700 text-white py-5 rounded-2xl font-black uppercase shadow-lg">KONFIRMASI SIMPAN</button>
        </div>

        <div id="sec-laporan" class="hidden space-y-3">
            <div id="historyList"></div>
            <button onclick="resetAllData()" class="w-full mt-10 text-red-400 text-[9px] uppercase font-bold py-4">Format Database</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="switchTab('kasir')" id="t-kasir" class="flex-1 py-5 text-[10px] font-black tab-active">KASIR</button>
        <button onclick="switchTab('retur')" id="t-retur" class="flex-1 py-5 text-[10px] font-black">STOK</button>
        <button onclick="switchTab('ambil')" id="t-ambil" class="flex-1 py-5 text-[10px] font-black">BARANG</button>
        <button onclick="switchTab('laporan')" id="t-laporan" class="flex-1 py-5 text-[10px] font-black">RIWAYAT</button>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('v40_stok')) || [];
        let config = JSON.parse(localStorage.getItem('v40_conf')) || { nama: "NAMA TOKO ANDA", hp: "08XX-XXXX-XXXX" };
        let historyTrx = JSON.parse(localStorage.getItem('v40_hist')) || [];
        let tempCart = [], restockQueue = [];

        function init() { document.getElementById('cfgNama').value = config.nama; document.getElementById('cfgHp').value = config.hp; updateUI(); updateDropdown(); }
        function toggleSettings() { document.getElementById('modal-settings').classList.toggle('hidden'); }
        function saveConfig() { config.nama = document.getElementById('cfgNama').value.toUpperCase(); config.hp = document.getElementById('cfgHp').value; localStorage.setItem('v40_conf', JSON.stringify(config)); updateUI(); toggleSettings(); }
        function updateUI() { document.getElementById('shopNameDisplay').innerText = config.nama; }
        
        function switchTab(t) {
            ['sec-kasir','sec-retur','sec-ambil','sec-laporan'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['t-kasir','t-retur','t-ambil','t-laporan'].forEach(b => document.getElementById(b).classList.remove('tab-active'));
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).classList.add('tab-active');
            if(t==='retur') renderInventory('audit');
            if(t==='laporan') renderHistory();
        }

        function renderInventory(mode) {
            const container = document.getElementById('inventoryStatus');
            container.innerHTML = inventory.map((it, i) => {
                const awal = it.qty + (it.sold || 0);
                if (mode === 'audit') {
                    return `<div class="bg-white p-4 rounded-xl border flex justify-between shadow-sm items-center"><div class="text-[10px] font-bold uppercase">${it.name}<br><span class="font-normal opacity-40">${awal} | ${it.qty} (Laku ${it.sold})</span></div><div class="text-right font-black text-blue-600 text-xs">Rp ${(it.sold*it.price).toLocaleString()}</div></div>`;
                } else {
                    return `<div class="bg-white p-4 rounded-xl border shadow-sm space-y-2"><div class="flex justify-between items-center"><input type="text" onchange="inventory[${i}].name=this.value.toUpperCase();saveInv()" value="${it.name}" class="w-full text-xs font-black outline-none uppercase"></div><div class="flex gap-2"><input type="number" onchange="inventory[${i}].price=parseInt(this.value);saveInv()" value="${it.price}" class="flex-1 bg-slate-50 p-2 rounded font-bold text-xs text-blue-600"><input type="number" onchange="inventory[${i}].qty=parseInt(this.value);saveInv()" value="${it.qty}" class="w-20 bg-slate-50 p-2 rounded font-bold text-xs text-center"></div></div>`;
                }
            }).join('') || "<div class='py-10 text-center opacity-20 text-xs'>KOSONG</div>";
        }

        function saveInv() { localStorage.setItem('v40_stok', JSON.stringify(inventory)); updateDropdown(); }

        // --- PREPARE AUDIT (SPACING "I" & ALIGNED) ---
        function prepareStockReport() {
            let total = 0;
            let rows = inventory.map(it => {
                const awal = it.qty + (it.sold || 0);
                const sub = it.sold * it.price;
                total += sub;
                return `<tr><td style="width:35%">${it.name.substring(0,12)}</td><td style="width:25%">${awal} | ${it.qty}</td><td align="center" style="width:10%">${it.sold}</td><td align="right" style="width:30%"><b>${sub.toLocaleString()}</b></td></tr>`;
            }).join('');

            window.activeTrx = { type: "LAPORAN AUDIT", date: new Date().toLocaleString('id-ID'), total };
            
            document.getElementById('receipt-content').innerHTML = `
                <div style="text-align:center;"><b style="font-size:16px;">${config.nama}</b><br>HP: ${config.hp}</div>
                <div class="full-line"></div>
                <div style="text-align:center; font-weight:bold; margin-bottom:5px;">LAPORAN AUDIT STOK</div>
                <table class="table-audit">
                    <thead>
                        <tr>
                            <th style="width:35%">BARANG</th>
                            <th style="width:25%">AWL | SIS</th>
                            <th align="center" style="width:10%">LKU</th>
                            <th align="right" style="width:30%">OMZET</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="full-line"></div>
                <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;"><span>TOTAL OMZET</span><span>Rp ${total.toLocaleString()}</span></div>
                <div class="sig-container">
                    <div class="sig-box">PENGAMBIL<div class="sig-space"></div>( ............ )</div>
                    <div class="sig-box">PETUGAS<div class="sig-space"></div>( ............ )</div>
                </div>
                <div class="full-line" style="margin-top:10px;"></div>
                <div style="text-align:center; font-size:9px; opacity:0.6;">${window.activeTrx.date}</div>
            `;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        async function printBluetooth() {
            const trx = window.activeTrx;
            const CHUNK = 20;
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                const pad = (s, l, a='left') => { s=s.toString(); return a==='left' ? s.padEnd(l) : s.padStart(l); };

                let c = '\x1b\x40\x1b\x61\x01\x1b\x21\x10' + config.nama + '\n\x1b\x21\x00HP: ' + config.hp + '\n------------------------------------------------\n' + trx.type + '\n------------------------------------------------\n\x1b\x61\x00';
                
                if(trx.type === "LAPORAN AUDIT") {
                    c += pad("ITEM", 15) + pad("AWL | SIS", 13) + pad("LKU", 5, 'center') + pad("OMZET", 15, 'right') + "\n";
                    c += "------------------------------------------------\n";
                    inventory.forEach(it => {
                        const awal = it.qty + (it.sold || 0);
                        c += pad(it.name.substring(0, 14), 15) + pad(`${awal} | ${it.qty}`, 13) + pad(it.sold, 5, 'center') + pad((it.sold*it.price).toLocaleString(), 15, 'right') + "\n";
                    });
                    c += "------------------------------------------------\n" + pad("TOTAL OMZET", 30) + pad("Rp "+trx.total.toLocaleString(), 18, 'right') + "\n\n";
                    c += pad(" PENGAMBIL BARANG", 24) + pad("PETUGAS/PEMILIK ", 24, 'right') + "\n\n\n\n";
                    c += pad("(               )", 24) + pad("(               )", 24, 'right') + "\n";
                }

                c += `\n\x1b\x61\x01` + trx.date + `\n\n\n\n\n\x1b\x6d`;
                const enc = new TextEncoder().encode(c);
                for (let i = 0; i < enc.length; i += CHUNK) { await char.writeValue(enc.slice(i, i + CHUNK)); await new Promise(r => setTimeout(r, 25)); }
                closePreview();
            } catch (err) { alert("Printer tidak terhubung!"); }
        }

        // --- SISTEM KASIR & DROPDOWN ---
        function addSaleItem() {
            const i = document.getElementById('prodSelect').value; if(i==="") return;
            const q = parseInt(document.getElementById('saleQty').value) || 1;
            const it = inventory[i]; if(q > it.qty) return alert("Stok kurang!");
            const ex = tempCart.find(c => c.name === it.name); if(ex) ex.qty += q; else tempCart.push({name: it.name, price: it.price, qty: q});
            renderSaleList();
        }
        function renderSaleList() {
            document.getElementById('saleList').innerHTML = tempCart.map((c, i) => `<div class="bg-white p-4 rounded-xl border flex justify-between shadow-sm"><div class="text-xs font-bold uppercase">${c.name}<br><span class="opacity-40">@${c.price.toLocaleString()} x ${c.qty}</span></div><button onclick="tempCart.splice(${i},1);renderSaleList()" class="text-red-500 font-bold px-2">×</button></div>`).join('');
            document.getElementById('displayTotal').innerText = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0).toLocaleString();
        }
        function finalProcess(m) {
            const tot = tempCart.reduce((a,b)=>a+(b.price*b.qty), 0); if(tot === 0) return alert("Kosong!");
            window.activeTrx = { type:m, date: new Date().toLocaleString('id-ID'), tot, items:[...tempCart] };
            document.getElementById('receipt-content').innerHTML = `<div style="text-align:center;"><b>${config.nama}</b></div><div class="full-line"></div>` + window.activeTrx.items.map(it => `<div class="flex justify-between"><span>${it.name}</span><span>${(it.price*it.qty).toLocaleString()}</span></div>`).join('') + `<div class="full-line"></div><b>TOTAL: Rp ${tot.toLocaleString()}</b>`;
            document.getElementById('preview-modal').style.display = 'flex';
        }
        function addToQueue() {
            const n = document.getElementById('restockName').value, p = parseInt(document.getElementById('restockPrice').value), q = parseInt(document.getElementById('restockQty').value);
            if(!n || !p) return alert("Cek input!");
            restockQueue.push({name: n.toUpperCase(), price: p, qty: q || 0});
            document.getElementById('queueList').innerHTML = restockQueue.map(it => `<div class="p-3 bg-white border rounded-xl text-xs font-bold uppercase">${it.name} (${it.qty})</div>`).join('');
            document.getElementById('btnConfirmRestock').classList.remove('hidden');
        }
        function processQueue() { restockQueue.forEach(it => { const ex = inventory.find(i=>i.name===it.name); if(ex) { ex.qty += it.qty; ex.price = it.price; } else { inventory.push({name:it.name, price:it.price, qty:it.qty, sold:0}); } }); saveInv(); location.reload(); }
        function resetAuditOnly() { if(confirm("Nolkan data laku?")) { inventory = inventory.map(it => ({ ...it, sold: 0 })); saveInv(); renderInventory('audit'); } }
        function updateDropdown() { const s = document.getElementById('prodSelect'); s.innerHTML = '<option value="">-- PILIH BARANG --</option>'; inventory.forEach((it, i) => s.innerHTML += `<option value="${i}">${it.name} (${it.qty})</option>`); }
        function renderHistory() { document.getElementById('historyList').innerHTML = historyTrx.map((t, i) => `<div class="bg-white p-4 rounded-xl border flex justify-between items-center mb-2 shadow-sm"><div class="text-[10px] font-bold uppercase">NOTA ${i+1}<br>Rp ${t.tot.toLocaleString()}</div><button onclick="reprint(${i})" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-[10px]">CETAK</button></div>`).join(''); }
        function reprint(i) { window.activeTrx = {...historyTrx[i]}; finalProcess('REPRINT'); }
        function resetAllData() { if(confirm("Hapus semua?")) { localStorage.clear(); location.reload(); } }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
